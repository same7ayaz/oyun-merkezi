<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hayatta Kal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #0f0f1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }

        .game-wrapper {
            background: #1a1a2e;
            border-radius: 24px;
            padding: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .game-container {
            position: relative;
            width: 800px;
            height: 600px;
            border-radius: 16px;
            overflow: hidden;
            background: #0a0a12;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #0a0a12;
            touch-action: none;
        }

        /* HUD */
        .hud {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 24px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            padding: 8px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: white;
            font-size: 14px;
            font-weight: 500;
            z-index: 10;
            pointer-events: none;
        }

        .hud span {
            color: #8888aa;
        }

        .hud .val {
            color: #fff;
        }

        .hud .score-val {
            color: #fbbf24;
        }

        .hud .size-val {
            color: #60a5fa;
        }

        /* Joystick */
        .joystick-area {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.08);
            z-index: 10;
            touch-action: none;
        }

        .joystick-knob {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, #60a5fa, #2563eb);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 20px rgba(96, 165, 250, 0.3);
            transition: none;
            pointer-events: none;
        }

        /* Game Over */
        .game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 20;
            border-radius: 16px;
        }

        .game-over.show {
            display: flex;
        }

        .game-over h1 {
            font-size: 48px;
            color: #ef4444;
            margin-bottom: 4px;
        }

        .game-over .sub {
            color: #8888aa;
            font-size: 16px;
        }

        .game-over .final-score {
            color: #fbbf24;
            font-size: 40px;
            font-weight: 700;
            margin: 6px 0 20px;
        }

        .btn {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border: none;
            color: white;
            padding: 12px 36px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .btn-home {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 10px 28px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
            text-decoration: none;
        }

        .btn-home:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Responsive */
        @media (max-width: 850px) {
            .game-container {
                width: 95vw;
                height: 80vh;
            }
            .game-wrapper {
                padding: 10px;
                border-radius: 16px;
            }
            .joystick-area {
                width: 100px;
                height: 100px;
                bottom: 20px;
                left: 20px;
            }
            .joystick-knob {
                width: 40px;
                height: 40px;
            }
            .hud {
                font-size: 12px;
                padding: 6px 14px;
                gap: 14px;
                top: 8px;
            }
        }

        @media (max-width: 500px) {
            .joystick-area {
                width: 80px;
                height: 80px;
                bottom: 16px;
                left: 16px;
            }
            .joystick-knob {
                width: 34px;
                height: 34px;
            }
            .game-over h1 {
                font-size: 32px;
            }
            .game-over .final-score {
                font-size: 30px;
            }
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="game-container">
            <canvas id="gameCanvas"></canvas>

            <!-- HUD -->
            <div class="hud">
                <div>⭐ <span class="val score-val" id="scoreDisplay">0</span></div>
                <div>📏 <span class="val size-val" id="sizeDisplay">20</span></div>
                <div>👾 <span class="val" id="enemyCount">0</span></div>
            </div>

            <!-- Joystick -->
            <div class="joystick-area" id="joystickArea">
                <div class="joystick-knob" id="joystickKnob"></div>
            </div>

            <!-- Game Over -->
            <div class="game-over" id="gameOver">
                <h1>💀 ÖLDÜN</h1>
                <div class="sub">Puanın</div>
                <div class="final-score" id="finalScore">0</div>
                <button class="btn" id="restartBtn">🔄 Tekrar Oyna</button>
                <a class="btn-home" href="index.html">← Ana Sayfa</a>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  HAYATTA KAL - Sade ve Eğlenceli
        // ============================================================

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let W, H;

        function resize() {
            const rect = canvas.parentElement.getBoundingClientRect();
            W = canvas.width = rect.width;
            H = canvas.height = rect.height;
        }
        resize();
        window.addEventListener('resize', resize);

        // ============================================================
        //  OYUN DEĞİŞKENLERİ
        // ============================================================

        // Harita boyutu (ekrandan büyük)
        const MAP_SIZE = 2000;

        // Kamera
        const cam = { x: 0, y: 0 };

        // Oyuncu
        const player = {
            x: 0,
            y: 0,
            radius: 20,
            targetRadius: 20,
            speed: 3,
            alive: true,
            score: 0
        };

        // Yemekler
        let foods = [];

        // Düşmanlar
        let enemies = [];

        // Joystick
        const joystick = {
            active: false,
            dx: 0,
            dy: 0,
            area: document.getElementById('joystickArea'),
            knob: document.getElementById('joystickKnob')
        };

        // DOM referansları
        const scoreDisplay = document.getElementById('scoreDisplay');
        const sizeDisplay = document.getElementById('sizeDisplay');
        const enemyCount = document.getElementById('enemyCount');
        const gameOverEl = document.getElementById('gameOver');
        const finalScoreEl = document.getElementById('finalScore');
        const restartBtn = document.getElementById('restartBtn');

        // Zamanlayıcılar
        let foodSpawnTimer = 0;
        let enemySpawnTimer = 0;
        let frameCount = 0;

        // ============================================================
        //  YARDIMCI FONKSİYONLAR
        // ============================================================

        function rand(min, max) { return Math.random() * (max - min) + min; }

        function randInt(min, max) { return Math.floor(rand(min, max + 1)); }

        function dist(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }

        function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

        // ============================================================
        //  YEMEK OLUŞTUR
        // ============================================================

        function createFood() {
            const angle = rand(0, Math.PI * 2);
            const distance = rand(200, MAP_SIZE / 2);
            return {
                x: player.x + Math.cos(angle) * distance,
                y: player.y + Math.sin(angle) * distance,
                radius: rand(4, 10),
                color: `hsl(${randInt(30, 60)}, 80%, 60%)`,
                pulse: rand(0, Math.PI * 2)
            };
        }

        // ============================================================
        //  DÜŞMAN OLUŞTUR
        // ============================================================

        function createEnemy() {
            const sizeRatio = rand(0.4, 2.5);
            const radius = Math.max(10, player.radius * sizeRatio);

            const angle = rand(0, Math.PI * 2);
            const distance = rand(300, MAP_SIZE / 2);

            return {
                x: player.x + Math.cos(angle) * distance,
                y: player.y + Math.sin(angle) * distance,
                radius: radius,
                speed: rand(0.3, 1.2) * (1 + (1 - sizeRatio) * 0.3),
                angle: rand(0, Math.PI * 2),
                turnTimer: randInt(0, 100),
                turnInterval: randInt(60, 180),
                isBig: sizeRatio > 1.2,
                color: `hsl(${sizeRatio > 1.2 ? randInt(340, 20) : randInt(100, 160)}, 70%, 50%)`
            };
        }

        // ============================================================
        //  OYUNU BAŞLAT
        // ============================================================

        function initGame() {
            player.x = 0;
            player.y = 0;
            player.radius = 20;
            player.targetRadius = 20;
            player.speed = 3;
            player.alive = true;
            player.score = 0;

            foods = [];
            enemies = [];
            cam.x = 0;
            cam.y = 0;

            gameOverEl.classList.remove('show');

            // Başlangıç yemekleri
            for (let i = 0; i < 20; i++) {
                foods.push(createFood());
            }

            // Başlangıç düşmanları
            for (let i = 0; i < 6; i++) {
                enemies.push(createEnemy());
            }

            updateHUD();
        }

        // ============================================================
        //  GÜNCELLEME
        // ============================================================

        function update() {
            if (!player.alive) return;

            frameCount++;

            // ---- JOYSTICK KONTROL ----
            let dx = 0,
                dy = 0;
            if (joystick.active) {
                const mag = Math.hypot(joystick.dx, joystick.dy);
                if (mag > 0.1) {
                    const normalized = Math.min(1, mag);
                    dx = (joystick.dx / mag) * player.speed * normalized;
                    dy = (joystick.dy / mag) * player.speed * normalized;
                }
            }

            // ---- OYUNCU HAREKET ----
            player.x += dx;
            player.y += dy;

            // Harita sınırları
            const limit = MAP_SIZE / 2 - player.radius;
            player.x = clamp(player.x, -limit, limit);
            player.y = clamp(player.y, -limit, limit);

            // Boyut güncelle
            player.radius += (player.targetRadius - player.radius) * 0.06;
            player.radius = Math.max(12, player.radius);

            // ---- KAMERA ----
            cam.x = player.x - W / 2;
            cam.y = player.y - H / 2;

            // ---- YEMEKLER ----
            for (let i = foods.length - 1; i >= 0; i--) {
                const f = foods[i];
                if (dist(player.x, player.y, f.x, f.y) < player.radius + f.radius) {
                    player.targetRadius += f.radius * 0.12;
                    player.score += Math.floor(f.radius) + 1;
                    foods.splice(i, 1);
                }
            }

            // Yemek spawn
            foodSpawnTimer++;
            if (foodSpawnTimer > 20 && foods.length < 40) {
                foods.push(createFood());
                foodSpawnTimer = 0;
            }

            // ---- DÜŞMANLAR ----
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];

                // Hareket
                e.turnTimer++;
                if (e.turnTimer > e.turnInterval) {
                    e.turnTimer = 0;
                    e.angle += rand(-0.3, 0.3);
                    e.turnInterval = randInt(60, 200);
                }

                // Büyük düşmanlar oyuncuya doğru yönelir
                if (e.isBig) {
                    const toPlayer = Math.atan2(player.y - e.y, player.x - e.x);
                    e.angle += (toPlayer - e.angle) * 0.02;
                }

                e.angle += rand(-0.02, 0.02);
                e.x += Math.cos(e.angle) * e.speed;
                e.y += Math.sin(e.angle) * e.speed;

                // Harita sınırları
                const eLimit = MAP_SIZE / 2 - e.radius;
                if (e.x > eLimit) { e.x = eLimit;
                    e.angle = Math.PI - e.angle; }
                if (e.x < -eLimit) { e.x = -eLimit;
                    e.angle = Math.PI - e.angle; }
                if (e.y > eLimit) { e.y = eLimit;
                    e.angle = -e.angle; }
                if (e.y < -eLimit) { e.y = -eLimit;
                    e.angle = -e.angle; }

                // Düşman-oyuncu çarpışması
                const d = dist(player.x, player.y, e.x, e.y);
                const threshold = player.radius + e.radius;

                if (d < threshold) {
                    if (player.radius > e.radius * 1.2) {
                        // Oyuncu düşmanı yedi
                        player.targetRadius += e.radius * 0.06;
                        player.score += Math.floor(e.radius * 0.5) + 2;
                        enemies.splice(i, 1);
                    } else if (e.radius > player.radius * 1.2) {
                        // Düşman oyuncuyu yedi
                        player.alive = false;
                        showGameOver();
                        return;
                    } else {
                        // Eşit - itiş
                        const ang = Math.atan2(e.y - player.y, e.x - player.x);
                        const overlap = (threshold - d) / 2 + 1;
                        player.x -= Math.cos(ang) * overlap;
                        player.y -= Math.sin(ang) * overlap;
                        e.x += Math.cos(ang) * overlap;
                        e.y += Math.sin(ang) * overlap;
                    }
                }

                // Düşman-düşman çarpışma
                for (let j = i - 1; j >= 0; j--) {
                    const other = enemies[j];
                    const d2 = dist(e.x, e.y, other.x, other.y);
                    const minD = e.radius + other.radius;
                    if (d2 < minD && d2 > 0.01) {
                        const ang = Math.atan2(other.y - e.y, other.x - e.x);
                        const overlap = (minD - d2) / 2;
                        e.x -= Math.cos(ang) * overlap;
                        e.y -= Math.sin(ang) * overlap;
                        other.x += Math.cos(ang) * overlap;
                        other.y += Math.sin(ang) * overlap;
                    }
                }
            }

            // Düşman spawn
            enemySpawnTimer++;
            if (enemySpawnTimer > 120 && enemies.length < 15) {
                enemies.push(createEnemy());
                enemySpawnTimer = 0;
            }

            updateHUD();
        }

        // ============================================================
        //  ÇİZİM
        // ============================================================

        function draw() {
            ctx.clearRect(0, 0, W, H);

            // ---- ARKA PLAN ----
            // Grid
            const gridSize = 60;
            const ox = -cam.x % gridSize;
            const oy = -cam.y % gridSize;

            ctx.strokeStyle = 'rgba(255,255,255,0.04)';
            ctx.lineWidth = 1;
            for (let x = ox - gridSize; x < W + gridSize; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, H);
                ctx.stroke();
            }
            for (let y = oy - gridSize; y < H + gridSize; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(W, y);
                ctx.stroke();
            }

            // ---- YEMEKLER ----
            for (const f of foods) {
                const sx = f.x - cam.x;
                const sy = f.y - cam.y;
                if (sx < -50 || sx > W + 50 || sy < -50 || sy > H + 50) continue;

                // Işıltı efekti
                const pulse = Math.sin(f.pulse + frameCount * 0.05) * 0.15 + 0.85;
                const r = f.radius * pulse;

                const grad = ctx.createRadialGradient(sx - r * 0.2, sy - r * 0.2, 0, sx, sy, r);
                grad.addColorStop(0, '#fff');
                grad.addColorStop(0.3, f.color);
                grad.addColorStop(1, 'rgba(0,0,0,0.2)');

                ctx.shadowColor = f.color;
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.arc(sx, sy, r, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.shadowBlur = 0;

                // Yıldız işareti ✦
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.font = `${r * 1.2}px monospace`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('✦', sx, sy + 1);
            }

            // ---- DÜŞMANLAR ----
            for (const e of enemies) {
                const sx = e.x - cam.x;
                const sy = e.y - cam.y;
                if (sx < -100 || sx > W + 100 || sy < -100 || sy > H + 100) continue;

                ctx.shadowColor = 'rgba(0,0,0,0.4)';
                ctx.shadowBlur = 20;

                const grad = ctx.createRadialGradient(
                    sx - e.radius * 0.2, sy - e.radius * 0.2, 0,
                    sx, sy, e.radius
                );
                grad.addColorStop(0, e.color);
                grad.addColorStop(1, 'rgba(0,0,0,0.4)');

                ctx.beginPath();
                ctx.
