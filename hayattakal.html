<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Hayatta Kal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body {
      background: #2e0000;
      color: white;
      font-family: sans-serif;
      text-align: center;
      padding: 20px 12px;
      margin: 0;
    }
    h1 { color: #ff5252; font-size: 24px; }
    #oyunKapsayici {
      position: relative;
      width: 360px;
      max-width: 100%;
      height: 440px;
      margin: 0 auto;
      border: 3px solid #ff5252;
      border-radius: 14px;
      overflow: hidden;
      touch-action: none;
    }
    canvas { display: block; width: 100%; height: 100%; background-color: #1a0505; }
    #joystickTaban {
      position: absolute; left: 20px; bottom: 20px;
      width: 90px; height: 90px; border-radius: 50%;
      background-color: rgba(255,255,255,0.1);
      border: 2px solid rgba(255,82,82,0.6);
      z-index: 10;
    }
    #joystickTop {
      position: absolute; left: 50%; top: 50%;
      width: 40px; height: 40px; border-radius: 50%;
      background-color: rgba(255,82,82,0.85);
      transform: translate(-50%, -50%);
    }
    button.baslat {
      margin-top: 10px; background-color: #ff5252; border: none;
      color: #2e0000; padding: 12px 26px; font-size: 16px;
      font-weight: 700; border-radius: 10px; cursor: pointer;
    }
    a { color: #ff5252; display: inline-block; margin-top: 20px; text-decoration: none; }
  </style>
</head>
<body>
  <h1>🔴 Hayatta Kal</h1>
  <p id="skor">Boyut: 10</p>
  <div id="oyunKapsayici">
    <canvas id="oyunAlani" width="360" height="440"></canvas>
    <div id="joystickTaban"><div id="joystickTop"></div></div>
  </div>
  <p id="durum">Joystick ile yön ver</p>
  <button class="baslat" onclick="oyunuBaslat()">▶ Başlat</button>
  <a href="index.html">⬅ Ana sayfaya dön</a>
  <script>
    const canvas = document.getElementById("oyunAlani");
const ctx = canvas.getContext("2d");
const W = 360, H = 440;
const DUNYA_GENISLIK = 2200;
const DUNYA_YUKSEKLIK = 2200;
const MAKS_BOT = 14;
const ALGILAMA_MESAFESI = 160;
const TAKIP_SURESI = 10000;

let oyuncu, botlar, yemler, oyunAktif, animasyonId;
let kamera = { x: 0, y: 0 };
let zoom = 1;

function rastgele(min, max) {
  return Math.random() * (max - min) + min;
}

function oyunuBaslat() {
  oyuncu = { x: DUNYA_GENISLIK / 2, y: DUNYA_YUKSEKLIK / 2, r: 12, hiz: 2.6 };
  botlar = [];
  yemler = [];
  oyunAktif = true;
  for (let i = 0; i < 130; i++) {
    yemler.push({ x: rastgele(20, DUNYA_GENISLIK - 20), y: rastgele(20, DUNYA_YUKSEKLIK - 20), r: 4 });
  }
  for (let i = 0; i < MAKS_BOT; i++) {
    botUret();
  }
  document.getElementById("skor").textContent = "Boyut: " + Math.round(oyuncu.r);
  document.getElementById("durum").textContent = "Hayatta kal!";
  if (animasyonId) cancelAnimationFrame(animasyonId);
  dongu();
}

function botUret() {
  const kucukMu = Math.random() < 0.55;
  let r;
  if (kucukMu) {
    r = rastgele(6, Math.max(8, oyuncu.r * 0.75));
  } else {
    r = rastgele(oyuncu.r * 1.15, oyuncu.r * 1.8 + 10);
  }
  r = Math.min(r, 70);
  let x = rastgele(r + 10, DUNYA_GENISLIK - r - 10);
  let y = rastgele(r + 10, DUNYA_YUKSEKLIK - r - 10);
  let deneme = 0;
  while (deneme < 20 && Math.hypot(x - oyuncu.x, y - oyuncu.y) < 150) {
    x = rastgele(r + 10, DUNYA_GENISLIK - r - 10);
    y = rastgele(r + 10, DUNYA_YUKSEKLIK - r - 10);
    deneme++;
  }
  botlar.push({
    x: x, y: y, r: r,
    vx: rastgele(-1, 1), vy: rastgele(-1, 1),
    yonSayaci: 0,
    davranisBasi: 0
  });
}

const joyTaban = document.getElementById("joystickTaban");
const joyTop = document.getElementById("joystickTop");
let joyAktif = false;
let joyVektor = { x: 0, y: 0 };
let joyMerkez = { x: 0, y: 0 };
const joyYaricap = 35;

function joyBasla(clientX, clientY) {
  joyAktif = true;
  const rect = joyTaban.getBoundingClientRect();
  joyMerkez = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
}

function joyHareket(clientX, clientY) {
  if (!joyAktif) return;
  let dx = clientX - joyMerkez.x;
  let dy = clientY - joyMerkez.y;
  const uzunluk = Math.hypot(dx, dy);
  if (uzunluk > joyYaricap) {
    dx = (dx / uzunluk) * joyYaricap;
    dy = (dy / uzunluk) * joyYaricap;
  }
  joyTop.style.left = "calc(50% + " + dx + "px)";
  joyTop.style.top = "calc(50% + " + dy + "px)";
  joyVektor = { x: dx / joyYaricap, y: dy / joyYaricap };
}

function joyBitir() {
  joyAktif = false;
  joyVektor = { x: 0, y: 0 };
  joyTop.style.left = "50%";
  joyTop.style.top = "50%";
}

joyTaban.addEventListener("touchstart", function(e) {
  e.preventDefault();
  const t = e.touches[0];
  joyBasla(t.clientX, t.clientY);
}, { passive: false });

joyTaban.addEventListener("touchmove", function(e) {
  e.preventDefault();
  const t = e.touches[0];
  joyHareket(t.clientX, t.clientY);
}, { passive: false });

joyTaban.addEventListener("touchend", function(e) {
  e.preventDefault();
  joyBitir();
}, { passive: false });

joyTaban.addEventListener("mousedown", function(e) {
  joyBasla(e.clientX, e.clientY);
});
document.addEventListener("mousemove", function(e) {
  if (joyAktif) joyHareket(e.clientX, e.clientY);
});
document.addEventListener("mouseup", function() {
  joyBitir();
});

function botDavranisGuncelle(bot, simdi) {
  const mesafe = Math.hypot(oyuncu.x - bot.x, oyuncu.y - bot.y);
  const buyukTehdit = bot.r > oyuncu.r + 2;
  const kucukAv = bot.r < oyuncu.r - 2;

  if (bot.davranisBasi > 0 && simdi - bot.davranisBasi > TAKIP_SURESI) {
    bot.davranisBasi = 0;
  }

  if (bot.davranisBasi === 0 && mesafe < ALGILAMA_MESAFESI) {
    if (buyukTehdit || kucukAv) {
      bot.davranisBasi = simdi;
    }
  }

  if (bot.davranisBasi > 0) {
    const yx = oyuncu.x - bot.x;
    const yy = oyuncu.y - bot.y;
    const uzunluk = Math.hypot(yx, yy) || 1;
    const yon = buyukTehdit ? 1 : -1;
    bot.vx = (yx / uzunluk) * yon;
    bot.vy = (yy / uzunluk) * yon;
    return buyukTehdit ? 1.9 : 1.5;
  }

  bot.yonSayaci++;
  if (bot.yonSayaci > 60) {
    bot.vx = rastgele(-1, 1);
    bot.vy = rastgele(-1, 1);
    bot.yonSayaci = 0;
  }
  return 1.1;
}

function dongu() {
  if (!oyunAktif) return;

  if (joyVektor.x !== 0 || joyVektor.y !== 0) {
    oyuncu.x += joyVektor.x * oyuncu.hiz;
    oyuncu.y += joyVektor.y * oyuncu.hiz;
  }

  oyuncu.x = Math.max(oyuncu.r, Math.min(DUNYA_GENISLIK - oyuncu.r, oyuncu.x));
  oyuncu.y = Math.max(oyuncu.r, Math.min(DUNYA_YUKSEKLIK - oyuncu.r, oyuncu.y));

  zoom = Math.max(0.45, Math.min(1, 22 / oyuncu.r));

  const viewW = W / zoom;
  const viewH = H / zoom;
  kamera.x = Math.max(0, Math.min(DUNYA_GENISLIK - viewW, oyuncu.x - viewW / 2));
  kamera.y = Math.max(0, Math.min(DUNYA_YUKSEKLIK - viewH, oyuncu.y - viewH / 2));

  const simdi = performance.now();
  for (let i = 0; i < botlar.length; i++) {
    const bot = botlar[i];
    const hiz = botDavranisGuncelle(bot, simdi);
    bot.x += bot.vx * hiz;
    bot.y += bot.vy * hiz;
    bot.x = Math.max(bot.r, Math.min(DUNYA_GENISLIK - bot.r, bot.x));
    bot.y = Math.max(bot.r, Math.min(DUNYA_YUKSEKLIK - bot.r, bot.y));
  }

  for (let i = yemler.length - 1; i >= 0; i--) {
    const y = yemler[i];
    if (Math.hypot(oyuncu.x - y.x, oyuncu.y - y.y) < oyuncu.r + y.r) {
      oyuncu.r += 0.4;
      yemler.splice(i, 1);
      yemler.push({ x: rastgele(20, DUNYA_GENISLIK - 20), y: rastgele(20, DUNYA_YUKSEKLIK - 20), r: 4 });
    }
  }

  const silinecekler = [];
  for (let i = botlar.length - 1; i >= 0; i--) {
    const bot = botlar[i];
    const mesafe = Math.hypot(oyuncu.x - bot.x, oyuncu.y - bot.y);
    if (mesafe < oyuncu.r + bot.r) {
      if (oyuncu.r > bot.r + 2) {
        oyuncu.r += bot.r * 0.3;
        silinecekler.push(i);
      } else if (bot.r > oyuncu.r + 2) {
        oyunBitti();
        return;
      }
    }
  }
  for (let i = 0; i < silinecekler.length; i++) {
    botlar.splice(silinecekler[i], 1);
  }
  while (botlar.length < MAKS_BOT) {
    botUret();
  }

  document.getElementById("skor").textContent = "Boyut: " + Math.round(oyuncu.r);
  cizim();
  animasyonId = requestAnimationFrame(dongu);
}

function oyunBitti() {
  oyunAktif = false;
  document.getElementById("durum").textContent = "Yakalandın! Boyut: " + Math.round(oyuncu.r);
}

function cizim() {
  ctx.fillStyle = "#1a0505";
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.scale(zoom, zoom);

  ctx.strokeStyle = "#ff5252";
  ctx.lineWidth = 4 / zoom;
  ctx.strokeRect(-kamera.x, -kamera.y, DUNYA_GENISLIK, DUNYA_YUKSEKLIK);

  ctx.fillStyle = "rgba(255,255,255,0.5)";
  for (let i = 0; i < yemler.length; i++) {
    const y = yemler[i];
    const sx = y.x - kamera.x, sy = y.y - kamera.y;
    ctx.beginPath();
    ctx.arc(sx, sy, y.r, 0, Math.PI * 2);
    ctx.fill();
  }

  for (let i = 0; i < botlar.length; i++) {
    const bot = botlar[i];
    const sx = bot.x - kamera.x, sy = bot.y - kamera.y;
    ctx.fillStyle = bot.r < oyuncu.r ? "#2ecc71" : "#ff5252";
    ctx.beginPath();
    ctx.arc(sx, sy, bot.r, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.fillStyle = "#ffe082";
  ctx.beginPath();
  ctx.arc(oyuncu.x - kamera.x, oyuncu.y - kamera.y, oyuncu.r, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

ctx.fillStyle = "#1a0505";
ctx.fillRect(0, 0, W, H);
  </script>
</body>
</html>
