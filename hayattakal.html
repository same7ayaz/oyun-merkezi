<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Hayatta Kal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      background: linear-gradient(-45deg, #3a0000, #5c0d00, #4a0500, #6b1400, #2e0000);
      background-size: 500% 500%;
      animation: gradientAkis 14s ease infinite;
      color: white;
      font-family: 'Poppins', sans-serif;
      text-align: center;
      padding: 20px 12px;
      min-height: 100vh;
      margin: 0;
    }
    @keyframes gradientAkis {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes nabizAt {
      0%, 100% { text-shadow: 0 0 15px #ff5252, 0 0 30px #ff5252; }
      50% { text-shadow: 0 0 25px #ff5252, 0 0 50px #ff5252; }
    }
    h1 {
      color: #ff5252;
      animation: nabizAt 2.5s ease-in-out infinite;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    #skor {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    #oyunKapsayici {
      position: relative;
      width: 360px;
      max-width: 100%;
      aspect-ratio: 3 / 4;
      margin: 0 auto;
      border: 3px solid #ff5252;
      border-radius: 14px;
      overflow: hidden;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background-color: #1a0505;
    }
    #joystickTaban {
      position: absolute;
      left: 20px;
      bottom: 20px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background-color: rgba(255,255,255,0.1);
      border: 2px solid rgba(255,82,82,0.6);
    }
    #joystickTop {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: rgba(255,82,82,0.85);
      transform: translate(-50%, -50%);
      transition: left 0.05s, top 0.05s;
    }
    #durum {
      font-size: 18px;
      font-weight: 600;
      margin-top: 14px;
      min-height: 28px;
    }
    button.baslat {
      margin-top: 10px;
      background-color: #ff5252;
      border: none;
      color: #2e0000;
      padding: 12px 26px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
    }
    p.aciklama {
      font-size: 13px;
      opacity: 0.75;
      margin-top: 10px;
    }
    a {
      color: #ff5252;
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h1>🔴 Hayatta Kal</h1>
  <p id="skor">Boyut: 10</p>

  <div id="oyunKapsayici">
    <canvas id="oyunAlani"></canvas>
    <div id="joystickTaban">
      <div id="joystickTop"></div>
    </div>
  </div>

  <p id="durum">Sol alttaki joystick ile yön ver, küçükleri ye, büyüklerden kaç!</p>
  <button class="baslat" onclick="oyunuBaslat()">▶ Başlat / Yeniden Başlat</button>
  <p class="aciklama">🟢 Senden küçük (yenir) · 🔴 Senden büyük (tehlike)</p>

  <a href="index.html">⬅ Ana sayfaya dön</a>

  <script>
    const canvas = document.getElementById("oyunAlani");
    const ctx = canvas.getContext("2d");
    const kapsayici = document.getElementById("oyunKapsayici");

    let W, H;
    function boyutlandir() {
      W = canvas.width = kapsayici.clientWidth;
      H = canvas.height = kapsayici.clientHeight;
    }
    boyutlandir();
    window.addEventListener("resize", boyutlandir);

    const DUNYA_GENISLIK = 1600;
    const DUNYA_YUKSEKLIK = 1600;
    const MAKS_BOT = 12;

    let oyuncu, botlar, yemler, oyunAktif, animasyonId;
    let kamera = { x: 0, y: 0 };

    function rastgele(min, max) {
      return Math.random() * (max - min) + min;
    }

    function oyunuBaslat() {
      oyuncu = { x: DUNYA_GENISLIK/2, y: DUNYA_YUKSEKLIK/2, r: 12, hiz: 2.6 };
      botlar = [];
      yemler = [];
      oyunAktif = true;

      for (let i = 0; i < 90; i++) {
        yemler.push({ x: rastgele(20, DUNYA_GENISLIK-20), y: rastgele(20, DUNYA_YUKSEKLIK-20), r: 4 });
      }
      for (let i = 0; i < MAKS_BOT; i++) {
        botUret();
      }

      document.getElementById("skor").textContent = "Boyut: " + Math.round(oyuncu.r);
      document.getElementById("durum").textContent = "Hayatta kal!";

      if (animasyonId) cancelAnimationFrame(animasyonId);
      dongu();
    }

    function botUret() {
      const kucukMu = Math.random() < 0.55;
      let r;
      if (kucukMu) {
        r = rastgele(6, Math.max(8, oyuncu.r * 0.75));
      } else {
        r = rastgele(oyuncu.r * 1.15, oyuncu.r * 1.8 + 10);
      }
      r = Math.min(r, 55);

      let x, y, deneme = 0, uygun = false;
      while (deneme < 25 && !uygun) {
        x = rastgele(r + 10, DUNYA_GENISLIK - r - 10);
        y = rastgele(r + 10, DUNYA_YUKSEKLIK - r - 10);
        if (Math.hypot(x - oyuncu.x, y - oyuncu.y) > 150) uygun = true;
        deneme++;
      }
      if (!uygun) {
        x = rastgele(r + 10, DUNYA_GENISLIK - r - 10);
        y = rastgele(r + 10, DUNYA_YUKSEKLIK - r - 10);
      }

      botlar.push({ x, y, r, vx: rastgele(-1,1), vy: rastgele(-1,1), yonSayaci: 0 });
    }

    // --- Sanal joystick ---
    const joyTaban = document.getElementById("joystickTaban");
    const joyTop = document.getElementById("joystickTop");
    let joyAktif = false;
    let joyVektor = { x: 0, y: 0 };
    let joyMerkez = { x: 0, y: 0 };
    const joyYaricap = 35;

    function joyBasla(e) {
      joyAktif = true;
      const rect = joyTaban.getBoundingClientRect();
      joyMerkez = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
      e.preventDefault();
    }

    function joyHareket(clientX, clientY) {
      if (!joyAktif) return;
      let dx = clientX - joyMerkez.x;
      let dy = clientY - joyMerkez.y;
      const uzunluk = Math.hypot(dx, dy);
      if (uzunluk > joyYaricap) {
        dx = (dx / uzunluk) * joyYaricap;
        dy = (dy / uzunluk) * joyYaricap;
      }
      joyTop.style.left = "calc(50% + " + dx + "px)";
      joyTop.style.top = "calc(50% + " + dy + "px)";
      joyVektor = { x: dx / joyYaricap, y: dy / joyYaricap };
    }

    function joyBitir() {
      joyAktif = false;
      joyVektor = { x: 0, y: 0 };
      joyTop.style.left = "50%";
      joyTop.style.top = "50%";
    }

    joyTaban.addEventListener("touchstart", (e) => joyBasla(e), {passive: false});
    joyTaban.addEventListener("touchmove", (e) => {
      const t = e.touches[0];
      joyHareket(t.clientX, t.clientY);
      e.preventDefault();
    }, {passive: false});
    joyTaban.addEventListener("touchend", joyBitir);

    joyTaban.addEventListener("mousedown", (e) => joyBasla(e));
    document.addEventListener("mousemove", (e) => { if (joyAktif) joyHareket(e.clientX, e.clientY); });
    document.addEventListener("mouseup", joyBitir);

    function dongu() {
      if (!oyunAktif) return;

      if (joyVektor.x !== 0 || joyVektor.y !== 0) {
        oyuncu.x += joyVektor.x * oyuncu.hiz;
        oyuncu.y += joyVektor.y * oyuncu.hiz;
      }

      oyuncu.x = Math.max(oyuncu.r, Math.min(DUNYA_GENISLIK - oyuncu.r, oyuncu.x));
      oyuncu.y = Math.max(oyuncu.r, Math.min(DUNYA_YUKSEKLIK - oyuncu.r, oyuncu.y));

      kamera.x = Math.max(0, Math.min(DUNYA_GENISLIK - W, oyuncu.x - W/2));
      kamera.y = Math.max(0, Math.min(DUNYA_YUKSEKLIK - H, oyuncu.y - H/2));

      for (let bot of botlar) {
        bot.yonSayaci++;
        if (bot.yonSayaci > 60) {
          bot.vx = rastgele(-1, 1);
          bot.vy = rastgele(-1, 1);
          bot.yonSayaci = 0;
        }
        bot.x += bot.vx * 1.1;
        bot.y += bot.vy * 1.1;
        bot.x = Math.max(bot.r, Math.min(DUNYA_GENISLIK - bot.r, bot.x));
        bot.y = Math.max(bot.r, Math.min(DUNYA_YUKSEKLIK - bot.r, bot.y));
      }

      for (let i = yemler.length - 1; i >= 0; i--) {
        const y = yemler[i];
        if (Math.hypot(oyuncu.x - y.x, oyuncu.y - y.y) < oyuncu.r + y.r) {
          oyuncu.r = Math.min(oyuncu.r + 0.4, 70);
          yemler.splice(i, 1);
          yemler.push({ x: rastgele(20, DUNYA_GENISLIK-20), y: rastgele(20, DUNYA_YUKSEKLIK-20), r: 4 });
        }
      }

      const silinecekler = [];
      for (let i = botlar.length - 1; i >= 0; i--) {
        const bot = botlar[i];
        const mesafe = Math.hypot(oyuncu.x - bot.x, oyuncu.y - bot.y);
        if (mesafe < oyuncu.r + bot.r) {
          if (oyuncu.r > bot.r + 2) {
            oyuncu.r = Math.min(oyuncu.r + bot.r * 0.3, 70);
            silinecekler.push(i);
          } else if (bot.r > oyuncu.r + 2) {
            oyunBitti();
            return;
          }
        }
      }
      for (let i of silinecekler) botlar.splice(i, 1);
      while (botlar.length < MAKS_BOT) botUret();

      document.getElementById("skor").textContent = "Boyut: " + Math.round(oyuncu.r);

      cizim();
      animasyonId = requestAnimationFrame(dongu);
    }

    function oyunBitti() {
      oyunAktif = false;
      document.getElementById("durum").textContent = "💀 Yakalandın! Boyut: " + Math.round(oyuncu.r);
    }

    function cizim() {
      ctx.fillStyle = "#1a0505";
      ctx.fillRect(0, 0, W, H);

      // Izgara (dünya hissi vermek için)
      ctx.strokeStyle = "rgba(255,255,255,0.05)";
      ctx.lineWidth = 1;
      const izgaraAraligi = 50;
      const baslangicX = -(kamera.x % izgaraAraligi);
      const baslangicY = -(kamera.y % izgaraAraligi);
      for (let x = baslangicX; x < W; x += izgaraAraligi) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
      }
      for (let y = baslangicY; y < H; y += izgaraAraligi) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }

      // Dünya kenarları (duvarlar)
      ctx.strokeStyle = "#ff5252";
      ctx.lineWidth = 4;
      ctx.strokeRect(-kamera.x, -kamera.y, DUNYA_GENISLIK, DUNYA_YUKSEKLIK);

      ctx.fillStyle = "rgba(255,255,255,0.5)";
      for (let y of yemler) {
        const sx = y.x - kamera.x, sy = y.y - kamera.y;
        if (sx < -10 || sx > W+10 || sy < -10 || sy > H+10) continue;
        ctx.beginPath();
        ctx.arc(sx, sy, y.r, 0, Math.
