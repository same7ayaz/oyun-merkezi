<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Hayatta Kal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: linear-gradient(-45deg, #0a0a1a, #1a0a2e, #0a1a2e, #1a0a2e);
            background-size: 500% 500%;
            animation: gradientAkis 14s ease infinite;
            color: white;
            font-family: 'Poppins', sans-serif;
            text-align: center;
            padding: 30px 20px;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        @keyframes gradientAkis {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }
        @keyframes nabizAt {
            0%,
            100% {
                text-shadow: 0 0 15px #60a5fa, 0 0 30px #60a5fa;
            }
            50% {
                text-shadow: 0 0 25px #60a5fa, 0 0 50px #60a5fa;
            }
        }
        h1 {
            color: #60a5fa;
            animation: nabizAt 2.5s ease-in-out infinite;
            font-size: 34px;
            font-weight: 700;
            margin: 0 0 6px 0;
        }
        p.aciklama {
            font-size: 16px;
            opacity: 0.7;
            margin: 0 0 20px 0;
        }

        .oyun-kapsayici {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            max-width: 800px;
            width: 100%;
            position: relative;
        }

        .oyun-alani {
            position: relative;
            width: 100%;
            padding-bottom: 75%;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            overflow: hidden;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            background: #0a0a12;
            touch-action: none;
        }

        /* HUD */
        .hud {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 24px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            padding: 6px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: white;
            font-size: 13px;
            font-weight: 500;
            z-index: 10;
            pointer-events: none;
        }
        .hud span {
            color: #8888aa;
        }
        .hud .val {
            color: #fff;
        }
        .hud .score-val {
            color: #fbbf24;
        }
        .hud .size-val {
            color: #60a5fa;
        }

        /* Joystick */
        .joystick {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            border: 2px solid rgba(255, 255, 255, 0.08);
            z-index: 10;
            touch-action: none;
        }
        .joystick-knob {
            position: absolute;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, #60a5fa, #2563eb);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 20px rgba(96, 165, 250, 0.3);
            pointer-events: none;
            transition: none;
        }

        /* Game Over */
        .game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 20;
            border-radius: 16px;
        }
        .game-over.show {
            display: flex;
        }
        .game-over h2 {
            font-size: 40px;
            color: #ef4444;
            margin: 0;
        }
        .game-over .sub {
            color: #8888aa;
            font-size: 15px;
        }
        .game-over .final-score {
            color: #fbbf24;
            font-size: 36px;
            font-weight: 700;
            margin: 4px 0 18px;
        }
        .btn {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border: none;
            color: white;
            padding: 12px 36px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover {
            transform: scale(1.05);
        }
        .btn-home {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 10px 28px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
            text-decoration: none;
        }
        .btn-home:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Ana sayfa linki */
        a.geri {
            color: #60a5fa;
            display: inline-block;
            margin-top: 18px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            opacity: 0.8;
            transition: opacity 0.2s;
        }
        a.geri:hover {
            opacity: 1;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 26px;
            }
            .hud {
                font-size: 11px;
                padding: 4px 12px;
                gap: 14px;
                top: 8px;
            }
            .joystick {
                width: 80px;
                height: 80px;
                bottom: 14px;
                left: 14px;
            }
            .joystick-knob {
                width: 36px;
                height: 36px;
            }
            .game-over h2 {
                font-size: 30px;
            }
            .game-over .final-score {
                font-size: 28px;
            }
            .oyun-kapsayici {
                padding: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="oyun-kapsayici">
        <h1>🐉 Hayatta Kal</h1>
        <p class="aciklama">Yemekleri ye büyü, düşmanlardan kaç!</p>

        <div class="oyun-alani">
            <canvas id="oyunCanvas"></canvas>

            <!-- HUD -->
            <div class="hud">
                <div>⭐ <span class="val score-val" id="skorGoster">0</span></div>
                <div>📏 <span class="val size-val" id="boyutGoster">20</span></div>
                <div>👾 <span class="val" id="dusmanSayisi">0</span></div>
            </div>

            <!-- Joystick -->
            <div class="joystick" id="joystickAlani">
                <div class="joystick-knob" id="joystickTop"></div>
            </div>

            <!-- Game Over -->
            <div class="game-over" id="gameOver">
                <h2>💀 ÖLDÜN</h2>
                <div class="sub">Puanın</div>
                <div class="final-score" id="finalSkor">0</div>
                <button class="btn" id="yenidenBtn">🔄 Tekrar Oyna</button>
                <a class="btn-home" href="index.html">← Ana Sayfa</a>
            </div>
        </div>

        <a class="geri" href="index.html">⬅ Ana sayfaya dön</a>
    </div>

    <script>
        // ============================================================
        //  HAYATTA KAL - Basit ve Eğlenceli
        // ============================================================

        const canvas = document.getElementById('oyunCanvas');
        const ctx = canvas.getContext('2d');

        let W, H;

        function boyutlandir() {
            const parent = canvas.parentElement;
            const rect = parent.getBoundingClientRect();
            W = canvas.width = rect.width;
            H = canvas.height = rect.height;
        }
        boyutlandir();
        window.addEventListener('resize', boyutlandir);

        // ============================================================
        //  OYUN DEĞİŞKENLERİ
        // ============================================================

        const MAP_SIZE = 1800;
        const cam = { x: 0, y: 0 };

        const oyuncu = {
            x: 0,
            y: 0,
            radius: 20,
            hedefRadius: 20,
            hiz: 2.8,
            alive: true,
            skor: 0
        };

        let yemekler = [];
        let dusmanlar = [];

        // Joystick
        const joy = {
            aktif: false,
            dx: 0,
            dy: 0,
            alan: document.getElementById('joystickAlani'),
            top: document.getElementById('joystickTop')
        };

        // DOM
        const skorEl = document.getElementById('skorGoster');
        const boyutEl = document.getElementById('boyutGoster');
        const dusmanEl = document.getElementById('dusmanSayisi');
        const gameOverEl = document.getElementById('gameOver');
        const finalSkorEl = document.getElementById('finalSkor');
        const yenidenBtn = document.getElementById('yenidenBtn');

        let yemekSpawn = 0;
        let dusmanSpawn = 0;
        let frame = 0;

        // ============================================================
        //  YARDIMCI
        // ============================================================

        function r(min, max) { return Math.random() * (max - min) + min; }

        function ri(min, max) { return Math.floor(r(min, max + 1)); }

        function mesafe(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }

        function sinirla(v, min, max) { return Math.max(min, Math.min(max, v)); }

        // ============================================================
        //  OLUŞTUR
        // ============================================================

        function yemekOlustur() {
            const a = r(0, Math.PI * 2);
            const d = r(200, MAP_SIZE / 2.5);
            return {
                x: oyuncu.x + Math.cos(a) * d,
                y: oyuncu.y + Math.sin(a) * d,
                radius: r(4, 10),
                renk: `hsl(${ri(30, 60)}, 80%, 60%)`,
                pulse: r(0, Math.PI * 2)
            };
        }

        function dusmanOlustur() {
            const oran = r(0.3, 2.8);
            const radius = Math.max(10, oyuncu.radius * oran);
            const a = r(0, Math.PI * 2);
            const d = r(300, MAP_SIZE / 2);

            return {
                x: oyuncu.x + Math.cos(a) * d,
                y: oyuncu.y + Math.sin(a) * d,
                radius: radius,
                hiz: r(0.3, 1.2) * (1 + (1 - oran) * 0.3),
                aci: r(0, Math.PI * 2),
                donus: ri(0, 100),
                donusAralik: ri(60, 180),
                buyuk: oran > 1.3,
                renk: `hsl(${oran > 1.3 ? ri(340, 20) : ri(100, 160)}, 70%, 50%)`
            };
        }

        // ============================================================
        //  BAŞLAT
        // ============================================================

        function oyunuBaslat() {
            oyuncu.x = 0;
            oyuncu.y = 0;
            oyuncu.radius = 20;
            oyuncu.hedefRadius = 20;
            oyuncu.hiz = 2.8;
            oyuncu.alive = true;
            oyuncu.skor = 0;

            yemekler = [];
            dusmanlar = [];
            cam.x = 0;
            cam.y = 0;

            gameOverEl.classList.remove('show');

            for (let i = 0; i < 18; i++) yemekler.push(yemekOlustur());
            for (let i = 0; i < 5; i++) dusmanlar.push(dusmanOlustur());

            guncelleHUD();
        }

        // ============================================================
        //  GÜNCELLE
        // ============================================================

        function guncelle() {
            if (!oyuncu.alive) return;

            frame++;

            // Joystick
            let dx = 0,
                dy = 0;
            if (joy.aktif) {
                const mag = Math.hypot(joy.dx, joy.dy);
                if (mag > 0.1) {
                    const norm = Math.min(1, mag);
                    dx = (joy.dx / mag) * oyuncu.hiz * norm;
                    dy = (joy.dy / mag) * oyuncu.hiz * norm;
                }
            }

            oyuncu.x += dx;
            oyuncu.y += dy;

            const limit = MAP_SIZE / 2 - oyuncu.radius;
            oyuncu.x = sinirla(oyuncu.x, -limit, limit);
            oyuncu.y = sinirla(oyuncu.y, -limit, limit);

            oyuncu.radius += (oyuncu.hedefRadius - oyuncu.radius) * 0.06;
            oyuncu.radius = Math.max(12, oyuncu.radius);

            cam.x = oyuncu.x - W / 2;
            cam.y = oyuncu.y - H / 2;

            // ---- YEMEKLER ----
            for (let i = yemekler.length - 1; i >= 0; i--) {
                const y = yemekler[i];
                if (mesafe(oyuncu.x, oyuncu.y, y.x, y.y) < oyuncu.radius + y.radius) {
                    oyuncu.hedefRadius += y.radius * 0.12;
                    oyuncu.skor += Math.floor(y.radius) + 1;
                    yemekler.splice(i, 1);
                }
            }

            yemekSpawn++;
            if (yemekSpawn > 18 && yemekler.length < 35) {
                yemekler.push(yemekOlustur());
                yemekSpawn = 0;
            }

            // ---- DÜŞMANLAR ----
            for (let i = dusmanlar.length - 1; i >= 0; i--) {
                const d = dusmanlar[i];

                d.donus++;
                if (d.donus > d.donusAralik) {
                    d.donus = 0;
                    d.aci += r(-0.3, 0.3);
                    d.donusAralik = ri(60, 200);
                }

                if (d.buyuk) {
                    const hedef = Math.atan2(oyuncu.y - d.y, oyuncu.x - d.x);
                    d.aci += (hedef - d.aci) * 0.02;
                }

                d.aci += r(-0.02, 0.02);
                d.x += Math.cos(d.aci) * d.hiz;
                d.y += Math.sin(d.aci) * d.hiz;

                const dLimit = MAP_SIZE / 2 - d.radius;
                if (d.x > dLimit) { d.x = dLimit;
                    d.aci = Math.PI - d.aci; }
                if (d.x < -dLimit) { d.x = -dLimit;
                    d.aci = Math.PI - d.aci; }
                if (d.y > dLimit) { d.y = dLimit;
                    d.aci = -d.aci; }
                if (d.y < -dLimit) { d.y = -dLimit;
                    d.aci = -d.aci; }

                // Çarpışma
                const m = mesafe(oyuncu.x, oyuncu.y, d.x, d.y);
                const esik = oyuncu.radius + d.radius;

                if (m < esik) {
                    if (oyuncu.radius > d.radius * 1.2) {
                        oyuncu.hedefRadius += d.radius * 0.06;
                        oyuncu.skor += Math.floor(d.radius * 0.5) + 2;
                        dusmanlar.splice(i, 1);
                    } else if (d.radius > oyuncu.radius * 1.2) {
                        oyuncu.alive = false;
                        oyunBitti();
                        return;
                    } else {
                        const a = Math.atan2(d.y - oyuncu.y, d.x - oyuncu.x);
                        const carp = (esik - m) / 2 + 1;
                        oyuncu.x -= Math.cos(a) * carp;
                        oyuncu.y -= Math.sin(a) * carp;
                        d.x += Math.cos(a) * carp;
                        d.y += Math.sin(a) * carp;
                    }
                }

                // Düşman-düşman
                for (let j = i - 1; j >= 0; j--) {
                    const other = dusmanlar[j];
                    const m2 = mesafe(d.x, d.y, other.x, other.y);
                    const minD = d.radius + other.radius;
                    if (m2 < minD && m2 > 0.01) {
                        const a = Math.atan2(other.y - d.y, other.x - d.x);
                        const carp = (minD - m2) / 2;
                        d.x -= Math.cos(a) * carp;
                        d.y -= Math.sin(a) * carp;
                        other.x += Math.cos(a) * carp;
                        other.y += Math.sin(a) * carp;
                    }
                }
            }

            dusmanSpawn++;
            if (dusmanSpawn > 100 && dusmanlar.length < 14) {
                dusmanlar.push(dusmanOlustur());
                dusmanSpawn = 0;
            }

            guncelleHUD();
        }

        // ============================================================
        //  ÇİZ
        // ============================================================

        function ciz() {
            ctx.clearRect(0, 0, W, H);

            // Grid
            const grid = 50;
            const ox = -cam.x % grid;
            const oy = -cam.y % grid;

            ctx.strokeStyle = 'rgba(255,255,255,0.03)';
            ctx.lineWidth = 1;
            for (let x = ox - grid; x < W + grid; x += grid) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, H);
                ctx.stroke();
            }
            for (let y = oy - grid; y < H + grid; y += grid) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(W, y);
                ctx.stroke();
            }

            // ---- YEMEKLER ----
            for (const y of yemekler) {
                const sx = y.x - cam.x;
                const sy = y.y - cam.y;
                if (sx < -30 || sx > W + 30 || sy < -30 || sy > H + 30) continue;

                const pulse = Math.sin(y.pulse + frame * 0.05) * 0.15 + 0.85;
                const r = y.radius * pulse;

                ctx.shadowColor = y.renk;
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.arc(sx, sy, r, 0, Math.PI * 2);
                ctx.fillStyle = y.renk;
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.font = `${r * 1.2}px monospace`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('✦', sx, sy + 1);
            }

            // ---- DÜŞMANLAR ----
            for (const d of dusmanlar) {
                const sx = d.x - cam.x;
                const sy = d.y - cam.y;
                if (sx < -80 || sx > W + 80 || sy < -80 || sy > H + 80) continue;

                ctx.shadowColor = 'rgba(0,0,0,0.4)';
                ctx.shadowBlur = 15;

                const grad = ctx.createRadialGradient(
                    sx - d.radius * 0.2, sy - d.radius * 0.2, 0,
                    sx, sy, d.radius
                );
                grad.addColorStop(0, d.renk);
                grad.addColorStop(1, 'rgba(0,0,0,0.3)');

                ctx.beginPath();
                ctx.arc(sx, sy, d.radius, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.shadowBlur = 0;

                // Gözler
                const gozBoyut = d.radius * 0.18;
                const gozOfset = d.radius * 0.3;
                ctx.fillStyle
