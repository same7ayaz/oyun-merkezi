<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Hayatta Kal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body {
      background: #2e0000;
      color: white;
      font-family: sans-serif;
      text-align: center;
      padding: 20px 12px;
      margin: 0;
    }
    h1 { color: #ff5252; font-size: 24px; }
    #oyunKapsayici {
      position: relative;
      width: 360px;
      max-width: 100%;
      height: 440px;
      margin: 0 auto;
      border: 3px solid #ff5252;
      border-radius: 14px;
      overflow: hidden;
      touch-action: none;
    }
    canvas { display: block; width: 100%; height: 100%; background-color: #1a0505; }
    #joystickTaban {
      position: absolute; left: 20px; bottom: 20px;
      width: 90px; height: 90px; border-radius: 50%;
      background-color: rgba(255,255,255,0.1);
      border: 2px solid rgba(255,82,82,0.6);
      z-index: 10;
    }
    #joystickTop {
      position: absolute; left: 50%; top: 50%;
      width: 40px; height: 40px; border-radius: 50%;
      background-color: rgba(255,82,82,0.85);
      transform: translate(-50%, -50%);
    }
    button.baslat {
      margin-top: 10px; background-color: #ff5252; border: none;
      color: #2e0000; padding: 12px 26px; font-size: 16px;
      font-weight: 700; border-radius: 10px; cursor: pointer;
    }
    a { color: #ff5252; display: inline-block; margin-top: 20px; text-decoration: none; }
  </style>
</head>
<body>
  <h1>🔴 Hayatta Kal</h1>
  <p id="skor">Boyut: 10</p>
  <div id="oyunKapsayici">
    <canvas id="oyunAlani" width="360" height="440"></canvas>
    <div id="joystickTaban"><div id="joystickTop"></div></div>
  </div>
  <p id="durum">Joystick ile yön ver</p>
  <button class="baslat" onclick="oyunuBaslat()">▶ Başlat</button>
  <a href="index.html">⬅ Ana sayfaya dön</a>
</body>
