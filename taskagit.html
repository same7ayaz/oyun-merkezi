<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Taş Kağıt Makas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      background: linear-gradient(-45deg, #3a1a00, #5c2e00, #4a2000, #6b3800, #331500);
      background-size: 500% 500%;
      animation: gradientAkis 14s ease infinite;
      color: white;
      font-family: 'Poppins', sans-serif;
      text-align: center;
      padding: 50px 20px;
      min-height: 100vh;
      margin: 0;
    }
    @keyframes gradientAkis {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes nabizAt {
      0%, 100% { text-shadow: 0 0 15px #ffb300, 0 0 30px #ffb300; }
      50% { text-shadow: 0 0 25px #ffb300, 0 0 50px #ffb300; }
    }
    h1 {
      color: #ffb300;
      animation: nabizAt 2.5s ease-in-out infinite;
      font-size: 34px;
      font-weight: 700;
    }
    p.aciklama {
      font-size: 17px;
      opacity: 0.85;
      margin-bottom: 40px;
    }
    .butonlar {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    button {
      background-color: rgba(255,255,255,0.08);
      border: 3px solid #ffb300;
      padding: 20px;
      font-size: 46px;
      border-radius: 20px;
      cursor: pointer;
      transition: transform 0.15s, background-color 0.15s;
      width: 100px;
      height: 100px;
    }
    button:active {
      transform: scale(0.9);
      background-color: #ffb300;
    }
    #sonuc {
      font-size: 22px;
      font-weight: 600;
      margin-top: 40px;
      min-height: 60px;
      line-height: 1.5;
    }
    #skor {
      font-size: 16px;
      opacity: 0.75;
      margin-top: 10px;
    }
    a {
      color: #ffb300;
      display: inline-block;
      margin-top: 40px;
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
    }
    @keyframes sallanma {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-15deg); }
      75% { transform: rotate(15deg); }
    }
    .sallan {
      animation: sallanma 0.4s ease;
    }
  </style>
</head>
<body>
  <h1>✊✋✌️ Taş Kağıt Makas</h1>
  <p class="aciklama">Bir seçim yap:</p>

  <div class="butonlar">
    <button onclick="oyna('taş', this)">✊</button>
    <button onclick="oyna('kağıt', this)">✋</button>
    <button onclick="oyna('makas', this)">✌️</button>
  </div>

  <p id="sonuc"></p>
  <p id="skor">Kazandın: 0 | Kaybettin: 0 | Berabere: 0</p>

  <a href="index.html">⬅ Ana sayfaya dön</a>

  <script>
    let kazandi = 0, kaybetti = 0, berabere = 0;

    function oyna(oyuncu, btn) {
      btn.classList.add("sallan");
      setTimeout(() => btn.classList.remove("sallan"), 400);

      let secenekler = ["taş", "kağıt", "makas"];
      let bilgisayar = secenekler[Math.floor(Math.random() * 3)];
      let sonucYazisi = document.getElementById("sonuc");
      let sonuc = "";

      if (oyuncu === bilgisayar) {
        sonuc = "🤝 Berabere! İkimiz de " + bilgisayar + " seçtik.";
        berabere++;
      } else if (
        (oyuncu === "taş" && bilgisayar === "makas") ||
        (oyuncu === "kağıt" && bilgisayar === "taş") ||
        (oyuncu === "makas" && bilgisayar === "kağıt")
      ) {
        sonuc = "🎉 Kazandın! Sen " + oyuncu + ", bilgisayar " + bilgisayar + " seçti.";
        kazandi++;
      } else {
        sonuc = "😔 Kaybettin! Sen " + oyuncu + ", bilgisayar " + bilgisayar + " seçti.";
        kaybetti++;
      }

      sonucYazisi.innerHTML = sonuc;
      document.getElementById("skor").textContent = "Kazandın: " + kazandi + " | Kaybettin: " + kaybetti + " | Berabere: " + berabere;
    }
  </script>
</body>
</html>
