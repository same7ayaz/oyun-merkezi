<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Oyun Merkezi</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background: linear-gradient(-45deg, #0f0c29, #302b63, #1b1b4d, #2a1a4a, #24243e);
      background-size: 400% 400%;
      animation: gradientAkis 12s ease infinite;
      color: white;
      font-family: 'Poppins', sans-serif;
      text-align: center;
      padding-top: 60px;
      min-height: 100vh;
      margin: 0;
    }
    @keyframes gradientAkis {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes girisAnimasyonu {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes renkGecisi {
      0%   { color: #00fff2; text-shadow: 0 0 15px #00fff2, 0 0 30px #00fff2; }
      33%  { color: #ff00e5; text-shadow: 0 0 15px #ff00e5, 0 0 30px #ff00e5; }
      66%  { color: #7c4dff; text-shadow: 0 0 15px #7c4dff, 0 0 30px #7c4dff; }
      100% { color: #00fff2; text-shadow: 0 0 15px #00fff2, 0 0 30px #00fff2; }
    }
    @keyframes kenarlikRenkleri {
      0%   { border-color: #00fff2; box-shadow: 0 0 10px rgba(0,255,242,0.4); }
      33%  { border-color: #ff00e5; box-shadow: 0 0 10px rgba(255,0,229,0.4); }
      66%  { border-color: #7c4dff; box-shadow: 0 0 10px rgba(124,77,255,0.4); }
      100% { border-color: #00fff2; box-shadow: 0 0 10px rgba(0,255,242,0.4); }
    }
    h1 {
      font-size: 36px;
      font-weight: 700;
      animation: girisAnimasyonu 0.6s ease, renkGecisi 6s linear infinite;
    }
    p.altyazi {
      opacity: 0.8;
      animation: girisAnimasyonu 0.6s ease 0.1s backwards;
    }
    .kartlar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }
    .kart {
      display: inline-block;
      background-color: rgba(255,255,255,0.05);
      border: 2px solid #00fff2;
      margin: 15px;
      padding: 25px;
      border-radius: 12px;
      width: 200px;
      text-decoration: none;
      color: white;
      transition: transform 0.2s, background-color 0.2s, color 0.2s;
      animation: girisAnimasyonu 0.6s ease backwards, kenarlikRenkleri 5s linear infinite;
    }
    .kart:nth-child(1) { animation-delay: 0.15s, 0s; }
    .kart:nth-child(2) { animation-delay: 0.3s, 1.2s; }
    .kart:nth-child(3) { animation-delay: 0.45s, 2.4s; }
    .kart:hover {
      background-color: rgba(255,255,255,0.15);
      transform: scale(1.07);
    }
    .kart:active {
      transform: scale(0.97);
    }
    .kart h2 {
      margin: 0;
      font-size: 32px;
    }
    .kart p {
      font-weight: 600;
      margin: 8px 0 0;
    }
    footer {
      margin-top: 60px;
      padding-bottom: 20px;
      font-size: 13px;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <h1>🎮 Oyun Merkezi</h1>
  <p class="altyazi">Oynamak istediğin oyunu seç</p>

  <div class="kartlar">
    <a class="kart" href="tahmin.html">
      <h2>🔢</h2>
      <p>Sayı Tahmin</p>
    </a>

    <a class="kart" href="taskagit.html">
      <h2>✊✋✌️</h2>
      <p>Taş-Kağıt-Makas</p>
    </a>

    <a class="kart" href="hafiza.html">
      <h2>🧠</h2>
      <p>Hafıza Kartları</p>
    </a>
  </div>

  <footer>yapımcı: same7ayaz</footer>
</body>
</html>
