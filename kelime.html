<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Kelime Tahmin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      background: linear-gradient(-45deg, #3a0035, #5c0050, #4a0042, #6b0060, #2e0028);
      background-size: 500% 500%;
      animation: gradientAkis 14s ease infinite;
      color: white;
      font-family: 'Poppins', sans-serif;
      text-align: center;
      padding: 40px 16px;
      min-height: 100vh;
      margin: 0;
    }
    @keyframes gradientAkis {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes nabizAt {
      0%, 100% { text-shadow: 0 0 15px #ff4dd8, 0 0 30px #ff4dd8; }
      50% { text-shadow: 0 0 25px #ff4dd8, 0 0 50px #ff4dd8; }
    }
    h1 {
      color: #ff4dd8;
      animation: nabizAt 2.5s ease-in-out infinite;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    #adam {
      font-size: 64px;
      margin: 18px 0;
      min-height: 74px;
      transition: transform 0.2s;
    }
    #kelimeAlani {
      font-size: 34px;
      letter-spacing: 9px;
      font-weight: 700;
      margin: 18px 0;
      word-break: break-all;
      min-height: 46px;
    }
    #harfler {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      max-width: 480px;
      margin: 0 auto;
    }
    .harfBtn {
      background-color: rgba(255,255,255,0.08);
      border: 2px solid #ff4dd8;
      color: white;
      width: 42px;
      height: 46px;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
      transition: transform 0.1s;
    }
    .harfBtn:active {
      transform: scale(0.88);
    }
    .harfBtn:disabled {
      opacity: 0.3;
      cursor: default;
    }
    .harfBtn.dogru {
      background-color: #2ecc71;
      border-color: #2ecc71;
    }
    .harfBtn.yanlis {
      background-color: #e74c3c;
      border-color: #e74c3c;
    }
    #durum {
      font-size: 19px;
      font-weight: 600;
      margin-top: 26px;
      min-height: 30px;
    }
    #canHakki {
      font-size: 16px;
      opacity: 0.8;
      margin-top: 6px;
      font-weight: 600;
    }
    button.yeniOyun {
      margin-top: 22px;
      background-color: #ff4dd8;
      border: none;
      padding: 14px 26px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      display: none;
      font-family: 'Poppins', sans-serif;
    }
    a {
      color: #ff4dd8;
      display: inline-block;
      margin-top: 40px;
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h1>🔤 Kelime Tahmin</h1>
  <p id="canHakki">Kalan hakkın: 6</p>

  <div id="adam">🙂</div>
  <div id="kelimeAlani"></div>

  <div id="harfler"></div>

  <p id="durum"></p>
  <button class="yeniOyun" onclick="yeniOyunBaslat()">🔄 Yeni Kelime</button>

  <a href="index.html">⬅ Ana sayfaya dön</a>

  <script>
    const kelimeler = ["BILGISAYAR","TERMUX","PYTHON","JAVASCRIPT","KLAVYE","TARAYICI","INTERNET","OYUN","TELEFON","KODLAMA"];
    const adamYuzler = ["🙂","😐","😟","😨","😰","😵","💀"];

    let secilenKelime = "";
    let tahminEdilenler = [];
    let yanlisSayisi = 0;
    const maxYanlis = 6;

    function yeniOyunBaslat() {
      secilenKelime = kelimeler[Math.floor(Math.random() * kelimeler.length)];
      tahminEdilenler = [];
      yanlisSayisi = 0;

      document.getElementById("adam").textContent = adamYuzler[0];
      document.getElementById("durum").textContent = "";
      document.getElementById("canHakki").textContent = "Kalan hakkın: " + maxYanlis;
      document.querySelector(".yeniOyun").style.display = "none";

      kelimeyiGoster();
      harfleriOlustur();
    }

    function kelimeyiGoster() {
      let gosterim = "";
      for (let harf of secilenKelime) {
        gosterim += tahminEdilenler.includes(harf) ? harf + " " : "_ ";
      }
      document.getElementById("kelimeAlani").textContent = gosterim.trim();
    }

    function harfleriOlustur() {
      const harflerDiv = document.getElementById("harfler");
      harflerDiv.innerHTML = "";
      const alfabe = "ABCÇDEFGĞHIİJKLMNOÖPRSŞTUÜVYZ";

      for (let harf of alfabe) {
        const btn = document.createElement("button");
        btn.className = "harfBtn";
        btn.textContent = harf;
        btn.onclick = () => harfSec(harf, btn);
        harflerDiv.appendChild(btn);
      }
    }

    function harfSec(harf, btn) {
      btn.disabled = true;

      if (secilenKelime.includes(harf)) {
        tahminEdilenler.push(harf);
        btn.classList.add("dogru");
        kelimeyiGoster();

        let kazandiMi = [...secilenKelime].every(h => tahminEdilenler.includes(h));
        if (kazandiMi) {
          document.getElementById("durum").textContent = "🎉 Tebrikler, kelimeyi buldun!";
          document.querySelector(".yeniOyun").style.display = "inline-block";
          tumHarfleriKilitle();
        }
      } else {
        yanlisSayisi++;
        btn.classList.add("yanlis");
        const adam = document.getElementById("adam");
        adam.textContent = adamYuzler[yanlisSayisi];
        adam.style.transform = "scale(1.2)";
        setTimeout(() => adam.style.transform = "scale(1)", 200);
        document.getElementById("canHakki").textContent = "Kalan hakkın: " + (maxYanlis - yanlisSayisi);

        if (yanlisSayisi >= maxYanlis) {
          document.getElementById("durum").textContent = "💀 Kaybettin! Kelime: " + secilenKelime;
          document.querySelector(".yeniOyun").style.display = "inline-block";
          tumHarfleriKilitle();
        }
      }
    }

    function tumHarfleriKilitle() {
      document.querySelectorAll(".harfBtn").forEach(b => b.disabled = true);
    }

    yeniOyunBaslat();
  </script>
</body>
</html>
