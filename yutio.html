<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Yut.io</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: linear-gradient(-45deg, #3a0000, #5c0d00, #4a0500, #6b1400, #2e0000);
  background-size: 500% 500%;
  animation: gradientAkis 14s ease infinite;
  color: white;
  font-family: 'Segoe UI', Tahoma, sans-serif;
  text-align: center;
  padding: 20px 12px;
  min-height: 100vh;
}
@keyframes gradientAkis {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
@keyframes nabizAt {
  0%, 100% { text-shadow: 0 0 15px #ff5252, 0 0 30px #ff5252; }
  50% { text-shadow: 0 0 25px #ff5252, 0 0 50px #ff5252; }
}
h1 { color: #ff5252; animation: nabizAt 2.5s ease-in-out infinite; font-size: 26px; margin-bottom: 6px; }
h1 span { color: #fff; }
.skorAlani {
  font-size: 15px;
  background: rgba(0,0,0,0.3);
  padding: 8px 18px;
  border-radius: 30px;
  display: inline-block;
  margin-bottom: 14px;
  border: 1px solid #ff5252;
}
.skorAlani strong { color: #ff5252; font-size: 18px; }
#oyunKapsayici {
  position: relative;
  width: 360px;
  max-width: 100%;
  height: 360px;
  margin: 0 auto;
  border: 3px solid #ff5252;
  border-radius: 14px;
  overflow: hidden;
  touch-action: none;
  background-color: #0a0000;
}
canvas { display: block; width: 100%; height: 100%; }
#siralamaKutusu {
  position: absolute;
  top: 8px;
  right: 8px;
  background-color: rgba(0,0,0,0.55);
  border: 1px solid #ff5252;
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 10px;
  text-align: left;
  z-index: 10;
  min-width: 100px;
}
#siralamaKutusu div { margin: 2px 0; white-space: nowrap; }
#siralamaKutusu .ben { color: #ffe082; font-weight: 700; }
#joystickTaban {
  position: absolute;
  left: 14px;
  bottom: 14px;
  width: 78px;
  height: 78px;
  border-radius: 50%;
  background-color: rgba(255,255,255,0.08);
  border: 2px solid rgba(255,82,82,0.6);
  z-index: 10;
}
#joystickTop {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background-color: #ff5252;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 15px rgba(255,82,82,0.5);
}
#durumMesaji {
  font-size: 15px;
  font-weight: 600;
  margin-top: 12px;
  min-height: 22px;
}
.btnGrup { display: flex; gap: 10px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
.btn {
  border: none;
  padding: 10px 22px;
  border-radius: 10px;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  font-family: inherit;
}
.btnPrimary { background-color: #ff5252; color: #2e0000; }
.btnPrimary:disabled { opacity: 0.5; }
.btnSecondary { background-color: rgba(255,255,255,0.1); color: #ff8a80; border: 1px solid #ff5252; }
.ipucu { font-size: 12px; opacity: 0.7; margin-top: 8px; }
a { color: #ff5252; display: inline-block; margin-top: 18px; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>

<h1>🐍 <span>Yut</span>.io</h1>
<div class="skorAlani">🎯 Boyut: <strong id="skorGosterge">10</strong></div>

<div id="oyunKapsayici">
  <canvas id="oyunAlani" width="360" height="360"></canvas>
  <div id="siralamaKutusu"></div>
  <div id="joystickTaban"><div id="joystickTop"></div></div>
</div>

<p id="durumMesaji">▶️ Oyunu başlat</p>
<div class="btnGrup">
  <button class="btn btnPrimary" id="baslatBtn">▶ Başlat</button>
  <button class="btn btnSecondary" id="sifirlaBtn">🔄 Sıfırla</button>
</div>
<p class="ipucu">Büyüdükçe yavaşlarsın, dikkatli ol!</p>

<a href="index.html">⬅ Ana sayfaya dön</a>

<script>
const canvas = document.getElementById('oyunAlani');
const ctx = canvas.getContext('2d');
const W = 360, H = 360;

let oyunAktif = false;
let oyunBittiMi = false;
let skor = 0;
let yilan = [];
let yemler = [];
let botlar = [];
let yon = { x: 1, y: 0 };
let kamera = { x: 0, y: 0 };
let zoom = 1;
let animasyonId;

const DUNYA_GENISLIK = 3500;
const DUNYA_YUKSEKLIK = 3500;
const BOT_SAYISI = 12;
const YEM_SAYISI = 180;
const RENKLER = ['#e53935','#ffb300','#43a047','#8e24aa','#fb8c00','#00acc1','#d81b60','#6a1b9a','#ff6f00','#00838f'];
const BOT_ISIMLERI = ["Ahmet","Zeynep","Mehmet","Elif","Can","Ayşe","Emre","Deniz","Kerem","Su","Berk","Nil","Arda","Ece","Kaan","Mira","Efe","Lara","Mert","Selin"];

const skorGosterge = document.getElementById('skorGosterge');
const durumMesaji = document.getElementById('durumMesaji');
const siralamaKutusu = document.getElementById('siralamaKutusu');
const baslatBtn = document.getElementById('baslatBtn');
const sifirlaBtn = document.getElementById('sifirlaBtn');

const joyTaban = document.getElementById('joystickTaban');
const joyTop = document.getElementById('joystickTop');
let joyAktif = false;
let joyVektor = { x: 0, y: 0 };
let joyMerkez = { x: 0, y: 0 };
const joyYaricap = 30;

function rastgele(min, max) { return Math.random() * (max - min) + min; }

// --- YILAN OLUŞTUR (pürüzsüz gövde) ---
function yilanOlustur(baslangicX, baslangicY, uzunluk, yonX, yonY, r) {
  const y = [];
  const basR = r || 12;
  for (let i = 0; i < uzunluk; i++) {
    const oran = 1 - (i / uzunluk) * 0.4;
    y.push({
      x: baslangicX - i * 9 * yonX,
      y: baslangicY - i * 9 * yonY,
      r: basR * oran
    });
  }
  return y;
}

function oyunuBaslat() {
  const oyuncuR = 12;
  yilan = yilanOlustur(DUNYA_GENISLIK / 2, DUNYA_YUKSEKLIK / 2, 8, 1, 0, oyuncuR);
  yon = { x: 1, y: 0 };
  skor = oyuncuR;
  oyunBittiMi = false;
  oyunAktif = true;
  skorGosterge.textContent = Math.round(skor);
  durumMesaji.textContent = '🎮 Oyun başladı!';
  baslatBtn.textContent = '⏸ Oynanıyor...';
  baslatBtn.disabled = true;

  yemler = [];
  for (let i = 0; i < YEM_SAYISI; i++) {
    yemler.push({ x: rastgele(20, DUNYA_GENISLIK - 20), y: rastgele(20, DUNYA_YUKSEKLIK - 20), r: 6 });
  }
  botlar = [];
  for (let i = 0; i < BOT_SAYISI; i++) { botOlustur(); }

  if (animasyonId) cancelAnimationFrame(animasyonId);
  oyunDongusu();
}

function botOlustur() {
  const botR = rastgele(10, 28);
  const uzunluk = Math.floor(rastgele(4, 10));
  let x, y, deneme = 0;
  do {
    x = rastgele(botR + 10, DUNYA_GENISLIK - botR - 10);
    y = rastgele(botR + 10, DUNYA_YUKSEKLIK - botR - 10);
    deneme++;
  } while (deneme < 30 && Math.hypot(x - yilan[0].x, y - yilan[0].y) < 200);

  const bot = {
    segmentler: yilanOlustur(x, y, uzunluk, 1, 0, botR),
    yon: { x: rastgele(-1, 1), y: rastgele(-1, 1) },
    renk: RENKLER[Math.floor(Math.random() * RENKLER.length)],
    isim: BOT_ISIMLERI[Math.floor(Math.random() * BOT_ISIMLERI.length)],
    hedefX: rastgele(50, DUNYA_GENISLIK - 50),
    hedefY: rastgele(50, DUNYA_YUKSEKLIK - 50),
    yonDegistir: 0,
    skor: botR
  };
  botlar.push(bot);
}

function yemUret() {
  if (yemler.length < YEM_SAYISI) {
    yemler.push({ x: rastgele(20, DUNYA_GENISLIK - 20), y: rastgele(20, DUNYA_YUKSEKLIK - 20), r: 6 });
  }
}

function yemOlustur(x, y, miktar) {
  const sayi = Math.min(Math.floor(miktar / 5) + 3, 15);
  for (let i = 0; i < sayi; i++) {
    yemler.push({ x: x + rastgele(-30, 30), y: y + rastgele(-30, 30), r: 6 });
  }
}

function oyunuBitir(mesaj) {
  if (oyunBittiMi) return;
  oyunBittiMi = true;
  oyunAktif = false;
  durumMesaji.textContent = mesaj + ' Boyut: ' + Math.round(skor);
  baslatBtn.textContent = '▶ Tekrar Başlat';
  baslatBtn.disabled = false;
  siralamaGuncelle();
}

function siralamaGuncelle() {
  const tum = botlar.map(function(b) { return { r: b.skor, isim: b.isim, ben: false }; });
  tum.push({ r: skor, isim: 'Sen', ben: true });
  tum.sort(function(a, b) { return b.r - a.r; });
  const ilk5 = tum.slice(0, 5);
  let html = "<div style='opacity:0.7;margin-bottom:4px;'>🏆 Sıralama</div>";
  for (let i = 0; i < ilk5.length; i++) {
    const kisi = ilk5[i];
    const sinif = kisi.ben ? " class='ben'" : "";
    html += "<div" + sinif + ">" + (i+1) + ". " + kisi.isim + " (" + Math.round(kisi.r) + ")</div>";
  }
  siralamaKutusu.innerHTML = html;
}

function joyBasla(clientX, clientY) {
  joyAktif = true;
  const rect = joyTaban.getBoundingClientRect();
  joyMerkez = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
}
function joyHareket(clientX, clientY) {
  if (!joyAktif) return;
  let dx = clientX - joyMerkez.x;
  let dy = clientY - joyMerkez.y;
  const uzunluk = Math.hypot(dx, dy);
  if (uzunluk > joyYaricap) { dx = (dx / uzunluk) * joyYaricap; dy = (dy / uzunluk) * joyYaricap; }
  joyTop.style.left = "calc(50% + " + dx + "px)";
  joyTop.style.top = "calc(50% + " + dy + "px)";
  joyVektor = { x: dx / joyYaricap, y: dy / joyYaricap };
}
function joyBitir() {
  joyAktif = false;
  joyVektor = { x: 0, y: 0 };
  joyTop.style.left = '50%';
  joyTop.style.top = '50%';
}
joyTaban.addEventListener('touchstart', function(e) { e.preventDefault(); const t = e.touches[0]; joyBasla(t.clientX, t.clientY); }, { passive: false });
joyTaban.addEventListener('touchmove', function(e) { e.preventDefault(); const t = e.touches[0]; joyHareket(t.clientX, t.clientY); }, { passive: false });
joyTaban.addEventListener('touchend', function(e) { e.preventDefault(); joyBitir(); }, { passive: false });
joyTaban.addEventListener('mousedown', function(e) { joyBasla(e.clientX, e.clientY); });
document.addEventListener('mousemove', function(e) { if (joyAktif) joyHareket(e.clientX, e.clientY); });
document.addEventListener('mouseup', function() { joyBitir(); });

document.addEventListener('keydown', function(e) {
  if (!oyunAktif || oyunBittiMi) return;
  if (e.key === 'ArrowUp') { joyVektor = { x: 0, y: -1 }; e.preventDefault(); }
  else if (e.key === 'ArrowDown') { joyVektor = { x: 0, y: 1 }; e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { joyVektor = { x: -1, y: 0 }; e.preventDefault(); }
  else if (e.key === 'ArrowRight') { joyVektor = { x: 1, y: 0 }; e.preventDefault(); }
});
document.addEventListener('keyup', function(e) {
  if (e.key.indexOf('Arrow') === 0) { joyVektor = { x: 0, y: 0 }; }
});

// --- OYUN DÖNGÜSÜ ---
function oyunDongusu() {
  if (!oyunAktif || oyunBittiMi) {
    animasyonId = requestAnimationFrame(oyunDongusu);
    return;
  }

  // Oyuncu hareketi
  if (joyVektor.x !== 0 || joyVektor.y !== 0) {
    const hiz = Math.max(1.5, 5 - skor * 0.012);
    yilan[0].x += joyVektor.x * hiz;
    yilan[0].y += joyVektor.y * hiz;
  }

  // Yılan gövdesini takip ettir (pürüzsüz)
  for (let i = yilan.length - 1; i > 0; i--) {
    const dx = yilan[i-1].x - yilan[i].x;
    const dy = yilan[i-1].y - yilan[i].y;
    const mesafe = Math.hypot(dx, dy);
    if (mesafe > 1) {
      yilan[i].x += dx * 0.5;
      yilan[i].y += dy * 0.5;
    } else {
      yilan[i].x = yilan[i-1].x;
      yilan[i].y = yilan[i-1].y;
    }
  }

  const bas = yilan[0];
  if (bas.x < bas.r || bas.x > DUNYA_GENISLIK - bas.r || bas.y < bas.r || bas.y > DUNYA_YUKSEKLIK - bas.r) {
    oyunuBitir('💀 Duvara çarptın!');
    return;
  }

  // Yem yeme
  for (let i = yemler.length - 1; i >= 0; i--) {
    const y = yemler[i];
    if (Math.hypot(bas.x - y.x, bas.y - y.y) < bas.r + y.r) {
      skor += 0.5;
      bas.r += 0.3;
      const son = yilan[yilan.length - 1];
      yilan.push({ x: son.x, y: son.y, r: bas.r * 0.6 });
      yemler.splice(i, 1);
      yemUret();
    }
  }

  // Bot hareketi
  for (let i = 0; i < botlar.length; i++) {
    const bot = botlar[i];
    const botBas = bot.segmentler[0];
    bot.yonDegistir++;

    if (bot.yonDegistir > 40 + rastgele(0, 40)) {
      const rastgeleSecim = Math.random();
      let hedefX, hedefY;

      if (rastgeleSecim < 0.4 && bot.skor > skor * 0.7) {
        hedefX = bas.x + rastgele(-50, 50);
        hedefY = bas.y + rastgele(-50, 50);
      } else if (rastgeleSecim < 0.6 && skor > bot.skor * 1.3) {
        hedefX = botBas.x + (botBas.x - bas.x) * 3 + rastgele(-50, 50);
        hedefY = botBas.y + (botBas.y - bas.y) * 3 + rastgele(-50, 50);
      } else {
        let enYakinYem = null;
        let enYakinMesafe = Infinity;
        for (let j = 0; j < yemler.length; j++) {
          const y = yemler[j];
          const d = Math.hypot(botBas.x - y.x, botBas.y - y.y);
          if (d < enYakinMesafe) { enYakinMesafe = d; enYakinYem = y; }
        }
        if (enYakinYem && enYakinMesafe < 350) {
          hedefX = enYakinYem.x + rastgele(-20, 20);
          hedefY = enYakinYem.y + rastgele(-20, 20);
        } else {
          hedefX = rastgele(50, DUNYA_GENISLIK - 50);
          hedefY = rastgele(50, DUNYA_YUKSEKLIK - 50);
        }
      }

      bot.hedefX = Math.max(10, Math.min(DUNYA_GENISLIK - 10, hedefX));
      bot.hedefY = Math.max(10, Math.min(DUNYA_YUKSEKLIK - 10, hedefY));
      bot.yonDegistir = 0;
    }

    const dx = bot.hedefX - botBas.x;
    const dy = bot.hedefY - botBas.y;
    const mesafe = Math.hypot(dx, dy);
    if (mesafe > 5) { bot.yon.x = dx / mesafe; bot.yon.y = dy / mesafe; }

    const hiz = Math.max(0.8, 3.5 - bot.skor * 0.012);
    botBas.x += bot.yon.x * hiz;
    botBas.y += bot.yon.y * hiz;

    // Bot gövdesini takip ettir
    for (let j = bot.segmentler.length - 1; j > 0; j--) {
      const dx2 = bot.segmentler[j-1].x - bot.segmentler[j].x;
      const dy2 = bot.segmentler[j-1].y - bot.segmentler[j].y;
      const mesafe2 = Math.hypot(dx2, dy2);
      if (mesafe2 > 1) {
        bot.segmentler[j].x += dx2 * 0.5;
        bot.segmentler[j].y += dy2 * 0.5;
      } else {
        bot.segmentler[j].x = bot.segmentler[j-1].x;
        bot.segmentler[j].y = bot.segmentler[j-1].y;
      }
    }

    if (botBas.x < botBas.r || botBas.x > DUNYA_GENISLIK - botBas.r) bot.yon.x *= -1;
    if (botBas.y < botBas.r || botBas.y > DUNYA_YUKSEKLIK - botBas.y) bot.yon.y *= -1;
    botBas.x = Math.max(botBas.r, Math.min(DUNYA_GENISLIK - botBas.r, botBas.x));
    botBas.y = Math.max(botBas.r, Math.min(DUNYA_YUKSEKLIK - botBas.r, botBas.y));

    for (let j = yemler.length - 1; j >= 0; j--) {
      const y = yemler[j];
      if (Math.hypot(botBas.x - y.x, botBas.y - y.y) < botBas.r + y.r) {
        bot.skor += 0.5;
        botBas.r += 0.25;
        const son = bot.segmentler[bot.segmentler.length - 1];
        bot.segmentler.push({ x: son.x, y: son.y, r: botBas.r * 0.6 });
        yemler.splice(j, 1);
        yemUret();
      }
    }
  }

  // --- BOTLAR BİRBİRİNİ YEMESİ ---
  const silinecekBotlar = new Set();
  for (let i = 0; i < botlar.length; i++) {
    if (silinecekBotlar.has(i)) continue;
    for (let j = i + 1; j < botlar.length; j++) {
      if (silinecekBotlar.has(j)) continue;
      const bot1 = botlar[i], bot2 = botlar[j];
      const bot1Bas = bot1.segmentler[0], bot2Bas = bot2.segmentler[0];
      const mesafe = Math.hypot(bot1Bas.x - bot2Bas.x, bot1Bas.y - bot2Bas.y);
      if (mesafe < bot1Bas.r + bot2Bas.r) {
        if (bot1.skor > bot2.skor + 3) {
          bot1.skor += bot2.skor * 0.2;
          bot1Bas.r += bot2.skor * 0.05;
          yemOlustur(bot2Bas.x, bot2Bas.y, bot2.skor * 0.3);
          silinecekBotlar.add(j);
        } else if (bot2.skor > bot1.skor + 3) {
          bot2.skor += bot1.skor * 0.2;
          bot2Bas.r += bot1.skor * 0.05;
          yemOlustur(bot1Bas.x, bot1Bas.y, bot1.skor * 0.3);
          silinecekBotlar.add(i);
        }
      }
    }
  }
  const siraliSilinecek = Array.from(silinecekBotlar).sort(function(a,b) { return b - a; });
  for (let idx of siraliSilinecek) { botlar.splice(idx, 1); botOlustur(); }
    // ============================================================
  // === OYUNCU-BOT ÇARPIŞMA MANTIĞI ===
  // KURAL: Başını çarptıran ÖLÜR!
  // ============================================================
  for (let i = botlar.length - 1; i >= 0; i--) {
    const bot = botlar[i];
    const botBas = bot.segmentler[0];

    // --- 1. BAŞ vs BAŞ (Boyut karşılaştırması) ---
    if (Math.hypot(bas.x - botBas.x, bas.y - botBas.y) < bas.r + botBas.r) {
      if (bas.r > botBas.r + 3) {
        skor += bot.skor * 0.3;
        bas.r += bot.skor * 0.1;
        yemOlustur(botBas.x, botBas.y, bot.skor * 0.4);
        botlar.splice(i, 1);
        botOlustur();
        continue;
      } else if (botBas.r > bas.r + 3) {
        oyunuBitir('💀 ' + bot.isim + ' seni yedi!');
        return;
      } else {
        yemOlustur(botBas.x, botBas.y, bot.skor * 0.3);
        botlar.splice(i, 1);
        botOlustur();
        oyunuBitir('💀 Berabere!');
        return;
      }
    }

    // --- 2. BOT BAŞI vs OYUNCU GÖVDESİ (Bot başı çarptı → BOT ÖLÜR) ---
    let botCarpti = false;
    for (let j = 1; j < yilan.length; j++) {
      const seg = yilan[j];
      if (Math.hypot(botBas.x - seg.x, botBas.y - seg.y) < botBas.r + seg.r) {
        skor += bot.skor * 0.2;
        bas.r += bot.skor * 0.05;
        yemOlustur(botBas.x, botBas.y, bot.skor * 0.3);
        botlar.splice(i, 1);
        botOlustur();
        botCarpti = true;
        break;
      }
    }
    if (botCarpti) continue;

    // --- 3. OYUNCU BAŞI vs BOT GÖVDESİ (Oyuncu başı çarptı → OYUNCU ÖLÜR) ---
    for (let j = 1; j < bot.segmentler.length; j++) {
      const seg = bot.segmentler[j];
      if (Math.hypot(bas.x - seg.x, bas.y - seg.y) < bas.r + seg.r) {
        oyunuBitir('💀 ' + bot.isim + '\'in gövdesine çarptın!');
        return;
      }
    }
  }

  while (botlar.length < BOT_SAYISI) { botOlustur(); }

  skor = bas.r;
  skorGosterge.textContent = Math.round(skor);

  // === KAMERA ZOOM (Büyüdükçe uzaklaş) ===
  const viewW = W / zoom;
  const viewH = H / zoom;
  kamera.x = Math.max(0, Math.min(DUNYA_GENISLIK - viewW, bas.x - viewW / 2));
  kamera.y = Math.max(0, Math.min(DUNYA_YUKSEKLIK - viewH, bas.y - viewH / 2));
  zoom = Math.max(0.1, Math.min(0.9, 35 / skor));

  cizimYap();
  siralamaGuncelle();

  animasyonId = requestAnimationFrame(oyunDongusu);
}

// ============================================================
// === ÇİZİM (YILAN GÖVDESİ + GÖZLER) ===
// ============================================================
function cizimYap() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.scale(zoom, zoom);
  ctx.translate(-kamera.x, -kamera.y);

  // Arka plan
  ctx.fillStyle = '#0a0000';
  ctx.fillRect(0, 0, DUNYA_GENISLIK, DUNYA_YUKSEKLIK);

  // Izgara
  ctx.strokeStyle = '#1a0505';
  ctx.lineWidth = 1 / zoom;
  for (let i = 0; i < DUNYA_GENISLIK; i += 50) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, DUNYA_YUKSEKLIK); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(DUNYA_GENISLIK, i); ctx.stroke();
  }

  // Sınır
  ctx.strokeStyle = '#ff5252';
  ctx.lineWidth = 4 / zoom;
  ctx.strokeRect(0, 0, DUNYA_GENISLIK, DUNYA_YUKSEKLIK);

  // Yemler
  ctx.shadowColor = '#ff5252';
  ctx.shadowBlur = 10 / zoom;
  ctx.fillStyle = '#ff5252';
  for (let y of yemler) {
    ctx.beginPath();
    ctx.arc(y.x, y.y, y.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  // === BOT YILANLARI ÇİZ ===
  for (let bot of botlar) {
    // Gövde
    for (let i = 0; i < bot.segmentler.length; i++) {
      const seg = bot.segmentler[i];
      const radius = seg.r;
      const grad = ctx.createRadialGradient(
        seg.x - radius * 0.2, seg.y - radius * 0.3, radius * 0.1,
        seg.x, seg.y, radius
      );
      grad.addColorStop(0, '#ffffff88');
      grad.addColorStop(0.3, bot.renk);
      grad.addColorStop(1, bot.renk);
      ctx.fillStyle = grad;
      ctx.shadowColor = bot.renk;
      ctx.shadowBlur = i === 0 ? 15 / zoom : 5 / zoom;
      ctx.beginPath();
      ctx.arc(seg.x, seg.y, radius, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    // Bot başı - gözler
    const botBas = bot.segmentler[0];
    const gozR = botBas.r * 0.18;
    const gozOffset = botBas.r * 0.35;

    // Göz beyleri (beyaz)
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(botBas.x + bot.yon.x * gozOffset - bot.yon.y * gozOffset * 0.5,
            botBas.y + bot.yon.y * gozOffset + bot.yon.x * gozOffset * 0.5,
            gozR, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(botBas.x + bot.yon.x * gozOffset + bot.yon.y * gozOffset * 0.5,
            botBas.y + bot.yon.y * gozOffset - bot.yon.x * gozOffset * 0.5,
            gozR, 0, Math.PI * 2);
    ctx.fill();

    // Göz bebeği (siyah)
    ctx.fillStyle = '#1a0000';
    const bebekR = gozR * 0.5;
    ctx.beginPath();
    ctx.arc(botBas.x + bot.yon.x * gozOffset * 1.3 - bot.yon.y * gozOffset * 0.5,
            botBas.y + bot.yon.y * gozOffset * 1.3 + bot.yon.x * gozOffset * 0.5,
            bebekR, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(botBas.x + bot.yon.x * gozOffset * 1.3 + bot.yon.y * gozOffset * 0.5,
            botBas.y + bot.yon.y * gozOffset * 1.3 - bot.yon.x * gozOffset * 0.5,
            bebekR, 0, Math.PI * 2);
    ctx.fill();

    // Bot ismi
    ctx.fillStyle = 'white';
    ctx.font = Math.max(8, botBas.r * 0.4) + 'px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(bot.isim, botBas.x, botBas.y + botBas.r + 16);
  }

  // === OYUNCU YILANI ÇİZ ===
  for (let i = 0; i < yilan.length; i++) {
    const seg = yilan[i];
    const radius = seg.r;
    const grad = ctx.createRadialGradient(
      seg.x - radius * 0.2, seg.y - radius * 0.3, radius * 0.1,
      seg.x, seg.y, radius
    );
    grad.addColorStop(0, '#fff6d5');
    grad.addColorStop(0.3, '#ffe082');
    grad.addColorStop(1, '#ffca28');
    ctx.fillStyle = grad;
    ctx.shadowColor = '#ffca28';
    ctx.shadowBlur = i === 0 ? 25 / zoom : 8 / zoom;
    ctx.beginPath();
    ctx.arc(seg.x, seg.y, radius, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  // Oyuncu başı - gözler
  const bas = yilan[0];
  const gozR = bas.r * 0.14;
  const gozOffset = bas.r * 0.3;

  ctx.fillStyle = 'white';
  ctx.beginPath();
  ctx.arc(bas.x + yon.x * gozOffset - yon.y * gozOffset * 0.5,
          bas.y + yon.y * gozOffset + yon.x * gozOffset * 0.5,
          gozR, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(bas.x + yon.x * gozOffset + yon.y * gozOffset * 0.5,
          bas.y + yon.y * gozOffset - yon.x * gozOffset * 0.5,
          gozR, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#3e2723';
  const bebekR = gozR * 0.5;
  ctx.beginPath();
  ctx.arc(bas.x + yon.x * gozOffset * 1.4 - yon.y * gozOffset * 0.5,
          bas.y + yon.y * gozOffset * 1.4 + yon.x * gozOffset * 0.5,
          bebekR, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(bas.x + yon.x * gozOffset * 1.4 + yon.y * gozOffset * 0.5,
          bas.y + yon.y * gozOffset * 1.4 - yon.x * gozOffset * 0.5,
          bebekR, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

baslatBtn.addEventListener('click', function() {
  if (oyunAktif && !oyunBittiMi) return;
  oyunuBaslat();
});

sifirlaBtn.addEventListener('click', function() {
  oyunAktif = false;
  oyunBittiMi = false;
  skor = 12;
  skorGosterge.textContent = '12';
  durumMesaji.textContent = '🔄 Oyun sıfırlandı';
  baslatBtn.textContent = '▶ Başlat';
  baslatBtn.disabled = false;
  yilan = yilanOlustur(DUNYA_GENISLIK / 2, DUNYA_YUKSEKLIK / 2, 8, 1, 0, 12);
  yon = { x: 1, y: 0 };
  yemler = [];
  botlar = [];
  for (let i = 0; i < YEM_SAYISI; i++) {
    yemler.push({ x: rastgele(20, DUNYA_GENISLIK - 20), y: rastgele(20, DUNYA_YUKSEKLIK - 20), r: 6 });
  }
  for (let i = 0; i < BOT_SAYISI; i++) { botOlustur(); }
  siralamaGuncelle();
  cizimYap();
});

function baslangic() {
  yilan = yilanOlustur(DUNYA_GENISLIK / 2, DUNYA_YUKSEKLIK / 2, 8, 1, 0, 12);
  yemler = [];
  botlar = [];
  for (let i = 0; i < YEM_SAYISI; i++) {
    yemler.push({ x: rastgele(20, DUNYA_GENISLIK - 20), y: rastgele(20, DUNYA_YUKSEKLIK - 20), r: 6 });
  }
  for (let i = 0; i < BOT_SAYISI; i++) { botOlustur(); }
  skor = 12;
  skorGosterge.textContent = '12';
  siralamaGuncelle();
  cizimYap();
  durumMesaji.textContent = '▶️ Başlat\'a basarak oyuna başla';
}

baslangic();
</script>
