<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yutio - Stratejik Savaşlar</title>
    <style>
        body { margin: 0; padding: 0; background: #1a1a1a; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        canvas { display: block; background: #000; }
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .menu { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.85); padding: 30px; border-radius: 20px; text-align: center; pointer-events: all; border: 2px solid #ffcc00; box-shadow: 0 0 20px #ffcc00; }
        h1 { color: #ffcc00; margin-bottom: 20px; font-size: 48px; text-shadow: 0 0 10px #ffcc00; }
        .btn { padding: 15px 30px; margin: 10px; font-size: 20px; cursor: pointer; background: #ffcc00; border: none; border-radius: 10px; font-weight: bold; transition: 0.3s; }
        .btn:hover { background: #fff; transform: scale(1.1); }
        #hud { position: absolute; top: 20px; left: 20px; font-size: 24px; color: #ffcc00; display: none; }
        #leaderboard { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 10px; display: none; text-align: right; }
        .difficulty { margin-bottom: 20px; }
        .diff-btn { padding: 10px; margin: 5px; cursor: pointer; background: #444; color: white; border: none; border-radius: 5px; }
        .diff-btn.active { background: #ffcc00; color: black; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
        <div id="hud">Skor: 0 | Takım: Sarı</div>
        <div id="leaderboard"><b>Sıralama</b><div id="list"></div></div>
        <div id="main-menu" class="menu">
            <h1>YUTIO</h1>
            <div class="difficulty">
                <button class="diff-btn" onclick="setDiff('easy', this)">Kolay</button>
                <button class="diff-btn active" onclick="setDiff('medium', this)">Orta</button>
                <button class="diff-btn" onclick="setDiff('hard', this)">Zor</button>
            </div>
            <button class="btn" onclick="startGame('survival')">Hayatta Kal</button>
            <button class="btn" onclick="startGame('team')">Takım Avı</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const hud = document.getElementById('hud');
        const lb = document.getElementById('leaderboard');
        const lbList = document.getElementById('list');

        let gameActive = false;
        let mode = 'survival';
        let diff = 'medium';
        let player;
        let snakes = [];
        let foods = [];
        let camera = { x: 0, y: 0 };
        let keys = {};

        const MAP_SIZE = 3000;
        const TEAMS = {
            YELLOW: { color: '#ffff00', name: 'Sarı' },
            RED: { color: '#ff0000', name: 'Kırmızı' },
            BLUE: { color: '#0000ff', name: 'Mavi' }
        };

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
        window.dispatchEvent(new Event('resize'));

        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);

        function setDiff(val, btn) {
            diff = val;
            document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        class Food {
            constructor() {
                this.x = Math.random() * MAP_SIZE;
                this.y = Math.random() * MAP_SIZE;
                this.size = Math.random() * 4 + 2;
                this.color = `hsl(${Math.random() * 360}, 100%, 50%)`;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x - camera.x, this.y - camera.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class Snake {
            constructor(x, y, color, name, team, isBot = true) {
                this.x = x; this.y = y;
                this.color = color;
                this.name = name;
                this.team = team;
                this.isBot = isBot;
                this.angle = Math.random() * Math.PI * 2;
                this.speed = 3;
                this.length = isBot ? Math.floor(Math.random() * 10) + 5 : 5;
                this.segments = [];
                this.score = 0;
                this.isDead = false;
                this.boost = false;
                for (let i = 0; i < this.length; i++) this.segments.push({ x, y });
            }

            update() {
                if (this.isDead) return;

                if (this.isBot) {
                    this.runAI();
                } else {
                    if (keys['ArrowLeft']) this.angle -= 0.1;
                    if (keys['ArrowRight']) this.angle += 0.1;
                    this.boost = keys['z'] || keys['Z'];
                }

                let currentSpeed = this.boost ? 6 : 3;
                this.x += Math.cos(this.angle) * currentSpeed;
                this.y += Math.sin(this.angle) * currentSpeed;

                if (this.x < 0) this.x = MAP_SIZE; if (this.x > MAP_SIZE) this.x = 0;
                if (this.y < 0) this.y = MAP_SIZE; if (this.y > MAP_SIZE) this.y = 0;

                this.segments.unshift({ x: this.x, y: this.y });
                if (this.segments.length > this.length) this.segments.pop();
            }

            runAI() {
                // Performans için her karede değil, ara ara karar ver
                if (Math.random() > 0.1) return;

                let closestFood = null, minDist = Infinity;
                foods.forEach(f => {
                    let d = Math.hypot(this.x - f.x, this.y - f.y);
                    if (d < minDist) { minDist = d; closestFood = f; }
                });

                let closestEnemy = null, enemyDist = Infinity;
                snakes.forEach(s => {
                    if (s === this || s.isDead || s.team === this.team) return;
                    let d = Math.hypot(this.x - s.x, this.y - s.y);
                    if (d < enemyDist) { enemyDist = d; closestEnemy = s; }
                });

                if (mode === 'survival') {
                    // Hayatta Kalma: Ana hedef büyüme, sadece çok yakınsa kaç
                    if (closestEnemy && enemyDist < 200) {
                        this.angle += Math.PI; // Kaç
                    } else if (closestFood) {
                        this.angle = Math.atan2(closestFood.y - this.y, closestFood.x - this.x);
                    }
                } else {
                    // Takım Avı: Stratejik saldırı ve pusu
                    if (closestEnemy) {
                        if (this.length > closestEnemy.length + 5) {
                            this.angle = Math.atan2(closestEnemy.y - this.y, closestEnemy.x - this.x);
                        } else if (enemyDist < 150) {
                            this.angle += Math.PI / 2; // Yan geçerek tuzak kur
                        }
                    } else if (closestFood) {
                        this.angle = Math.atan2(closestFood.y - this.y, closestFood.x - this.x);
                    }
                }
            }

            draw() {
                if (this.isDead) return;
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 15;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.beginPath();
                ctx.moveTo(this.segments[0].x - camera.x, this.segments[0].y - camera.y);
                for (let i = 1; i < this.segments.length; i++) {
                    ctx.lineTo(this.segments[i].x - camera.x, this.segments[i].y - camera.y);
                }
                ctx.stroke();
            }
        }

        function startGame(m) {
            mode = m;
            gameActive = true;
            snakes = [];
            foods = [];
            
            // Player: Sol Üst Spawn
            player = new Snake(50, 50, TEAMS.YELLOW.color, "Sen", 'YELLOW', false);
            snakes.push(player);

            // Takımları oluştur (Her takım 10 kişi)
            const teams = [
                { id: 'YELLOW', color: TEAMS.YELLOW.color },
                { id: 'RED', color: TEAMS.RED.color },
                { id: 'BLUE', color: TEAMS.BLUE.color }
            ];

            teams.forEach(t => {
                let count = (t.id === 'YELLOW') ? 9 : 10;
                for (let i = 0; i < count; i++) {
                    snakes.push(new Snake(Math.random() * MAP_SIZE, Math.random() * MAP_SIZE, t.color, t.id + " Bot", t.id));
                }
            });

            for (let i = 0; i < 150; i++) foods.push(new Food());

            document.getElementById('main-menu').style.display = 'none';
            hud.style.display = 'block';
            lb.style.display = 'block';
        }

        function loop() {
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (gameActive) {
                camera.x = player.x - canvas.width / 2;
                camera.y = player.y - canvas.height / 2;

                foods.forEach(f => f.draw());

                snakes.forEach(s => {
                    s.update();
                    // Çarpışma kontrolü
                    if (!s.isDead) {
                        snakes.forEach(other => {
                            if (other.isDead) return;
                            other.segments.forEach((seg, idx) => {
                                if (s !== other && Math.hypot(s.x - seg.x, s.y - seg.y) < 10) {
                                    s.isDead = true;
                                }
                            });
                        });
                        foods.forEach((f, idx) => {
                            if (Math.hypot(s.x - f.x, s.y - f.y) < 15) {
                                s.length++;
                                s.score += 10;
                                foods[idx] = new Food();
                            }
                        });
                    }
                    s.draw();
                });

                if (player.isDead) {
                    gameActive = false;
                    document.getElementById('main-menu').style.display = 'block';
                    document.querySelector('h1').innerText = "ÖLDÜN!";
                }

                hud.innerText = `Skor: ${player.score} | Takım: Sarı`;
                const sorted = [...snakes].sort((a, b) => b.score - a.score).slice(0, 5);
                lbList.innerHTML = sorted.map(s => `<div>${s.name}: ${s.score}</div>`).join('');
            }
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
