<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Yut.io - Takım Savaşı</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: linear-gradient(-45deg, #1a0000, #3a0000, #1a0000, #2a0000);
  background-size: 400% 400%;
  animation: gradientAkis 10s ease infinite;
  color: white;
  font-family: 'Segoe UI', Tahoma, sans-serif;
  text-align: center;
  padding: 20px 12px;
  min-height: 100vh;
}
@keyframes gradientAkis {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
@keyframes nabizAt {
  0%, 100% { text-shadow: 0 0 15px #ff5252, 0 0 30px #ff5252; }
  50% { text-shadow: 0 0 25px #ff5252, 0 0 50px #ff5252; }
}
h1 { color: #ff5252; animation: nabizAt 2.5s ease-in-out infinite; font-size: 26px; margin-bottom: 6px; }
h1 span { color: #fff; }
.skorAlani {
  font-size: 15px;
  background: rgba(0,0,0,0.5);
  padding: 8px 18px;
  border-radius: 30px;
  display: inline-block;
  margin-bottom: 14px;
  border: 1px solid #ff5252;
}
.skorAlani strong { color: #ff5252; font-size: 18px; }

#modSecim {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin: 10px 0;
  flex-wrap: wrap;
}
.modBtn {
  border: 2px solid #ff5252;
  background: rgba(0,0,0,0.3);
  color: #ff8a80;
  padding: 8px 20px;
  border-radius: 30px;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.3s;
}
.modBtn:hover { background: rgba(255,82,82,0.2); }
.modBtn.aktif {
  background: #ff5252;
  color: #2e0000;
  border-color: #ff5252;
  box-shadow: 0 0 20px rgba(255,82,82,0.3);
}

#oyunKapsayici {
  position: relative;
  width: 360px;
  max-width: 100%;
  height: 360px;
  margin: 0 auto;
  border: 3px solid #ff5252;
  border-radius: 14px;
  overflow: hidden;
  touch-action: none;
  background-color: #0a0000;
}
canvas { display: block; width: 100%; height: 100%; }
#siralamaKutusu {
  position: absolute;
  top: 8px;
  right: 8px;
  background-color: rgba(0,0,0,0.6);
  border: 1px solid #ff5252;
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 10px;
  text-align: left;
  z-index: 10;
  min-width: 100px;
}
#siralamaKutusu div { margin: 2px 0; white-space: nowrap; }
#siralamaKutusu .ben { color: #ffe082; font-weight: 700; }
.takimSari { color: #ffd740; }
.takimKirmizi { color: #ff1744; }
.takimMavi { color: #448aff; }
.takimYesil { color: #69f0ae; }

#takimSayac {
  position: absolute;
  top: 8px;
  left: 8px;
  background-color: rgba(0,0,0,0.6);
  border: 1px solid #ff5252;
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 10px;
  text-align: left;
  z-index: 10;
  min-width: 80px;
}
#takimSayac div { margin: 1px 0; }

#joystickTaban {
  position: absolute;
  left: 14px;
  bottom: 14px;
  width: 78px;
  height: 78px;
  border-radius: 50%;
  background-color: rgba(255,255,255,0.08);
  border: 2px solid rgba(255,82,82,0.6);
  z-index: 10;
  touch-action: none;
}
#joystickTop {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background-color: #ff5252;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 15px rgba(255,82,82,0.5);
  pointer-events: none;
}

#boostBtn {
  position: absolute;
  right: 14px;
  bottom: 14px;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background-color: rgba(255,82,82,0.2);
  border: 2px solid #ff5252;
  color: white;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  line-height: 1.2;
  transition: all 0.2s;
  touch-action: none;
  user-select: none;
  font-family: inherit;
}
#boostBtn:active { transform: scale(0.9); }
#boostBtn.turbo {
  background-color: #ff1744;
  border-color: #ff1744;
  box-shadow: 0 0 25px #ff1744;
  animation: boostNabiz 0.5s ease-in-out infinite alternate;
}
@keyframes boostNabiz {
  0% { box-shadow: 0 0 15px #ff1744; }
  100% { box-shadow: 0 0 35px #ff1744; }
}
#boostBtn .icon { font-size: 18px; }
#boostBtn .label { font-size: 9px; opacity: 0.8; }
#boostBtn .boyut { font-size: 8px; opacity: 0.6; margin-top: 2px; }

#durumMesaji {
  font-size: 15px;
  font-weight: 600;
  margin-top: 12px;
  min-height: 22px;
}
.btnGrup { display: flex; gap: 10px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
.btn {
  border: none;
  padding: 10px 22px;
  border-radius: 10px;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  font-family: inherit;
}
.btnPrimary { background-color: #ff5252; color: #2e0000; }
.btnPrimary:disabled { opacity: 0.5; }
.btnSecondary { background-color: rgba(255,255,255,0.1); color: #ff8a80; border: 1px solid #ff5252; }

.zorlukGrup {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-top: 8px;
  flex-wrap: wrap;
}
.zorlukBtn {
  border: 2px solid #ff5252;
  background: rgba(0,0,0,0.3);
  color: #ff8a80;
  padding: 6px 18px;
  border-radius: 20px;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.3s;
}
.zorlukBtn:hover { background: rgba(255,82,82,0.2); }
.zorlukBtn.aktif {
  background: #ff5252;
  color: #2e0000;
  border-color: #ff5252;
  box-shadow: 0 0 20px rgba(255,82,82,0.3);
}

.ipucu { font-size: 12px; opacity: 0.7; margin-top: 8px; }
a { color: #ff5252; display: inline-block; margin-top: 18px; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>

<h1>⚔️ <span>Takım</span> Savaşı</h1>
<div class="skorAlani">🏆 Kalan: <strong id="skorGosterge">0</strong></div>

<div id="oyunKapsayici">
  <canvas id="oyunAlani" width="360" height="360"></canvas>
  <div id="siralamaKutusu"></div>
  <div id="takimSayac"></div>
  <div id="joystickTaban"><div id="joystickTop"></div></div>
  <button id="boostBtn">
    <span class="icon">⚡</span>
    <span class="label">BOOST</span>
    <span class="boyut" id="boostBoyut">-0%</span>
  </button>
</div>

<p id="durumMesaji">▶️ Oyunu başlat</p>

<div id="modSecim">
  <button class="modBtn" data-mod="hayattaKalma">🏃 Hayatta Kal</button>
  <button class="modBtn aktif" data-mod="takimAvi">⚔️ Takım Avı</button>
</div>

<div class="zorlukGrup">
  <button class="zorlukBtn aktif" data-zorluk="kolay">🟢 Kolay</button>
  <button class="zorlukBtn" data-zorluk="orta">🟡 Orta</button>
  <button class="zorlukBtn" data-zorluk="zor">🔴 Zor</button>
</div>

<div class="btnGrup">
  <button class="btn btnPrimary" id="baslatBtn">▶ Başlat</button>
  <button class="btn btnSecondary" id="sifirlaBtn">🔄 Sıfırla</button>
</div>
<p class="ipucu">⚡ Boost ile hızlan! Rakipleri yemek için kovala!</p>
<a href="index.html">⬅ Ana sayfaya dön</a>

<script>
  // ============================================================
// PART 2 - DEĞİŞKENLER VE YARDIMCI FONKSİYONLAR
// ============================================================

const canvas = document.getElementById('oyunAlani');
const ctx = canvas.getContext('2d');
const W = 360, H = 360;

let oyunAktif = false, oyunBittiMi = false, skor = 0;
let yilan = [], yemler = [], botlar = [];
let yon = { x: 1, y: 0 };
let kamera = { x: 0, y: 0 }, zoom = 1, animasyonId;

let boostAktif = false, boostBasili = false;
const BOOST_HIZ = 4.0, NORMAL_HIZ = 1;

let zorluk = 'kolay';
let oyunModu = 'takimAvi';

let tumYilanlar = [];
let oyuncuTakim = '';
let oyuncuYilan = null;
let oyuncuOludu = false;
let kazananTakim = '';
let takimSayilari = { sari: 0, kirmizi: 0, mavi: 0, yesil: 0 };
let oyunDevamEdiyor = true;
let hedefMerkez = { x: 0, y: 0 };
let oyuncuKolezyumda = false;

const TAKIM_RENK_LISTESI = ['#ffd740', '#ff1744', '#448aff', '#69f0ae'];
const TAKIM_ISIMLERI = ['Sarı', 'Kırmızı', 'Mavi', 'Yeşil'];
const TAKIM_ANAHTARLARI = ['sari', 'kirmizi', 'mavi', 'yesil'];

const DUNYA_GENISLIK = 3000;
const DUNYA_YUKSEKLIK = 3000;

hedefMerkez.x = DUNYA_GENISLIK / 2;
hedefMerkez.y = DUNYA_YUKSEKLIK / 2;

const KOLEZYUM_YARICAP = 900;

const TAKIM_KOSE = [
  { x: 250, y: 250 },
  { x: DUNYA_GENISLIK - 250, y: 250 },
  { x: 250, y: DUNYA_YUKSEKLIK - 250 },
  { x: DUNYA_GENISLIK - 250, y: DUNYA_YUKSEKLIK - 250 }
];

const TAKIM_AYARLARI = {
  takimBasi: 10,
  botHiz: 2.0,
  saldiriAraligi: 20,
  yemSayisi: 250,
  baslangicBoyut: 12
};

const ZORLUK_AYARLARI = {
  kolay: { botSayisi: 12, botHiz: 0.8, agresiflik: 0.4, botBoyutMax: 25, yemSayisi: 250, botBoostIhtimal: 0.1 },
  orta: { botSayisi: 20, botHiz: 1.2, agresiflik: 0.6, botBoyutMax: 32, yemSayisi: 300, botBoostIhtimal: 0.2 },
  zor: { botSayisi: 28, botHiz: 1.6, agresiflik: 0.8, botBoyutMax: 40, yemSayisi: 350, botBoostIhtimal: 0.3 }
};

const RENKLER = ['#e53935','#ffb300','#43a047','#8e24aa','#fb8c00','#00acc1','#d81b60','#6a1b9a','#ff6f00','#00838f','#ad1457','#1a237e'];
const YEM_RENKLERI = ['#ff5252','#ff8a80','#ffab40','#ffd740','#69f0ae','#40c4ff','#448aff','#b388ff','#ff80ab','#ff6e40'];
const BOT_ISIMLERI = ["Ahmet","Zeynep","Mehmet","Elif","Can","Ayşe","Emre","Deniz","Kerem","Su","Berk","Nil","Arda","Ece","Kaan","Mira","Efe","Lara","Mert","Selin","Bora","Aylin","Naz","Cem","Ela","Tan","Ada","Koray","Leyla","Demir","Alya","Ege","Nisa","Sara","Ali","Defne","Okan","Melis"];

const skorGosterge = document.getElementById('skorGosterge');
const durumMesaji = document.getElementById('durumMesaji');
const siralamaKutusu = document.getElementById('siralamaKutusu');
const takimSayac = document.getElementById('takimSayac');
const baslatBtn = document.getElementById('baslatBtn');
const sifirlaBtn = document.getElementById('sifirlaBtn');
const boostBtn = document.getElementById('boostBtn');
const boostBoyut = document.getElementById('boostBoyut');
const zorlukBtnleri = document.querySelectorAll('.zorlukBtn');
const modBtnleri = document.querySelectorAll('.modBtn');

const joyTaban = document.getElementById('joystickTaban');
const joyTop = document.getElementById('joystickTop');
let joyAktif = false, joyVektor = { x: 0, y: 0 }, joyMerkez = { x: 0, y: 0 };
const joyYaricap = 30;

function rastgele(min, max) { return Math.random() * (max - min) + min; }

function mesafe(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function yilanOlustur(bx, by, uzunluk, yx, yy, r) {
  const y = [];
  const basR = r || 12;
  for (let i = 0; i < uzunluk; i++) {
    const oran = 1 - (i / Math.max(uzunluk, 1)) * 0.35;
    y.push({ x: bx - i * 9 * yx, y: by - i * 9 * yy, r: Math.max(basR * oran, 2) });
  }
  return y;
}

function yilanOlusturRenkli(bx, by, uzunluk, yx, yy, r, renk) {
  const y = [];
  const basR = r || 12;
  for (let i = 0; i < uzunluk; i++) {
    const oran = 1 - (i / Math.max(uzunluk, 1)) * 0.35;
    y.push({
      x: bx - i * 9 * yx,
      y: by - i * 9 * yy,
      r: Math.max(basR * oran, 2),
      renk: renk || '#ff5252'
    });
  }
  return y;
}

function yemOlustur(x, y, miktar) {
  const sayi = Math.min(Math.floor(miktar / 5) + 3, 15);
  for (let i = 0; i < sayi; i++) {
    yemler.push({
      x: Math.max(10, Math.min(DUNYA_GENISLIK - 10, x + rastgele(-40, 40))),
      y: Math.max(10, Math.min(DUNYA_YUKSEKLIK - 10, y + rastgele(-40, 40))),
      r: 6,
      renk: YEM_RENKLERI[Math.floor(Math.random() * YEM_RENKLERI.length)]
    });
  }
}

function yemUret() {
  if (yemler.length < TAKIM_AYARLARI.yemSayisi) {
    yemler.push({
      x: rastgele(20, DUNYA_GENISLIK - 20),
      y: rastgele(20, DUNYA_YUKSEKLIK - 20),
      r: 6,
      renk: YEM_RENKLERI[Math.floor(Math.random() * YEM_RENKLERI.length)]
    });
  }
}

function botOlustur() {
  const ayarlar = ZORLUK_AYARLARI[zorluk];
  const botR = rastgele(10, ayarlar.botBoyutMax);
  const uzunluk = Math.floor(rastgele(4, 12));
  let x, y, deneme = 0;
  do {
    x = rastgele(botR + 10, DUNYA_GENISLIK - botR - 10);
    y = rastgele(botR + 10, DUNYA_YUKSEKLIK - botR - 10);
    deneme++;
  } while (deneme < 40 && yilan && yilan.length > 0 && Math.hypot(x - yilan[0].x, y - yilan[0].y) < 250);

  botlar.push({
    segmentler: yilanOlustur(x, y, uzunluk, 1, 0, botR),
    yon: { x: rastgele(-1, 1), y: rastgele(-1, 1) },
    renk: RENKLER[Math.floor(Math.random() * RENKLER.length)],
    isim: BOT_ISIMLERI[Math.floor(Math.random() * BOT_ISIMLERI.length)],
    hedefX: rastgele(50, DUNYA_GENISLIK - 50),
    hedefY: rastgele(50, DUNYA_YUKSEKLIK - 50),
    yonDegistir: 0,
    skor: botR,
    boostAktif: false,
    boostSuresi: 0
  });
}

function siralamaGuncelle() {
  if (oyunModu === 'hayattaKalma') {
    const tum = botlar.map(b => ({ r: b.skor, isim: b.isim, ben: false }));
    tum.push({ r: skor, isim: 'Sen', ben: true });
    tum.sort((a, b) => b.r - a.r);
    const ilk5 = tum.slice(0, 5);
    let html = "<div style='opacity:0.7;margin-bottom:4px;'>🏆 Sıralama</div>";
    for (let i = 0; i < ilk5.length; i++) {
      const kisi = ilk5[i];
      const sinif = kisi.ben ? " class='ben'" : "";
      html += `<div${sinif}>${i+1}. ${kisi.isim} (${Math.round(kisi.r)})</div>`;
    }
    siralamaKutusu.innerHTML = html;
  } else {
    const list = [];
    for (let y of tumYilanlar) {
      const bas = y.segmentler[0];
      list.push({
        isim: y.isim || 'Bot',
        skor: Math.round(y.skor || 12),
        takim: y.takim || 'sari'
      });
    }
    list.sort((a, b) => b.skor - a.skor);
    const ilk5 = list.slice(0, 5);
    let html = "<div style='opacity:0.7;margin-bottom:4px;'>🏆 Sıralama</div>";
    for (let i = 0; i < ilk5.length; i++) {
      const k = ilk5[i];
      const cls = 'takim' + k.takim.charAt(0).toUpperCase() + k.takim.slice(1);
      html += "<div class='" + cls + "'>" + (i+1) + ". " + k.isim + " (" + k.skor + ")</div>";
    }
    siralamaKutusu.innerHTML = html;
  }
}

function takimSayacGuncelle() {
  if (oyunModu !== 'takimAvi') return;
  const sayac = { sari: 0, kirmizi: 0, mavi: 0, yesil: 0 };
  for (let y of tumYilanlar) {
    if (y.takim === 'sari') sayac.sari++;
    else if (y.takim === 'kirmizi') sayac.kirmizi++;
    else if (y.takim === 'mavi') sayac.mavi++;
    else if (y.takim === 'yesil') sayac.yesil++;
  }
  takimSayilari = sayac;
  const toplam = sayac.sari + sayac.kirmizi + sayac.mavi + sayac.yesil;
  skorGosterge.textContent = toplam;

  let html = '';
  html += '<div style="color:#ffd740;">🟡 ' + sayac.sari + '</div>';
  html += '<div style="color:#ff1744;">🔴 ' + sayac.kirmizi + '</div>';
  html += '<div style="color:#448aff;">🔵 ' + sayac.mavi + '</div>';
  html += '<div style="color:#69f0ae;">🟢 ' + sayac.yesil + '</div>';
  takimSayac.innerHTML = html;
}

function oyunuBitir(mesaj) {
  if (oyunBittiMi) return;
  oyunBittiMi = true;
  oyunAktif = false;
  oyunDevamEdiyor = false;
  boostAktif = false;
  boostBasili = false;
  boostBtn.classList.remove('turbo');
  boostBtn.style.background = 'rgba(255,82,82,0.2)';
  durumMesaji.textContent = mesaj;
  baslatBtn.textContent = '▶ Tekrar Başlat';
  baslatBtn.disabled = false;
  siralamaGuncelle();
  }
  // ============================================================
// PART 3 - MOD SEÇİMİ, ZORLUK VE JOYSTICK
// ============================================================

zorlukBtnleri.forEach(btn => {
  btn.addEventListener('click', function() {
    zorlukBtnleri.forEach(b => b.classList.remove('aktif'));
    this.classList.add('aktif');
    zorluk = this.dataset.zorluk;
    durumMesaji.textContent = '🎯 Zorluk: ' + zorluk.charAt(0).toUpperCase() + zorluk.slice(1);
    if (!oyunAktif) baslangicGorunumu();
    else oyunuBaslat();
  });
});

modBtnleri.forEach(function(btn) {
  btn.addEventListener('click', function() {
    modBtnleri.forEach(function(b) {
      b.classList.remove('aktif');
    });
    this.classList.add('aktif');
    oyunModu = this.dataset.mod;
    durumMesaji.textContent = '🎯 Mod: ' + (oyunModu === 'hayattaKalma' ? 'Hayatta Kal' : 'Takım Avı');
    if (!oyunAktif) {
      baslangicGorunumu();
    } else {
      oyunuBaslat();
    }
  });
});

function joyBasla(cx, cy) {
  joyAktif = true;
  const rect = joyTaban.getBoundingClientRect();
  joyMerkez = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
}
function joyHareket(cx, cy) {
  if (!joyAktif) return;
  let dx = cx - joyMerkez.x, dy = cy - joyMerkez.y;
  const len = Math.hypot(dx, dy);
  if (len > joyYaricap) { dx = (dx/len)*joyYaricap; dy = (dy/len)*joyYaricap; }
  joyTop.style.left = "calc(50% + " + dx + "px)";
  joyTop.style.top = "calc(50% + " + dy + "px)";
  joyVektor = { x: dx/joyYaricap, y: dy/joyYaricap };
}
function joyBitir() {
  joyAktif = false;
  joyVektor = { x: 0, y: 0 };
  joyTop.style.left = '50%';
  joyTop.style.top = '50%';
}
joyTaban.addEventListener('touchstart', e => { e.preventDefault(); joyBasla(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
joyTaban.addEventListener('touchmove', e => { e.preventDefault(); joyHareket(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
joyTaban.addEventListener('touchend', e => { e.preventDefault(); joyBitir(); }, {passive:false});
joyTaban.addEventListener('mousedown', e => joyBasla(e.clientX, e.clientY));
document.addEventListener('mousemove', e => { if(joyAktif) joyHareket(e.clientX, e.clientY); });
document.addEventListener('mouseup', joyBitir);

function boostBasla() {
  if (!oyunAktif || oyunBittiMi) return;
  if (oyunModu === 'takimAvi' && oyuncuOludu) return;
  boostBasili = true;
  boostAktif = true;
  boostBtn.classList.add('turbo');
  boostBtn.style.background = '#ff1744';
}
function boostBitir() {
  boostBasili = false;
  boostAktif = false;
  boostBtn.classList.remove('turbo');
  boostBtn.style.background = 'rgba(255,82,82,0.2)';
}
boostBtn.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); boostBasla(); }, {passive:false});
boostBtn.addEventListener('touchend', e => { e.preventDefault(); e.stopPropagation(); boostBitir(); }, {passive:false});
boostBtn.addEventListener('touchcancel', e => { e.preventDefault(); boostBitir(); }, {passive:false});
boostBtn.addEventListener('mousedown', e => { e.stopPropagation(); boostBasla(); });
boostBtn.addEventListener('mouseup', e => { e.stopPropagation(); boostBitir(); });
boostBtn.addEventListener('mouseleave', e => { if(boostBasili) boostBitir(); });

document.addEventListener('keydown', e => {
  if (!oyunAktif || oyunBittiMi) return;
  if (e.key === 'z' || e.key === 'Z') {
    if (oyunModu === 'takimAvi' && oyuncuOludu) return;
    e.preventDefault();
    boostBasla();
    return;
  }
  if (e.key === 'ArrowUp') { joyVektor = {x:0, y:-1}; e.preventDefault(); }
  else if (e.key === 'ArrowDown') { joyVektor = {x:0, y:1}; e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { joyVektor = {x:-1, y:0}; e.preventDefault(); }
  else if (e.key === 'ArrowRight') { joyVektor = {x:1, y:0}; e.preventDefault(); }
});
document.addEventListener('keyup', e => {
  if (e.key === 'z' || e.key === 'Z') { e.preventDefault(); boostBitir(); }
  if (e.key.indexOf('Arrow') === 0) joyVektor = {x:0, y:0};
});

function oyunuBaslat() {
  boostBtn.style.display = 'flex';
  if (oyunModu === 'hayattaKalma') {
    hayattaKalmaBaslat();
  } else {
    takimAviBaslat();
  }
      }

// PART 4 - HAYATTA KALMA MODU
// ============================================================

function hayattaKalmaBaslat() {
  const ayarlar = ZORLUK_AYARLARI[zorluk];
  const oyuncuR = 12;
  yilan = yilanOlustur(DUNYA_GENISLIK/2, DUNYA_YUKSEKLIK/2, 8, 1, 0, oyuncuR);
  yon = { x: 1, y: 0 };
  skor = oyuncuR;
  oyunBittiMi = false;
  oyunAktif = true;
  boostAktif = false;
  boostBasili = false;
  boostBtn.classList.remove('turbo');
  boostBtn.style.background = 'rgba(255,82,82,0.2)';
  boostBoyut.textContent = '-0%';
  skorGosterge.textContent = Math.round(skor);
  durumMesaji.textContent = '🎮 ' + zorluk.charAt(0).toUpperCase() + zorluk.slice(1) + ' mod başladı!';
  baslatBtn.textContent = '⏸ Oynanıyor...';
  baslatBtn.disabled = true;
  takimSayac.innerHTML = '';

  yemler = [];
  for (let i = 0; i < ayarlar.yemSayisi; i++) {
    yemler.push({ x: rastgele(20, DUNYA_GENISLIK-20), y: rastgele(20, DUNYA_YUKSEKLIK-20), r: 6, renk: YEM_RENKLERI[Math.floor(Math.random() * YEM_RENKLERI.length)] });
  }
  botlar = [];
  for (let i = 0; i < ayarlar.botSayisi; i++) botOlustur();
  if (animasyonId) cancelAnimationFrame(animasyonId);
  hayattaKalmaDongusu();
}

function hayattaKalmaDongusu() {
  if (!oyunAktif || oyunBittiMi) {
    animasyonId = requestAnimationFrame(hayattaKalmaDongusu);
    return;
  }

  const ayarlar = ZORLUK_AYARLARI[zorluk];
  let hizCarpani = NORMAL_HIZ;

  if (boostAktif) {
    hizCarpani = BOOST_HIZ;
    if (yilan[0].r > 6) {
      yilan[0].r -= 0.06;
      skor = yilan[0].r;
      boostBoyut.textContent = '-' + Math.round(((12 - yilan[0].r)/12*100)) + '%';
    } else { boostBitir(); boostBoyut.textContent = '-0%'; }
  } else boostBoyut.textContent = '-0%';

  if (joyVektor.x !== 0 || joyVektor.y !== 0) {
    const boyutCarpani = 1 + (skor - 12) * 0.015;
    const tabanHiz = Math.max(1.5, 4 + skor * 0.02);
    const hiz = tabanHiz * hizCarpani * boyutCarpani;
    yilan[0].x += joyVektor.x * hiz;
    yilan[0].y += joyVektor.y * hiz;
  }

  for (let i = yilan.length - 1; i > 0; i--) {
    const dx = yilan[i-1].x - yilan[i].x, dy = yilan[i-1].y - yilan[i].y;
    const m = Math.hypot(dx, dy);
    if (m > 1) { yilan[i].x += dx * 0.5; yilan[i].y += dy * 0.5; }
    else { yilan[i].x = yilan[i-1].x; yilan[i].y = yilan[i-1].y; }
    if (yilan[i-1]) {
      const oran = 1 - (i / yilan.length) * 0.35;
      yilan[i].r = Math.max(yilan[0].r * oran, 2);
    }
  }

  const bas = yilan[0];
  if (bas.x < bas.r || bas.x > DUNYA_GENISLIK - bas.r || bas.y < bas.r || bas.y > DUNYA_YUKSEKLIK - bas.r) {
    oyunuBitir('💀 Duvara çarptın! Boyut: ' + Math.round(skor));
    return;
  }

  for (let i = yemler.length - 1; i >= 0; i--) {
    const y = yemler[i];
    if (Math.hypot(bas.x - y.x, bas.y - y.y) < bas.r + y.r) {
      skor += 0.5;
      bas.r += 0.3;
      const son = yilan[yilan.length - 1];
      yilan.push({ x: son.x, y: son.y, r: Math.max(bas.r * 0.65, 2) });
      yemler.splice(i, 1);
      yemUretHayattaKalma();
    }
  }

  for (let i = 0; i < botlar.length; i++) {
    const bot = botlar[i];
    const botBas = bot.segmentler[0];
    bot.yonDegistir++;

    if (Math.random() < ayarlar.botBoostIhtimal * 0.02 && bot.skor > 15) {
      bot.boostAktif = true;
      bot.boostSuresi = 40 + Math.floor(rastgele(0, 30));
    }
    if (bot.boostAktif) {
      bot.boostSuresi--;
      if (bot.boostSuresi <= 0) bot.boostAktif = false;
      if (bot.skor > 6) { bot.skor -= 0.03; botBas.r -= 0.03; }
    }

    if (bot.yonDegistir > 30 + rastgele(0, 30)) {
      let hedefX, hedefY;
      const rastgeleSecim = Math.random();
      const oyuncuHedefIhtimal = ayarlar.agresiflik + (bot.boostAktif ? 0.2 : 0);
      if (rastgeleSecim < oyuncuHedefIhtimal && bot.skor > skor * 0.5) {
        hedefX = bas.x + rastgele(-60, 60);
        hedefY = bas.y + rastgele(-60, 60);
      } else if (rastgeleSecim < oyuncuHedefIhtimal + 0.15 && skor > bot.skor * 1.1) {
        hedefX = botBas.x + (botBas.x - bas.x) * 4 + rastgele(-60, 60);
        hedefY = botBas.y + (botBas.y - bas.y) * 4 + rastgele(-60, 60);
      } else {
        let enYakinYem = null, enYakinMesafe = Infinity;
        for (let j = 0; j < yemler.length; j++) {
          const y = yemler[j];
          const d = Math.hypot(botBas.x - y.x, botBas.y - y.y);
          if (d < enYakinMesafe) { enYakinMesafe = d; enYakinYem = y; }
        }
        if (enYakinYem && enYakinMesafe < 900) {
          hedefX = enYakinYem.x + rastgele(-30, 30);
          hedefY = enYakinYem.y + rastgele(-30, 30);
        } else {
          hedefX = rastgele(50, DUNYA_GENISLIK - 50);
          hedefY = rastgele(50, DUNYA_YUKSEKLIK - 50);
        }
      }
      bot.hedefX = Math.max(10, Math.min(DUNYA_GENISLIK - 10, hedefX));
      bot.hedefY = Math.max(10, Math.min(DUNYA_YUKSEKLIK - 10, hedefY));
      bot.yonDegistir = 0;
    }

    const dx = bot.hedefX - botBas.x, dy = bot.hedefY - botBas.y;
    const mesafe = Math.hypot(dx, dy);
    if (mesafe > 5) { bot.yon.x = dx/mesafe; bot.yon.y = dy/mesafe; }

    const botHizCarpani = bot.boostAktif ? 2.5 : 1;
    const boyutCarpani = 1 + (bot.skor - 12) * 0.015;
    const hiz = Math.max(1.0, (3.5 + ayarlar.botHiz) - bot.skor * 0.005) * botHizCarpani * boyutCarpani;
    botBas.x += bot.yon.x * hiz;
    botBas.y += bot.yon.y * hiz;

    for (let j = bot.segmentler.length - 1; j > 0; j--) {
      const dx2 = bot.segmentler[j-1].x - bot.segmentler[j].x, dy2 = bot.segmentler[j-1].y - bot.segmentler[j].y;
      const m2 = Math.hypot(dx2, dy2);
      if (m2 > 1) { bot.segmentler[j].x += dx2 * 0.5; bot.segmentler[j].y += dy2 * 0.5; }
      else { bot.segmentler[j].x = bot.segmentler[j-1].x; bot.segmentler[j].y = bot.segmentler[j-1].y; }
      if (bot.segmentler[j-1]) {
        const oran = 1 - (j / bot.segmentler.length) * 0.35;
        bot.segmentler[j].r = Math.max(bot.segmentler[0].r * oran, 2);
      }
    }

    if (botBas.x < botBas.r || botBas.x > DUNYA_GENISLIK - botBas.r) bot.yon.x *= -1;
    if (botBas.y < botBas.r || botBas.y > DUNYA_YUKSEKLIK - botBas.y) bot.yon.y *= -1;
    botBas.x = Math.max(botBas.r, Math.min(DUNYA_GENISLIK - botBas.r, botBas.x));
    botBas.y = Math.max(botBas.r, Math.min(DUNYA_YUKSEKLIK - botBas.r, botBas.y));

    for (let j = yemler.length - 1; j >= 0; j--) {
      const y = yemler[j];
      if (Math.hypot(botBas.x - y.x, botBas.y - y.y) < botBas.r + y.r) {
        bot.skor += 0.5;
        botBas.r += 0.25;
        const son = bot.segmentler[bot.segmentler.length - 1];
        bot.segmentler.push({ x: son.x, y: son.y, r: Math.max(botBas.r * 0.65, 2) });
        yemler.splice(j, 1);
        yemUretHayattaKalma();
      }
    }
  }

  const silinecekBotlar = new Set();
  for (let i = 0; i < botlar.length; i++) {
    if (silinecekBotlar.has(i)) continue;
    for (let j = i+1; j < botlar.length; j++) {
      if (silinecekBotlar.has(j)) continue;
      const b1 = botlar[i], b2 = botlar[j];
      const b1b = b1.segmentler[0], b2b = b2.segmentler[0];
      if (Math.hypot(b1b.x - b2b.x, b1b.y - b2b.y) < b1b.r + b2b.r) {
        if (b1.skor > b2.skor + 2) {
          b1.skor += b2.skor * 0.25; b1b.r += b2.skor * 0.06;
          yemOlustur(b2b.x, b2b.y, b2.skor * 0.3);
          silinecekBotlar.add(j);
        } else if (b2.skor > b1.skor + 2) {
          b2.skor += b1.skor * 0.25; b2b.r += b1.skor * 0.06;
          yemOlustur(b1b.x, b1b.y, b1.skor * 0.3);
          silinecekBotlar.add(i);
        }
      }
    }
  }
  Array.from(silinecekBotlar).sort((a,b)=>b-a).forEach(idx => { botlar.splice(idx,1); botOlustur(); });

  for (let i = botlar.length - 1; i >= 0; i--) {
    const bot = botlar[i];
    const botBas = bot.segmentler[0];
    if (Math.hypot(bas.x - botBas.x, bas.y - botBas.y) < bas.r + botBas.r) {
      if (bas.r > botBas.r + 3) {
        skor += bot.skor * 0.3; bas.r += bot.skor * 0.1;
        yemOlustur(botBas.x, botBas.y, bot.skor * 0.4);
        botlar.splice(i, 1); botOlustur();
        continue;
      } else if (botBas.r > bas.r + 3) {
        oyunuBitir('💀 ' + bot.isim + ' seni yedi! Boyut: ' + Math.round(skor));
        return;
      } else {
        yemOlustur(botBas.x, botBas.y, bot.skor * 0.3);
        botlar.splice(i, 1); botOlustur();
        oyunuBitir('💀 Berabere! Boyut: ' + Math.round(skor));
        return;
      }
    }
    for (let j = 1; j < yilan.length; j++) {
      const seg = yilan[j];
      if (Math.hypot(botBas.x - seg.x, botBas.y - seg.y) < botBas.r + seg.r) {
        skor += bot.skor * 0.2; bas.r += bot.skor * 0.05;
        yemOlustur(botBas.x, botBas.y, bot.skor * 0.3);
        botlar.splice(i, 1); botOlustur();
        break;
      }
    }
    for (let j = 1; j < bot.segmentler.length; j++) {
      const seg = bot.segmentler[j];
      if (Math.hypot(bas.x - seg.x, bas.y - seg.y) < bas.r + seg.r) {
        oyunuBitir('💀 ' + bot.isim + '\'in gövdesine çarptın! Boyut: ' + Math.round(skor));
        return;
      }
    }
  }

  while (botlar.length < ayarlar.botSayisi) botOlustur();

  skor = bas.r;
  skorGosterge.textContent = Math.round(skor);

  let toplamX = 0, toplamY = 0;
  for (let i = 0; i < yilan.length; i++) { toplamX += yilan[i].x; toplamY += yilan[i].y; }
  const merkezX = toplamX / yilan.length;
  const merkezY = toplamY / yilan.length;
  let maxR = 0;
  for (let i = 0; i < yilan.length; i++) {
    const m = Math.hypot(yilan[i].x - merkezX, yilan[i].y - merkezY);
    if (m + yilan[i].r > maxR) maxR = m + yilan[i].r;
  }
  const idealZoom = Math.max(0.06, Math.min(0.9, (W * 0.4) / (maxR * 1.8)));
  zoom += (idealZoom - zoom) * 0.06;
  const viewW = W / zoom, viewH = H / zoom;
  kamera.x = Math.max(0, Math.min(DUNYA_GENISLIK - viewW, merkezX - viewW/2));
  kamera.y = Math.max(0, Math.min(DUNYA_YUKSEKLIK - viewH, merkezY - viewH/2));

  cizimYap();
  siralamaGuncelle();
  animasyonId = requestAnimationFrame(hayattaKalmaDongusu);
}

function yemUretHayattaKalma() {
  const ayarlar = ZORLUK_AYARLARI[zorluk];
  if (yemler.length < ayarlar.yemSayisi) {
    yemler.push({
      x: rastgele(20, DUNYA_GENISLIK - 20),
      y: rastgele(20, DUNYA_YUKSEKLIK - 20),
      r: 6,
      renk: YEM_RENKLERI[Math.floor(Math.random() * YEM_RENKLERI.length)]
    });
  }
        }

function takimAviBaslat() {
  const ayarlar = TAKIM_AYARLARI;
  const takimBasi = ayarlar.takimBasi;
  const oyuncuR = ayarlar.baslangicBoyut;

  tumYilanlar = [];
  oyuncuOludu = false;
  oyuncuYilan = null;
  kazananTakim = '';
  oyunBittiMi = false;
  oyunAktif = true;
  oyunDevamEdiyor = true;
  boostAktif = false;
  boostBasili = false;
  boostBtn.classList.remove('turbo');
  boostBtn.style.background = 'rgba(255,82,82,0.2)';
  boostBoyut.textContent = '-0%';
  baslatBtn.textContent = '⏸ Oynanıyor...';
  baslatBtn.disabled = true;
  oyuncuKolezyumda = false;

  // OYUNCU (Sarı - Sol Üst)
  const oyuncuTakimIndex = 0;
  oyuncuTakim = TAKIM_ANAHTARLARI[oyuncuTakimIndex];
  const oyuncuRenk = TAKIM_RENK_LISTESI[oyuncuTakimIndex];
  const oyuncuKose = TAKIM_KOSE[oyuncuTakimIndex];

  const oyuncuSeg = yilanOlusturRenkli(
    oyuncuKose.x + rastgele(-80, 80),
    oyuncuKose.y + rastgele(-80, 80),
    8, 1, 0, oyuncuR, oyuncuRenk
  );
  oyuncuYilan = {
    segmentler: oyuncuSeg,
    takim: oyuncuTakim,
    takimIndex: oyuncuTakimIndex,
    renk: oyuncuRenk,
    skor: oyuncuR,
    yon: { x: 1, y: 0 },
    hedefX: hedefMerkez.x + rastgele(-200, 200),
    hedefY: hedefMerkez.y + rastgele(-200, 200),
    yonDegistir: 0,
    isim: 'Sen',
    oyuncu: true,
    hedefeVaris: false,
    kolezyumda: false
  };
  tumYilanlar.push(oyuncuYilan);

  // BOT TAKIMLARI - Her takım kendi köşesinde başlıyor
  for (let i = 1; i < 4; i++) {
    const takimAdi = TAKIM_ANAHTARLARI[i];
    const renkKodu = TAKIM_RENK_LISTESI[i];
    const kose = TAKIM_KOSE[i];

    for (let j = 0; j < takimBasi; j++) {
      const r = oyuncuR + rastgele(-2, 4);
      const uzunluk = Math.floor(rastgele(5, 10));
      const yonX = rastgele(-1, 1) || 1;
      const yonY = rastgele(-1, 1) || 1;
      const x = kose.x + rastgele(-100, 100);
      const y = kose.y + rastgele(-100, 100);

      // KOLEZYUM İÇİNDE DAĞINIK HEDEF
      let hedefX, hedefY;
      const aci = rastgele(0, Math.PI * 2);
      const mesafe = rastgele(100, KOLEZYUM_YARICAP - 50);
      hedefX = hedefMerkez.x + Math.cos(aci) * mesafe;
      hedefY = hedefMerkez.y + Math.sin(aci) * mesafe;

      const yilanNesnesi = {
        segmentler: yilanOlusturRenkli(x, y, uzunluk, yonX, yonY, r, renkKodu),
        takim: takimAdi,
        takimIndex: i,
        renk: renkKodu,
        skor: r,
        yon: { x: rastgele(-1, 1) || 1, y: rastgele(-1, 1) || 1 },
        hedefX: hedefX,
        hedefY: hedefY,
        yonDegistir: 0,
        isim: BOT_ISIMLERI[Math.floor(Math.random() * BOT_ISIMLERI.length)] || 'Bot',
        oyuncu: false,
        hedefeVaris: false,
        kolezyumda: false,
        hedefBekleme: 0,
        saldiriHedefi: null,
        saldiriSuresi: 0,
        hedefBelirlemeZamani: 0
      };
      tumYilanlar.push(yilanNesnesi);
    }
  }

  yemler = [];
  for (let i = 0; i < ayarlar.yemSayisi; i++) {
    yemler.push({
      x: rastgele(20, DUNYA_GENISLIK - 20),
      y: rastgele(20, DUNYA_YUKSEKLIK - 20),
      r: 6,
      renk: YEM_RENKLERI[Math.floor(Math.random() * YEM_RENKLERI.length)]
    });
  }

  const renkMap = {
    sari: '🟡 Sarı (Sol Üst)',
    kirmizi: '🔴 Kırmızı (Sağ Üst)',
    mavi: '🔵 Mavi (Sol Alt)',
    yesil: '🟢 Yeşil (Sağ Alt)'
  };
  durumMesaji.textContent = '⚔️ Takım savaşı başladı! Senin takımın: ' + renkMap[oyuncuTakim];
  takimSayacGuncelle();
  siralamaGuncelle();

  if (animasyonId) cancelAnimationFrame(animasyonId);
  takimAviDongusu();
}

function takimAviDongusu() {
  if (!oyunAktif || oyunBittiMi) {
    animasyonId = requestAnimationFrame(takimAviDongusu);
    return;
  }

  const ayarlar = TAKIM_AYARLARI;
  const hiz = ayarlar.botHiz;

  // OYUNCU KONTROLÜ
  if (oyuncuYilan && !oyuncuOludu) {
    const bas = oyuncuYilan.segmentler[0];

    const kolezyumMerkezMesafe = mesafe(bas, hedefMerkez);
    if (kolezyumMerkezMesafe < KOLEZYUM_YARICAP) {
      if (!oyuncuKolezyumda) {
        oyuncuKolezyumda = true;
        durumMesaji.textContent = '⚔️ Kolezyuma girdin! Savaş başlasın!';
      }
    }

    if (boostAktif) {
      if (bas.r > 6) {
        bas.r -= 0.06;
        oyuncuYilan.skor = bas.r;
        boostBoyut.textContent = '-' + Math.round(((12 - bas.r)/12*100)) + '%';
      } else { boostBitir(); boostBoyut.textContent = '-0%'; }
    } else boostBoyut.textContent = '-0%';

    if (joyVektor.x !== 0 || joyVektor.y !== 0) {
      const boyutCarpani = 1 + (bas.r - 12) * 0.015;
      const tabanHiz = Math.max(2.0, 5 + bas.r * 0.02);
      const hizCarpani = boostAktif ? BOOST_HIZ : NORMAL_HIZ;
      const hareketHiz = tabanHiz * hizCarpani * boyutCarpani;
      bas.x += joyVektor.x * hareketHiz;
      bas.y += joyVektor.y * hareketHiz;
    }

    if (bas.x < bas.r || bas.x > DUNYA_GENISLIK - bas.r ||
        bas.y < bas.r || bas.y > DUNYA_YUKSEKLIK - bas.r) {
      oyuncuOludu = true;
      oyuncuYilan = null;
      durumMesaji.textContent = '💀 Duvara çarptın! İzleyici modu...';
      takimSayacGuncelle();
      siralamaGuncelle();
      takimAviCizim();
      animasyonId = requestAnimationFrame(takimAviDongusu);
      return;
    }

    for (let i = oyuncuYilan.segmentler.length - 1; i > 0; i--) {
      const dx = oyuncuYilan.segmentler[i-1].x - oyuncuYilan.segmentler[i].x;
      const dy = oyuncuYilan.segmentler[i-1].y - oyuncuYilan.segmentler[i].y;
      const m = Math.hypot(dx, dy);
      if (m > 1) {
        oyuncuYilan.segmentler[i].x += dx * 0.5;
        oyuncuYilan.segmentler[i].y += dy * 0.5;
      } else {
        oyuncuYilan.segmentler[i].x = oyuncuYilan.segmentler[i-1].x;
        oyuncuYilan.segmentler[i].y = oyuncuYilan.segmentler[i-1].y;
      }
      if (oyuncuYilan.segmentler[i-1]) {
        const oran = 1 - (i / oyuncuYilan.segmentler.length) * 0.35;
        oyuncuYilan.segmentler[i].r = Math.max(oyuncuYilan.segmentler[0].r * oran, 2);
      }
    }

    const bas2 = oyuncuYilan.segmentler[0];
    for (let i = yemler.length - 1; i >= 0; i--) {
      const y = yemler[i];
      if (Math.hypot(bas2.x - y.x, bas2.y - y.y) < bas2.r + y.r) {
        bas2.r += 0.4;
        oyuncuYilan.skor = bas2.r;
        const son = oyuncuYilan.segmentler[oyuncuYilan.segmentler.length - 1];
        oyuncuYilan.segmentler.push({ x: son.x, y: son.y, r: Math.max(bas2.r * 0.65, 2), renk: oyuncuYilan.renk });
        yemler.splice(i, 1);
        yemUret();
      }
    }
  }

  // ============================================================
  // BOT YILANLARI KONTROLÜ - DÜZELTİLDİ
  // ============================================================
  for (let i = 0; i < tumYilanlar.length; i++) {
    const y = tumYilanlar[i];
    if (y.oyuncu) continue;

    const bas = y.segmentler[0];
    const kolezyumda = mesafe(bas, hedefMerkez) < KOLEZYUM_YARICAP;

    // ---- HEDEF BELİRLEME ----
    let hedefBelirlendi = false;

    // 1. Eğer saldırı hedefi varsa ve süresi devam ediyorsa
    if (y.saldiriHedefi && y.saldiriSuresi > 0) {
      const hedefBas = y.saldiriHedefi.segmentler[0];
      const d = mesafe(bas, hedefBas);
      // Hedef hala kolezyumda mı ve çok uzak değil mi?
      const hedefKolezyumda = mesafe(hedefBas, hedefMerkez) < KOLEZYUM_YARICAP;
      if (hedefKolezyumda && d < 900) {
        y.hedefX = hedefBas.x + rastgele(-30, 30);
        y.hedefY = hedefBas.y + rastgele(-30, 30);
        y.saldiriSuresi--;
        hedefBelirlendi = true;
      } else {
        // Hedef geçersiz oldu, saldırıyı iptal et
        y.saldiriHedefi = null;
        y.saldiriSuresi = 0;
      }
    }

    // 2. Yeni hedef belirle (sadece kolezyum içinde ve hedef belirlenmediyse)
    if (!hedefBelirlendi && kolezyumda) {
      // Rakipleri topla
      let rakipler = [];
      for (let j = 0; j < tumYilanlar.length; j++) {
        if (i === j) continue;
        const rakip = tumYilanlar[j];
        if (rakip.takim === y.takim) continue;
        const rakipBas = rakip.segmentler[0];
        const rakipKolezyumda = mesafe(rakipBas, hedefMerkez) < KOLEZYUM_YARICAP;
        if (!rakipKolezyumda) continue;
        const d = mesafe(bas, rakipBas);
        rakipler.push({ rakip: rakip, mesafe: d });
      }

      // Rakipleri mesafeye göre sırala
      rakipler.sort((a, b) => a.mesafe - b.mesafe);

      // En yakın 3 rakipten rastgele birini seç (dağıtık saldırı)
      if (rakipler.length > 0) {
        let secilecekIndex = 0;
        if (rakipler.length >= 3) {
          secilecekIndex = Math.floor(Math.random() * Math.min(3, rakipler.length));
        } else {
          secilecekIndex = Math.floor(Math.random() * rakipler.length);
        }
        const secilen = rakipler[secilecekIndex];
        if (secilen.mesafe < 700) {
          y.saldiriHedefi = secilen.rakip;
          y.saldiriSuresi = 40 + Math.floor(rastgele(0, 40));
          const hedefBas = secilen.rakip.segmentler[0];
          y.hedefX = hedefBas.x + rastgele(-30, 30);
          y.hedefY = hedefBas.y + rastgele(-30, 30);
          hedefBelirlendi = true;
        }
      }

      // 3. Hala hedef belirlenmediyse rastgele dolaş
      if (!hedefBelirlendi) {
        y.hedefBekleme++;
        if (y.hedefBekleme > 15 + rastgele(0, 15)) {
          const aci = rastgele(0, Math.PI * 2);
          const mesafe = rastgele(80, KOLEZYUM_YARICAP - 60);
          y.hedefX = hedefMerkez.x + Math.cos(aci) * mesafe;
          y.hedefY = hedefMerkez.y + Math.sin(aci) * mesafe;
          y.hedefBekleme = 0;
          hedefBelirlendi = true;
        }
      }
    }

    // KOLEZYUM DIŞINDA - KOLEZYUMA DOĞRU İLERLE
    if (!kolezyumda && !hedefBelirlendi) {
      y.hedefBekleme++;
      if (y.hedefBekleme > 10) {
        const aci = rastgele(0, Math.PI * 2);
        const mesafe = rastgele(100, KOLEZYUM_YARICAP - 100);
        y.hedefX = hedefMerkez.x + Math.cos(aci) * mesafe;
        y.hedefY = hedefMerkez.y + Math.sin(aci) * mesafe;
        y.hedefBekleme = 0;
        hedefBelirlendi = true;
      }
    }

    // ---- HEDEFE DOĞRU HAREKET ET ----
    const dx = y.hedefX - bas.x;
    const dy = y.hedefY - bas.y;
    const m = Math.hypot(dx, dy);

    if (m > 5) {
      y.yon.x = dx / m;
      y.yon.y = dy / m;
    }

    // HIZ
    const boyutCarpani = 1 + (y.skor - 12) * 0.01;
    const saldiriHizCarpani = (y.saldiriSuresi > 0) ? 1.6 : 1.0;
    const minHiz = 2.5;
    const maxHiz = 6.5;
    const hizCarpani = Math.max(minHiz, Math.min(maxHiz, 3.5 + hiz * 1.8 - y.skor * 0.02)) * saldiriHizCarpani;
    const hareketHiz = hizCarpani / boyutCarpani;
    
    bas.x += y.yon.x * hareketHiz;
    bas.y += y.yon.y * hareketHiz;

    // Duvara çarpma kontrolü
    if (bas.x < bas.r || bas.x > DUNYA_GENISLIK - bas.r) y.yon.x *= -1;
    if (bas.y < bas.r || bas.y > DUNYA_YUKSEKLIK - bas.y) y.yon.y *= -1;
    bas.x = Math.max(bas.r, Math.min(DUNYA_GENISLIK - bas.r, bas.x));
    bas.y = Math.max(bas.r, Math.min(DUNYA_YUKSEKLIK - bas.y, bas.y));

    // Segmentleri güncelle
    for (let j = y.segmentler.length - 1; j > 0; j--) {
      const dx2 = y.segmentler[j-1].x - y.segmentler[j].x;
      const dy2 = y.segmentler[j-1].y - y.segmentler[j].y;
      const m2 = Math.hypot(dx2, dy2);
      if (m2 > 1) {
        y.segmentler[j].x += dx2 * 0.5;
        y.segmentler[j].y += dy2 * 0.5;
      } else {
        y.segmentler[j].x = y.segmentler[j-1].x;
        y.segmentler[j].y = y.segmentler[j-1].y;
      }
      if (y.segmentler[j-1]) {
        const oran = 1 - (j / y.segmentler.length) * 0.35;
        y.segmentler[j].r = Math.max(y.segmentler[0].r * oran, 2);
      }
    }

    // Yem yeme
    for (let j = yemler.length - 1; j >= 0; j--) {
      const yem = yemler[j];
      if (Math.hypot(bas.x - yem.x, bas.y - yem.y) < bas.r + yem.r) {
        y.skor += 0.5;
        bas.r += 0.25;
        const son = y.segmentler[y.segmentler.length - 1];
        y.segmentler.push({ x: son.x, y: son.y, r: Math.max(bas.r * 0.65, 2), renk: y.renk });
        yemler.splice(j, 1);
        yemUret();
      }
    }
  }

  // ÇARPIŞMA KONTROLÜ - SADECE KOLEZYUM İÇİNDE
  const silinecekler = new Set();

  for (let i = 0; i < tumYilanlar.length; i++) {
    if (silinecekler.has(i)) continue;
    const y1 = tumYilanlar[i];
    const bas1 = y1.segmentler[0];

    const y1Kolezyumda = mesafe(bas1, hedefMerkez) < KOLEZYUM_YARICAP;

    for (let j = i + 1; j < tumYilanlar.length; j++) {
      if (silinecekler.has(j)) continue;
      const y2 = tumYilanlar[j];

      if (y1.takim === y2.takim) continue;

      const bas2 = y2.segmentler[0];
      const y2Kolezyumda = mesafe(bas2, hedefMerkez) < KOLEZYUM_YARICAP;

      if (!y1Kolezyumda || !y2Kolezyumda) continue;

      const dist = mesafe(bas1, bas2);
      const minDist = bas1.r + bas2.r;

      if (dist < minDist) {
        const y1Oyuncu = y1.oyuncu || false;
        const y2Oyuncu = y2.oyuncu || false;

        if (y1Oyuncu || y2Oyuncu) {
          const oyuncu = y1Oyuncu ? y1 : y2;
          const rakip = y1Oyuncu ? y2 : y1;
          const oyuncuBas = oyuncu.segmentler[0];
          const rakipBas = rakip.segmentler[0];

          if (rakip.skor > oyuncu.skor + 3) {
            oyuncuOludu = true;
            oyuncuYilan = null;
            silinecekler.add(y1Oyuncu ? i : j);
            durumMesaji.textContent = '💀 ' + rakip.isim + ' seni yedi! İzleyici modu...';
            break;
          } else if (oyuncu.skor > rakip.skor + 3) {
            oyuncu.skor += rakip.skor * 0.2;
            oyuncuBas.r += rakip.skor * 0.05;
            yemOlustur(rakipBas.x, rakipBas.y, rakip.skor * 0.3);
            silinecekler.add(y1Oyuncu ? j : i);
            oyuncu.yonDegistir = 0;
          } else {
            silinecekler.add(i);
            silinecekler.add(j);
            yemOlustur(bas1.x, bas1.y, y1.skor * 0.3);
            yemOlustur(bas2.x, bas2.y, y2.skor * 0.3);
            if (y1Oyuncu || y2Oyuncu) {
              oyuncuOludu = true;
              oyuncuYilan = null;
              durumMesaji.textContent = '💀 Berabere! İzleyici modu...';
            }
          }
        } else {
          if (y1.skor > y2.skor + 3) {
            silinecekler.add(j);
            y1.skor += y2.skor * 0.2;
            bas1.r += y2.skor * 0.05;
            yemOlustur(bas2.x, bas2.y, y2.skor * 0.3);
            y1.yonDegistir = 0;
          } else if (y2.skor > y1.skor + 3) {
            silinecekler.add(i);
            y2.skor += y1.skor * 0.2;
            bas2.r += y1.skor * 0.05;
            yemOlustur(bas1.x, bas1.y, y1.skor * 0.3);
            y2.yonDegistir = 0;
            break;
          } else {
            silinecekler.add(i);
            silinecekler.add(j);
            yemOlustur(bas1.x, bas1.y, y1.skor * 0.3);
            yemOlustur(bas2.x, bas2.y, y2.skor * 0.3);
            break;
          }
        }
      }
    }
  }

  // OYUNCU GÖVDESİ İLE RAKİP BAŞI ÇARPIŞMASI
  if (oyuncuYilan && !oyuncuOludu && oyuncuKolezyumda) {
    const oyuncuSegments = oyuncuYilan.segmentler;
    const oyuncuBas = oyuncuSegments[0];
    const oyuncuKolezyumda = mesafe(oyuncuBas, hedefMerkez) < KOLEZYUM_YARICAP;

    if (oyuncuKolezyumda) {
      for (let j = 0; j < tumYilanlar.length; j++) {
        if (silinecekler.has(j)) continue;
        const rakip = tumYilanlar[j];
        if (rakip.oyuncu) continue;
        if (rakip.takim === oyuncuYilan.takim) continue;

        const rakipBas = rakip.segmentler[0];
        const rakipKolezyumda = mesafe(rakipBas, hedefMerkez) < KOLEZYUM_YARICAP;
        if (!rakipKolezyumda) continue;

        for (let s = 1; s < oyuncuSegments.length; s++) {
          const seg = oyuncuSegments[s];
          const distToBody = mesafe(seg, rakipBas);
          const minDistBody = seg.r + rakipBas.r;

          if (distToBody < minDistBody) {
            if (rakip.skor > 0) {
              oyuncuYilan.skor += rakip.skor * 0.2;
              oyuncuYilan.segmentler[0].r += rakip.skor * 0.05;
              yemOlustur(rakipBas.x, rakipBas.y, rakip.skor * 0.3);
            }
            silinecekler.add(j);
            durumMesaji.textContent = '⚔️ Rakip gövdesine çarptı! +' + Math.round(rakip.skor * 0.2);
            break;
          }
        }
      }
    }
  }

  if (silinecekler.size > 0) {
    const sorted = Array.from(silinecekler).sort((a, b) => b - a);
    for (let idx of sorted) {
      if (tumYilanlar[idx] && tumYilanlar[idx].oyuncu) {
        oyuncuOludu = true;
        oyuncuYilan = null;
        durumMesaji.textContent = '💀 Sen öldün! İzleyici modu...';
      }
      tumYilanlar.splice(idx, 1);
    }
  }

  const kalanTakimlar = new Set();
  for (let y of tumYilanlar) {
    kalanTakimlar.add(y.takim);
  }

  if (kalanTakimlar.size <= 1 && tumYilanlar.length > 0) {
    const kazanan = tumYilanlar[0].takim;
    const renkMap = {
      sari: '🟡 Sarı (Sol Üst)',
      kirmizi: '🔴 Kırmızı (Sağ Üst)',
      mavi: '🔵 Mavi (Sol Alt)',
      yesil: '🟢 Yeşil (Sağ Alt)'
    };
    oyunuBitir('🏆 ' + renkMap[kazanan] + ' takım kazandı!');
    return;
  }

  if (tumYilanlar.length <= 0) {
    oyunuBitir('💀 Savaş bitti!');
    return;
  }

  takimSayacGuncelle();
  siralamaGuncelle();
  takimAviCizim();
  animasyonId = requestAnimationFrame(takimAviDongusu);
          }
  // ============================================================
// PART 6 - ÇİZİM, BAŞLATMA VE SIFIRLAMA
// ============================================================

function takimAviCizim() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();

  let zoomOran;
  let merkezX, merkezY;

  if (oyuncuYilan && !oyuncuOludu) {
    const bas = oyuncuYilan.segmentler[0];
    merkezX = bas.x;
    merkezY = bas.y;
    let maxR = 0;
    for (let seg of oyuncuYilan.segmentler) {
      const m = Math.hypot(seg.x - merkezX, seg.y - merkezY);
      if (m + seg.r > maxR) maxR = m + seg.r;
    }
    const idealZoom = Math.max(0.06, Math.min(0.9, (W * 0.7) / (maxR * 2.5)));
    zoom += (idealZoom - zoom) * 0.06;
    zoomOran = zoom;
  } else {
    zoomOran = Math.min(W / DUNYA_GENISLIK, H / DUNYA_YUKSEKLIK) * 2.5;
    merkezX = DUNYA_GENISLIK / 2;
    merkezY = DUNYA_YUKSEKLIK / 2;
  }

  const viewW = W / zoomOran;
  const viewH = H / zoomOran;
  const kameraX = Math.max(0, Math.min(DUNYA_GENISLIK - viewW, merkezX - viewW/2));
  const kameraY = Math.max(0, Math.min(DUNYA_YUKSEKLIK - viewH, merkezY - viewH/2));

  ctx.scale(zoomOran, zoomOran);
  ctx.translate(-kameraX, -kameraY);

  ctx.fillStyle = '#0a0000';
  ctx.fillRect(0, 0, DUNYA_GENISLIK, DUNYA_YUKSEKLIK);

  ctx.strokeStyle = '#1a0505';
  ctx.lineWidth = 1 / zoomOran;
  for (let i = 0; i < DUNYA_GENISLIK; i += 60) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, DUNYA_YUKSEKLIK); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(DUNYA_GENISLIK, i); ctx.stroke();
  }

  // KOLEZYUM
  ctx.beginPath();
  ctx.arc(hedefMerkez.x, hedefMerkez.y, KOLEZYUM_YARICAP, 0, Math.PI * 2);
  ctx.strokeStyle = '#ffffff44';
  ctx.lineWidth = 3 / zoomOran;
  ctx.setLineDash([10, 10]);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#ffffff08';
  ctx.fill();

  ctx.fillStyle = '#ffffff44';
  ctx.font = '28px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('⚔️ KOLEZYUM ⚔️', hedefMerkez.x, hedefMerkez.y - KOLEZYUM_YARICAP - 20);

  // TAKIM KÖŞELERİ
  for (let i = 0; i < 4; i++) {
    ctx.beginPath();
    ctx.arc(TAKIM_KOSE[i].x, TAKIM_KOSE[i].y, 70, 0, Math.PI * 2);
    ctx.fillStyle = TAKIM_RENK_LISTESI[i] + '22';
    ctx.fill();
    ctx.strokeStyle = TAKIM_RENK_LISTESI[i];
    ctx.lineWidth = 3 / zoomOran;
    ctx.stroke();
    ctx.fillStyle = TAKIM_RENK_LISTESI[i];
    ctx.font = '20px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(TAKIM_ISIMLERI[i], TAKIM_KOSE[i].x, TAKIM_KOSE[i].y - 50);
    
    const koseEtiketleri = ['Sol Üst', 'Sağ Üst', 'Sol Alt', 'Sağ Alt'];
    ctx.fillStyle = '#ffffff66';
    ctx.font = '12px Arial';
    ctx.fillText(koseEtiketleri[i], TAKIM_KOSE[i].x, TAKIM_KOSE[i].y + 80);
  }

  // YEMLER
  for (let y of yemler) {
    ctx.shadowColor = y.renk;
    ctx.shadowBlur = 12 / zoomOran;
    ctx.fillStyle = y.renk;
    ctx.beginPath();
    ctx.arc(y.x, y.y, y.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath();
    ctx.arc(y.x - y.r*0.2, y.y - y.r*0.2, y.r*0.3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  // YILANLAR
  for (let y of tumYilanlar) {
    for (let i = 0; i < y.segmentler.length; i++) {
      const seg = y.segmentler[i];
      const radius = Math.max(seg.r, 2);
      const grad = ctx.createRadialGradient(
        seg.x - radius * 0.2, seg.y - radius * 0.3, radius * 0.1,
        seg.x, seg.y, radius
      );
      grad.addColorStop(0, '#ffffff88');
      grad.addColorStop(0.4, seg.renk);
      grad.addColorStop(1, seg.renk);
      ctx.fillStyle = grad;
      ctx.shadowColor = seg.renk;
      ctx.shadowBlur = i === 0 ? 20 / zoomOran : 5 / zoomOran;
      ctx.beginPath();
      ctx.arc(seg.x, seg.y, radius, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    const bas = y.segmentler[0];
    const gozR = Math.max(bas.r * 0.15, 2);
    const gozOffset = bas.r * 0.3;
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(bas.x + y.yon.x * gozOffset - y.yon.y * gozOffset * 0.5,
            bas.y + y.yon.y * gozOffset + y.yon.x * gozOffset * 0.5,
            gozR, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(bas.x + y.yon.x * gozOffset + y.yon.y * gozOffset * 0.5,
            bas.y + y.yon.y * gozOffset - y.yon.x * gozOffset * 0.5,
            gozR, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1a0000';
    const bebekR = Math.max(gozR * 0.5, 1);
    ctx.beginPath();
    ctx.arc(bas.x + y.yon.x * gozOffset * 1.3 - y.yon.y * gozOffset * 0.5,
            bas.y + y.yon.y * gozOffset * 1.3 + y.yon.x * gozOffset * 0.5,
            bebekR, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(bas.x + y.yon.x * gozOffset * 1.3 + y.yon.y * gozOffset * 0.5,
            bas.y + y.yon.y * gozOffset * 1.3 - y.yon.x * gozOffset * 0.5,
            bebekR, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = y.oyuncu ? '#ffe082' : '#ffffff';
    ctx.font = Math.max(8, bas.r * 0.4) + 'px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(y.isim || 'Bot', bas.x, bas.y + bas.r + 16);
  }

  ctx.restore();
}

function cizimYap() {
  if (oyunModu === 'takimAvi') {
    takimAviCizim();
    return;
  }

  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.scale(zoom, zoom);
  ctx.translate(-kamera.x, -kamera.y);

  ctx.fillStyle = '#0a0000';
  ctx.fillRect(0, 0, DUNYA_GENISLIK, DUNYA_YUKSEKLIK);
  ctx.strokeStyle = '#1a0505';
  ctx.lineWidth = 1 / zoom;
  for (let i = 0; i < DUNYA_GENISLIK; i += 80) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, DUNYA_YUKSEKLIK); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(DUNYA_GENISLIK, i); ctx.stroke();
  }
  ctx.strokeStyle = '#ff5252';
  ctx.lineWidth = 4 / zoom;
  ctx.strokeRect(0, 0, DUNYA_GENISLIK, DUNYA_YUKSEKLIK);

  for (let y of yemler) {
    ctx.shadowColor = y.renk;
    ctx.shadowBlur = 12 / zoom;
    ctx.fillStyle = y.renk;
    ctx.beginPath();
    ctx.arc(y.x, y.y, y.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath();
    ctx.arc(y.x - y.r*0.2, y.y - y.r*0.2, y.r*0.3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  for (let bot of botlar) {
    for (let i = 0; i < bot.segmentler.length; i++) {
      const seg = bot.segmentler[i];
      const radius = Math.max(seg.r, 2);
      const grad = ctx.createRadialGradient(seg.x - radius*0.2, seg.y - radius*0.3, radius*0.1, seg.x, seg.y, radius);
      if (bot.boostAktif) {
        grad.addColorStop(0, '#ffff88');
        grad.addColorStop(0.3, '#ffd740');
        grad.addColorStop(1, '#ffab00');
      } else {
        grad.addColorStop(0, '#ffffff88');
        grad.addColorStop(0.3, bot.renk);
        grad.addColorStop(1, bot.renk);
      }
      ctx.fillStyle = grad;
      ctx.shadowColor = bot.boostAktif ? '#ffd740' : bot.renk;
      ctx.shadowBlur = (i === 0 ? (bot.boostAktif ? 25 : 15) : 5) / zoom;
      ctx.beginPath();
      ctx.arc(seg.x, seg.y, radius, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    const botBas = bot.segmentler[0];
    const gozR = Math.max(botBas.r * 0.18, 2);
    const gozOffset = botBas.r * 0.35;
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(botBas.x + bot.yon.x * gozOffset - bot.yon.y * gozOffset * 0.5,
            botBas.y + bot.yon.y * gozOffset + bot.yon.x * gozOffset * 0.5,
            gozR, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(botBas.x + bot.yon.x * gozOffset + bot.yon.y * gozOffset * 0.5,
            botBas.y + bot.yon.y * gozOffset - bot.yon.x * gozOffset * 0.5,
            gozR, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1a0000';
    const bebekR = Math.max(gozR * 0.5, 1);
    ctx.beginPath();
    ctx.arc(botBas.x + bot.yon.x * gozOffset * 1.3 - bot.yon.y * gozOffset * 0.5,
            botBas.y + bot.yon.y * gozOffset * 1.3 + bot.yon.x * gozOffset * 0.5,
            bebekR, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(botBas.x + bot.yon.x * gozOffset * 1.3 + bot.yon.y * gozOffset * 0.5,
            botBas.y + bot.yon.y * gozOffset * 1.3 - bot.yon.x * gozOffset * 0.5,
            bebekR, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = bot.boostAktif ? '#ffd740' : 'white';
    ctx.font = Math.max(8, botBas.r * 0.4) + 'px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(bot.isim + (bot.boostAktif ? '⚡' : ''), botBas.x, botBas.y + botBas.r + 16);
  }

  for (let i = 0; i < yilan.length; i++) {
    const seg = yilan[i];
    const radius = Math.max(seg.r, 2);
    const grad = ctx.createRadialGradient(seg.x - radius*0.2, seg.y - radius*0.3, radius*0.1, seg.x, seg.y, radius);
    grad.addColorStop(0, '#ff8a65');
    grad.addColorStop(0.4, '#e64a19');
    grad.addColorStop(0.7, '#bf360c');
    grad.addColorStop(1, '#880e4f');
    ctx.fillStyle = grad;
    ctx.shadowColor = '#ff6d00';
    ctx.shadowBlur = (i === 0 ? 20 : 6) / zoom;
    ctx.beginPath();
    ctx.arc(seg.x, seg.y, radius, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
  const bas = yilan[0];
  if (bas) {
    const gozR = Math.max(bas.r * 0.14, 2);
    const gozOffset = bas.r * 0.3;
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(bas.x + yon.x * gozOffset - yon.y * gozOffset * 0.5,
            bas.y + yon.y * gozOffset + yon.x * gozOffset * 0.5,
            gozR, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(bas.x + yon.x * gozOffset + yon.y * gozOffset * 0.5,
            bas.y + yon.y * gozOffset - yon.x * gozOffset * 0.5,
            gozR, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1a0000';
    const bebekR = Math.max(gozR * 0.5, 1);
    ctx.beginPath();
    ctx.arc(bas.x + yon.x * gozOffset * 1.4 - yon.y * gozOffset * 0.5,
            bas.y + yon.y * gozOffset * 1.4 + yon.x * gozOffset * 0.5,
            bebekR, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(bas.x + yon.x * gozOffset * 1.4 + yon.y * gozOffset * 0.5,
            bas.y + yon.y * gozOffset * 1.4 - yon.x * gozOffset * 0.5,
            bebekR, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

baslatBtn.addEventListener('click', function() {
  if (oyunAktif && !oyunBittiMi) return;
  oyunuBaslat();
});

sifirlaBtn.addEventListener('click', function() {
  oyunAktif = false;
  oyunBittiMi = false;
  oyunDevamEdiyor = false;
  boostAktif = false;
  boostBasili = false;
  boostBtn.classList.remove('turbo');
  boostBtn.style.background = 'rgba(255,82,82,0.2)';
  boostBoyut.textContent = '-0%';
  skor = 12;
  skorGosterge.textContent = '12';
  tumYilanlar = [];
  yilan = [];
  botlar = [];
  yemler = [];
  oyuncuYilan = null;
  oyuncuOludu = false;
  oyuncuKolezyumda = false;
  takimSayac.innerHTML = '';
  siralamaKutusu.innerHTML = '';
  if (animasyonId) cancelAnimationFrame(animasyonId);
  durumMesaji.textContent = '🔄 Oyun sıfırlandı';
  baslatBtn.textContent = '▶ Başlat';
  baslatBtn.disabled = false;
  baslangicGorunumu();
});

function baslangicGorunumu() {
  if (oyunModu === 'hayattaKalma') {
    const ayarlar = ZORLUK_AYARLARI[zorluk];
    yilan = yilanOlustur(DUNYA_GENISLIK/2, DUNYA_YUKSEKLIK/2, 8, 1, 0, 12);
    yon = { x: 1, y: 0 };
    yemler = [];
    botlar = [];
    for (let i = 0; i < ayarlar.yemSayisi; i++) {
      yemler.push({ x: rastgele(20, DUNYA_GENISLIK-20), y: rastgele(20, DUNYA_YUKSEKLIK-20), r: 6, renk: YEM_RENKLERI[Math.floor(Math.random() * YEM_RENKLERI.length)] });
    }
    for (let i = 0; i < ayarlar.botSayisi; i++) botOlustur();
    skor = 12;
    skorGosterge.textContent = '12';
    siralamaGuncelle();
    cizimYap();
    durumMesaji.textContent = '▶️ ' + zorluk.charAt(0).toUpperCase() + zorluk.slice(1) + ' mod - Başlat\'a bas';
    baslatBtn.textContent = '▶ Başlat';
    baslatBtn.disabled = false;
    takimSayac.innerHTML = '';
  } else {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0a0000';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff5252';
    ctx.font = '24px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('⚔️ Takım Savaşı', W/2, H/2 - 20);
    ctx.fillStyle = '#888';
    ctx.font = '14px Arial';
    ctx.fillText('Başlat\'a bas', W/2, H/2 + 30);
    skorGosterge.textContent = '0';
    takimSayac.innerHTML = '';
    siralamaKutusu.innerHTML = '';
    durumMesaji.textContent = '▶️ Takım Avı - Başlat\'a bas';
    baslatBtn.textContent = '▶ Başlat';
    baslatBtn.disabled = false;
  }
}

baslangicGorunumu();
</script>
