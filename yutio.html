<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Yut.io - Oyun Merkezi</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0f0f0f;
            color: #f0f0f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .game-container {
            background: #1a1a1a;
            border-radius: 24px;
            padding: 30px 25px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            border: 1px solid #333;
            text-align: center;
        }
        h1 { font-size: 28px; margin-bottom: 5px; color: #f0f0f0; letter-spacing: 1px; }
        h1 span { color: #4fc3f7; }
        .score-area {
            font-size: 18px;
            background: #252525;
            padding: 12px 15px;
            border-radius: 40px;
            display: inline-block;
            margin: 10px auto 20px auto;
            border: 1px solid #3a3a3a;
            color: #bbb;
        }
        .score-area strong { color: #fff; font-size: 22px; }
        .game-card {
            background: #222;
            border-radius: 18px;
            padding: 20px 15px 25px 15px;
            border: 1px solid #333;
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
        }
        #oyunAlani {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1;
            background-color: #0a0a0a;
            border-radius: 14px;
            border: 2px solid #2a2a2a;
            touch-action: none;
            cursor: pointer;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
            gap: 15px;
            flex-wrap: wrap;
        }
        #joystickTaban {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background-color: #2a2a2a;
            border: 2px solid #444;
            position: relative;
            touch-action: none;
            flex-shrink: 0;
            margin: 0 auto;
        }
        #joystickTop {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #4fc3f7;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            box-shadow: 0 0 15px rgba(79, 195, 247, 0.3);
        }
        .hint-text { color: #777; font-size: 13px; background: #1e1e1e; padding: 8px 16px; border-radius: 30px; border: 1px solid #2c2c2c; }
        .status-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 5px;
        }
        #durumMesaji {
            font-size: 16px;
            color: #aaa;
            background: #1e1e1e;
            padding: 10px 18px;
            border-radius: 40px;
            border: 1px solid #2c2c2c;
            flex: 1;
            min-width: 140px;
        }
        .btn-group { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .btn {
            background: #2a2a2a;
            border: none;
            color: #f0f0f0;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #3a3a3a;
        }
        .btn-primary { background: #4fc3f7; color: #0f0f0f; border-color: #4fc3f7; }
        .btn-primary:hover { background: #81d4fa; transform: scale(1.02); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-secondary { background: #333; border-color: #555; }
        .btn-secondary:hover { background: #444; }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #888;
            text-decoration: none;
            font-size: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 3px;
        }
        .back-link:hover { color: #fff; border-color: #555; }
        #siralamaKutusu {
            background: #1a1a1a;
            border: 1px solid #2c2c2c;
            border-radius: 14px;
            padding: 12px 16px;
            margin-top: 16px;
            text-align: left;
            font-size: 14px;
            color: #ccc;
        }
        #siralamaKutusu .baslik { color: #888; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
        #siralamaKutusu .sira-satir { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid #252525; }
        #siralamaKutusu .ben { color: #4fc3f7; font-weight: bold; }
        #siralamaKutusu .sira-satir:last-child { border-bottom: none; }
        .footer-note { margin-top: 12px; font-size: 12px; color: #555; }
    </style>
</head>
<body>

<div class="game-container">
    <h1>🐍 <span>Yut</span>.io</h1>
    <div class="score-area">🎯 Boyut: <strong id="skorGosterge">10</strong></div>

    <div class="game-card">
        <canvas id="oyunAlani" width="600" height="600"></canvas>

        <div class="controls">
            <div id="joystickTaban">
                <div id="joystickTop"></div>
            </div>
            <div class="hint-text">👆 Sürükleyerek yön ver</div>
        </div>
    </div>

    <div class="status-area">
        <div id="durumMesaji">▶️ Oyunu başlat</div>
        <div class="btn-group">
            <button class="btn btn-primary" id="baslatBtn">▶ Başlat</button>
            <button class="btn btn-secondary" id="sifirlaBtn">🔄 Sıfırla</button>
        </div>
    </div>

    <div id="siralamaKutusu">
        <div class="baslik">🏆 Sıralama</div>
        <div id="siralamaListesi">
            <div class="sira-satir">Henüz skor yok.</div>
        </div>
    </div>

    <a href="index.html" class="back-link">← Ana sayfaya dön</a>
    <div class="footer-note">Büyüdükçe yavaşlarsın, dikkatli ol!</div>
</div>

<script>
    // --- BAŞLANGIÇ AYARLARI ---
    const canvas = document.getElementById('oyunAlani');
    const ctx = canvas.getContext('2d');
    const W = 600, H = 600;

    let oyunAktif = false;
    let oyunBitti = false;
    let skor = 0;
    let yilan = [];
    let yemler = [];
    let botlar = [];
    let yon = { x: 1, y: 0 };
    let kamera = { x: 0, y: 0 };
    let zoom = 1;

    const DUNYA_GENISLIK = 3000;
    const DUNYA_YUKSEKLIK = 3000;
    const BOT_SAYISI = 15;
    const YEM_SAYISI = 200;
    const RENKLER = ['#e53935', '#ffb300', '#43a047', '#8e24aa', '#fb8c00', '#00acc1', '#d81b60', '#6a1b9a'];

    const skorGosterge = document.getElementById('skorGosterge');
    const durumMesaji = document.getElementById('durumMesaji');
    const siralamaListesi = document.getElementById('siralamaListesi');
    const baslatBtn = document.getElementById('baslatBtn');
    const sifirlaBtn = document.getElementById('sifirlaBtn');

    const joyTaban = document.getElementById('joystickTaban');
    const joyTop = document.getElementById('joystickTop');
    let joyAktif = false;
    let joyVektor = { x: 0, y: 0 };
    let joyMerkez = { x: 0, y: 0 };
    const joyYaricap = 35;

    function rastgele(min, max) { return Math.random() * (max - min) + min; }

    function oyunuBaslat() {
        const oyuncuR = 12;
        yilan = [{ x: DUNYA_GENISLIK / 2, y: DUNYA_YUKSEKLIK / 2, r: oyuncuR }];
        yon = { x: 1, y: 0 };
        skor = oyuncuR;
        oyunBitti = false;
        oyunAktif = true;
        skorGosterge.textContent = Math.round(skor);
        durumMesaji.textContent = '🎮 Oyun başladı!';
        baslatBtn.textContent = '⏸ Oynanıyor...';
        baslatBtn.disabled = true;

        yemler = [];
        for (let i = 0; i < YEM_SAYISI; i++) {
            yemler.push({ x: rastgele(20, DUNYA_GENISLIK - 20), y: rastgele(20, DUNYA_YUKSEKLIK - 20), r: 4 });
        }

        botlar = [];
        for (let i = 0; i < BOT_SAYISI; i++) {
            botOlustur();
        }

        if (animasyonId) cancelAnimationFrame(animasyonId);
        oyunDongusu();
    }

    function botOlustur() {
        const botR = rastgele(8, 25);
        let x, y, deneme = 0;
        do {
            x = rastgele(botR + 10, DUNYA_GENISLIK - botR - 10);
            y = rastgele(botR + 10, DUNYA_YUKSEKLIK - botR - 10);
            deneme++;
        } while (deneme < 30 && Math.hypot(x - yilan[0].x, y - yilan[0].y) < 200);

        const bot = {
            segmentler: [{ x: x, y: y, r: botR }],
            yon: { x: rastgele(-1, 1), y: rastgele(-1, 1) },
            renk: RENKLER[Math.floor(Math.random() * RENKLER.length)],
            hedefX: rastgele(50, DUNYA_GENISLIK - 50),
            hedefY: rastgele(50, DUNYA_YUKSEKLIK - 50),
            yonDegistir: 0,
            skor: botR
        };
        botlar.push(bot);
    }

    function yemUret() {
        if (yemler.length < YEM_SAYISI) {
            yemler.push({ x: rastgele(20, DUNYA_GENISLIK - 20), y: rastgele(20, DUNYA_YUKSEKLIK - 20), r: 4 });
        }
    }

    function oyunuBitir(mesaj) {
        if (oyunBitti) return;
        oyunBitti = true;
        oyunAktif = false;
        durumMesaji.textContent = mesaj + ' Boyut: ' + Math.round(skor);
        baslatBtn.textContent = '▶ Tekrar Başlat';
        baslatBtn.disabled = false;
        siralamaGuncelle();
    }

    function siralamaGuncelle() {
        const tum = botlar.map(b => ({ r: b.skor, isim: 'Bot' }));
        tum.push({ r: skor, isim: 'Sen', ben: true });
        tum.sort((a, b) => b.r - a.r);
        const ilk5 = tum.slice(0, 5);
        let html = '';
        if (ilk5.length === 0) {
            html = '<div class="sira-satir">Henüz skor yok.</div>';
        } else {
            for (let i = 0; i < ilk5.length; i++) {
                const kisi = ilk5[i];
                const sinif = kisi.ben ? " ben" : "";
                html += `<div class="sira-satir${sinif}">
                    <span>${i+1}. ${kisi.isim}</span>
                    <span>${Math.round(kisi.r)}</span>
                </div>`;
            }
        }
        siralamaListesi.innerHTML = html;
    }

    function joyBasla(clientX, clientY) {
        joyAktif = true;
        const rect = joyTaban.getBoundingClientRect();
        joyMerkez = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
    }

    function joyHareket(clientX, clientY) {
        if (!joyAktif) return;
        let dx = clientX - joyMerkez.x;
        let dy = clientY - joyMerkez.y;
        const uzunluk = Math.hypot(dx, dy);
        if (uzunluk > joyYaricap) {
            dx = (dx / uzunluk) * joyYaricap;
            dy = (dy / uzunluk) * joyYaricap;
        }
        joyTop.style.left = `calc(50% + ${dx}px)`;
        joyTop.style.top = `calc(50% + ${dy}px)`;
        joyVektor = { x: dx / joyYaricap, y: dy / joyYaricap };
    }

    function joyBitir() {
        joyAktif = false;
        joyVektor = { x: 0, y: 0 };
        joyTop.style.left = '50%';
        joyTop.style.top = '50%';
    }

    joyTaban.addEventListener('touchstart', function(e) {
        e.preventDefault();
        const t = e.touches[0];
        joyBasla(t.clientX, t.clientY);
    }, { passive: false });

    joyTaban.addEventListener('touchmove', function(e) {
        e.preventDefault();
        const t = e.touches[0];
        joyHareket(t.clientX, t.clientY);
    }, { passive: false });

    joyTaban.addEventListener('touchend', function(e) {
        e.preventDefault();
        joyBitir();
    }, { passive: false });

    joyTaban.addEventListener('mousedown', function(e) {
        joyBasla(e.clientX, e.clientY);
    });

    document.addEventListener('mousemove', function(e) {
        if (joyAktif) joyHareket(e.clientX, e.clientY);
    });

    document.addEventListener('mouseup', function() {
        joyBitir();
    });

    document.addEventListener('keydown', function(e) {
        if (!oyunAktif || oyunBitti) return;
        const key = e.key;
        if (key === 'ArrowUp') { joyVektor = { x: 0, y: -1 }; e.preventDefault(); }
        else if (key === 'ArrowDown') { joyVektor = { x: 0, y: 1 }; e.preventDefault(); }
        else if (key === 'ArrowLeft') { joyVektor = { x: -1, y: 0 }; e.preventDefault(); }
        else if (key === 'ArrowRight') { joyVektor = { x: 1, y: 0 }; e.preventDefault(); }
    });

    document.addEventListener('keyup', function(e) {
        if (e.key.startsWith('Arrow')) {
            joyVektor = { x: 0, y: 0 };
        }
    });
        function oyunDongusu() {
        if (!oyunAktif || oyunBitti) {
            animasyonId = requestAnimationFrame(oyunDongusu);
            return;
        }

        if (joyVektor.x !== 0 || joyVektor.y !== 0) {
            const hiz = Math.max(1.5, 6 - skor * 0.02);
            yilan[0].x += joyVektor.x * hiz;
            yilan[0].y += joyVektor.y * hiz;
        }

        const bas = yilan[0];
        if (bas.x < bas.r || bas.x > DUNYA_GENISLIK - bas.r || bas.y < bas.r || bas.y > DUNYA_YUKSEKLIK - bas.r) {
            oyunuBitir('💀 Duvara çarptın!');
            return;
        }

        for (let i = yemler.length - 1; i >= 0; i--) {
            const y = yemler[i];
            if (Math.hypot(bas.x - y.x, bas.y - y.y) < bas.r + y.r) {
                skor += 0.5;
                bas.r += 0.3;
                yemler.splice(i, 1);
                yemUret();
            }
        }

        for (let bot of botlar) {
            const botBas = bot.segmentler[0];
            bot.yonDegistir++;
            if (bot.yonDegistir > 30 + rastgele(0, 30)) {
                let enYakinYem = null;
                let enYakinMesafe = Infinity;
                for (let y of yemler) {
                    const d = Math.hypot(botBas.x - y.x, botBas.y - y.y);
                    if (d < enYakinMesafe) {
                        enYakinMesafe = d;
                        enYakinYem = y;
                    }
                }
                if (enYakinYem && enYakinMesafe < 300) {
                    bot.hedefX = enYakinYem.x;
                    bot.hedefY = enYakinYem.y;
                } else {
                    bot.hedefX = rastgele(50, DUNYA_GENISLIK - 50);
                    bot.hedefY = rastgele(50, DUNYA_YUKSEKLIK - 50);
                }
                bot.yonDegistir = 0;
            }

            const dx = bot.hedefX - botBas.x;
            const dy = bot.hedefY - botBas.y;
            const mesafe = Math.hypot(dx, dy);
            if (mesafe > 5) {
                bot.yon.x = dx / mesafe;
                bot.yon.y = dy / mesafe;
            }

            const hiz = Math.max(0.8, 3.5 - bot.skor * 0.015);
            botBas.x += bot.yon.x * hiz;
            botBas.y += bot.yon.y * hiz;

            if (botBas.x < botBas.r || botBas.x > DUNYA_GENISLIK - botBas.r) bot.yon.x *= -1;
            if (botBas.y < botBas.r || botBas.y > DUNYA_YUKSEKLIK - botBas.r) bot.yon.y *= -1;
            botBas.x = Math.max(botBas.r, Math.min(DUNYA_GENISLIK - botBas.r, botBas.x));
            botBas.y = Math.max(botBas.r, Math.min(DUNYA_YUKSEKLIK - botBas.r, botBas.y));

            for (let i = yemler.length - 1; i >= 0; i--) {
                const y = yemler[i];
                if (Math.hypot(botBas.x - y.x, botBas.y - y.y) < botBas.r + y.r) {
                    bot.skor += 0.5;
                    botBas.r += 0.25;
                    yemler.splice(i, 1);
                    yemUret();
                }
            }
        }

        for (let bot of botlar) {
            const botBas = bot.segmentler[0];
            if (Math.hypot(bas.x - botBas.x, bas.y - botBas.y) < bas.r + botBas.r) {
                if (bas.r > botBas.r + 3) {
                    skor += bot.skor * 0.3;
                    bas.r += bot.skor * 0.1;
                    const index = botlar.indexOf(bot);
                    botlar.splice(index, 1);
                    botOlustur();
                } else if (botBas.r > bas.r + 3) {
                    oyunuBitir('💀 Bir bot yılan seni yedi!');
                    return;
                } else {
                    const index = botlar.indexOf(bot);
                    botlar.splice(index, 1);
                    botOlustur();
                    oyunuBitir('💀 Berabere!');
                    return;
                }
            }
        }

        while (botlar.length < BOT_SAYISI) {
            botOlustur();
        }

        skor = bas.r;
        skorGosterge.textContent = Math.round(skor);

        const viewW = W / zoom;
        const viewH = H / zoom;
        kamera.x = Math.max(0, Math.min(DUNYA_GENISLIK - viewW, bas.x - viewW / 2));
        kamera.y = Math.max(0, Math.min(DUNYA_YUKSEKLIK - viewH, bas.y - viewH / 2));
        zoom = Math.max(0.15, Math.min(0.8, 50 / skor));

        cizimYap();
        siralamaGuncelle();

        animasyonId = requestAnimationFrame(oyunDongusu);
    }

    function cizimYap() {
        ctx.clearRect(0, 0, W, H);
        ctx.save();
        ctx.scale(zoom, zoom);
        ctx.translate(-kamera.x, -kamera.y);

        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(0, 0, DUNYA_GENISLIK, DUNYA_YUKSEKLIK);

        ctx.strokeStyle = '#151515';
        ctx.lineWidth = 1 / zoom;
        for (let i = 0; i < DUNYA_GENISLIK; i += 50) {
            ctx.beginPath();
            ctx.moveTo(i, 0);
            ctx.lineTo(i, DUNYA_YUKSEKLIK);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, i);
            ctx.lineTo(DUNYA_GENISLIK, i);
            ctx.stroke();
        }

        ctx.strokeStyle = '#ff5252';
        ctx.lineWidth = 4 / zoom;
        ctx.strokeRect(0, 0, DUNYA_GENISLIK, DUNYA_YUKSEKLIK);

        ctx.shadowColor = '#4fc3f7';
        ctx.shadowBlur = 15 / zoom;
        ctx.fillStyle = '#ff5252';
        for (let y of yemler) {
            ctx.beginPath();
            ctx.arc(y.x, y.y, y.r, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.shadowBlur = 0;

        for (let bot of botlar) {
            const botBas = bot.segmentler[0];
            ctx.shadowColor = bot.renk;
            ctx.shadowBlur = 20 / zoom;
            ctx.fillStyle = bot.renk;
            ctx.beginPath();
            ctx.arc(botBas.x, botBas.y, botBas.r, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.fillStyle = 'white';
            const gozR = botBas.r * 0.15;
            ctx.beginPath();
            ctx.arc(botBas.x + bot.yon.x * botBas.r * 0.3 - bot.yon.y * botBas.r * 0.2, botBas.y + bot.yon.y * botBas.r * 0.3 + bot.yon.x * botBas.r * 0.2, gozR, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(botBas.x + bot.yon.x * botBas.r * 0.3 + bot.yon.y * botBas.r * 0.2, botBas.y + bot.yon.y * botBas.r * 0.3 - bot.yon.x * botBas.r * 0.2, gozR, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#1a1a1a';
            const gozBebek = gozR * 0.5;
            ctx.beginPath();
            ctx.arc(botBas.x + bot.yon.x * botBas.r * 0.4 - bot.yon.y * botBas.r * 0.2, botBas.y + bot.yon.y * botBas.r * 0.4 + bot.yon.x * botBas.r * 0.2, gozBebek, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(botBas.x + bot.yon.x * botBas.r * 0.4 + bot.yon.y * botBas.r * 0.2, botBas.y + bot.yon.y * botBas.r * 0.4 - bot.yon.x * botBas.r * 0.2, gozBebek, 0, Math.PI * 2);
            ctx.fill();
        }

        const bas = yilan[0];
        ctx.shadowColor = '#4fc3f7';
        ctx.shadowBlur = 30 / zoom;
        const grad = ctx.createRadialGradient(bas.x - bas.r*0.3, bas.y - bas.r*0.3, bas.r*0.1, bas.x, bas.y, bas.r);
        grad.addColorStop(0, '#fff6d5');
        grad.addColorStop(0.3, '#ffe082');
        grad.addColorStop(1, '#ffca28');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(bas.x, bas.y, bas.r, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.fillStyle = 'white';
        const gozR = bas.r * 0.12;
        ctx.beginPath();
        ctx.arc(bas.x + yon.x * bas.r * 0.35 - yon.y * bas.r * 0.25, bas.y + yon.y * bas.r * 0.35 + yon.x * bas.r * 0.25, gozR, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(bas.x + yon.x * bas.r * 0.35 + yon.y * bas.r * 0.25, bas.y + yon.y * bas.r * 0.35 - yon.x * bas.r * 0.25, gozR, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#3e2723';
        const gozBebek = gozR * 0.5;
        ctx.beginPath();
        ctx.arc(bas.x + yon.x * bas.r * 0.45 - yon.y * bas.r * 0.25, bas.y + yon.y * bas.r * 0.45 + yon.x * bas.r * 0.25, gozBebek, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(bas.x + yon.x * bas.r * 0.45 + yon.y * bas.r * 0.25, bas.y + yon.y * bas.r * 0.45 - yon.x * bas.r * 0.25, gozBebek, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    baslatBtn.addEventListener('click', function() {
        if (oyunAktif && !oyunBitti) return;
        oyunuBaslat();
    });

    sifirlaBtn.addEventListener('click', function() {
        oyunAktif = false;
        oyunBitti = false;
        skor = 12;
        skorGosterge.textContent = '12';
        durumMesaji.textContent = '🔄 Oyun sıfırlandı';
        baslatBtn.textContent = '▶ Başlat';
        baslatBtn.disabled = false;
        yilan = [{ x: DUNYA_GENISLIK / 2, y: DUNYA_YUKSEKLIK / 2, r: 12 }];
        yemler = [];
        botlar = [];
        for (let i = 0; i < YEM_SAYISI; i++) {
            yemler.push({ x: rastgele(20, DUNYA_GENISLIK - 20), y: rastgele(20, DUNYA_YUKSEKLIK - 20), r: 4 });
        }
        for (let i = 0; i < BOT_SAYISI; i++) {
            botOlustur();
        }
        siralamaGuncelle();
        cizimYap();
    });

    let animasyonId;

    function baslangic() {
        yilan = [{ x: DUNYA_GENISLIK / 2, y: DUNYA_YUKSEKLIK / 2, r: 12 }];
        yemler = [];
        botlar = [];
        for (let i = 0; i < YEM_SAYISI; i++) {
            yemler.push({ x: rastgele(20, DUNYA_GENISLIK - 20), y: rastgele(20, DUNYA_YUKSEKLIK - 20), r: 4 });
        }
        for (let i = 0; i < BOT_SAYISI; i++) {
            botOlustur();
        }
        skor = 12;
        skorGosterge.textContent = '12';
        siralamaGuncelle();
        cizimYap();
        durumMesaji.textContent = '▶️ Başlat\'a basarak oyuna başla';
    }

    baslangic();
</script>
