<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Yut.io - Takım Savaşı</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: linear-gradient(-45deg, #0a0a0a, #1a0a0a, #0a0a0a, #1a0505);
  background-size: 400% 400%;
  animation: gradientAkis 12s ease infinite;
  color: white;
  font-family: 'Segoe UI', Tahoma, sans-serif;
  text-align: center;
  padding: 20px 12px;
  min-height: 100vh;
}
@keyframes gradientAkis {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
h1 { color: #ff5252; font-size: 26px; margin-bottom: 6px; text-shadow: 0 0 20px #ff5252; }
h1 span { color: #fff; }
.skorAlani {
  font-size: 15px;
  background: rgba(0,0,0,0.5);
  padding: 8px 18px;
  border-radius: 30px;
  display: inline-block;
  margin-bottom: 14px;
  border: 1px solid #ff5252;
}
.skorAlani strong { color: #ff5252; font-size: 18px; }

#modSecim {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin: 10px 0;
  flex-wrap: wrap;
}
.modBtn {
  border: 2px solid #ff5252;
  background: rgba(0,0,0,0.3);
  color: #ff8a80;
  padding: 8px 20px;
  border-radius: 30px;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.3s;
}
.modBtn:hover { background: rgba(255,82,82,0.2); }
.modBtn.aktif {
  background: #ff5252;
  color: #2e0000;
  border-color: #ff5252;
  box-shadow: 0 0 20px rgba(255,82,82,0.3);
}

#oyunKapsayici {
  position: relative;
  width: 360px;
  max-width: 100%;
  height: 360px;
  margin: 0 auto;
  border: 3px solid #ff5252;
  border-radius: 14px;
  overflow: hidden;
  touch-action: none;
  background-color: #0a0000;
}
canvas { display: block; width: 100%; height: 100%; }

#siralamaKutusu {
  position: absolute;
  top: 8px;
  right: 8px;
  background-color: rgba(0,0,0,0.6);
  border: 1px solid #ff5252;
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 10px;
  text-align: left;
  z-index: 10;
  min-width: 100px;
}
#siralamaKutusu div { margin: 2px 0; white-space: nowrap; }
.takimSari { color: #ffd740; }
.takimKirmizi { color: #ff1744; }
.takimMavi { color: #448aff; }
.takimYesil { color: #69f0ae; }

#takimSayac {
  position: absolute;
  top: 8px;
  left: 8px;
  background-color: rgba(0,0,0,0.6);
  border: 1px solid #ff5252;
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 10px;
  text-align: left;
  z-index: 10;
  min-width: 80px;
}
#takimSayac div { margin: 1px 0; }

#joystickTaban {
  position: absolute;
  left: 14px;
  bottom: 14px;
  width: 78px;
  height: 78px;
  border-radius: 50%;
  background-color: rgba(255,255,255,0.08);
  border: 2px solid rgba(255,82,82,0.6);
  z-index: 10;
  touch-action: none;
}
#joystickTop {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background-color: #ff5252;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 15px rgba(255,82,82,0.5);
  pointer-events: none;
}

#durumMesaji {
  font-size: 15px;
  font-weight: 600;
  margin-top: 12px;
  min-height: 22px;
}
.btnGrup { display: flex; gap: 10px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
.btn {
  border: none;
  padding: 10px 22px;
  border-radius: 10px;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  font-family: inherit;
}
.btnPrimary { background-color: #ff5252; color: #2e0000; }
.btnPrimary:disabled { opacity: 0.5; }
.btnSecondary { background-color: rgba(255,255,255,0.1); color: #ff8a80; border: 1px solid #ff5252; }

.zorlukGrup {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-top: 8px;
  flex-wrap: wrap;
}
.zorlukBtn {
  border: 2px solid #ff5252;
  background: rgba(0,0,0,0.3);
  color: #ff8a80;
  padding: 6px 18px;
  border-radius: 20px;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.3s;
}
.zorlukBtn:hover { background: rgba(255,82,82,0.2); }
.zorlukBtn.aktif {
  background: #ff5252;
  color: #2e0000;
  border-color: #ff5252;
  box-shadow: 0 0 20px rgba(255,82,82,0.3);
}

.ipucu { font-size: 12px; opacity: 0.7; margin-top: 8px; }
a { color: #ff5252; display: inline-block; margin-top: 18px; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>

<h1>⚔️ <span>Takım</span> Savaşı</h1>
<div class="skorAlani">🏆 Kalan: <strong id="skorGosterge">0</strong></div>

<div id="oyunKapsayici">
  <canvas id="oyunAlani" width="360" height="360"></canvas>
  <div id="siralamaKutusu"></div>
  <div id="takimSayac"></div>
  <div id="joystickTaban"><div id="joystickTop"></div></div>
</div>

<p id="durumMesaji">▶️ Oyunu başlat</p>

<div id="modSecim">
  <button class="modBtn" data-mod="hayattaKalma">🏃 Hayatta Kal</button>
  <button class="modBtn aktif" data-mod="takimAvi">⚔️ Takım Avı</button>
</div>

<div class="zorlukGrup">
  <button class="zorlukBtn aktif" data-zorluk="kolay">🟢 Kolay</button>
  <button class="zorlukBtn" data-zorluk="orta">🟡 Orta</button>
  <button class="zorlukBtn" data-zorluk="zor">🔴 Zor</button>
</div>

<div class="btnGrup">
  <button class="btn btnPrimary" id="baslatBtn">▶ Başlat</button>
  <button class="btn btnSecondary" id="sifirlaBtn">🔄 Sıfırla</button>
</div>
<p class="ipucu">⚡ Takım savaşı! Kendi rengindekilerle birlikte diğer takımları yok et!</p>
<a href="index.html">⬅ Ana sayfaya dön</a>

<script>
  // ============================================================
// PART 2 - DEĞİŞKENLER, YARDIMCILAR VE MOD SEÇİMİ
// ============================================================

const canvas = document.getElementById('oyunAlani');
const ctx = canvas.getContext('2d');
const W = 360, H = 360;

let oyunAktif = false, oyunBittiMi = false, skor = 0;
let yilan = [], yemler = [], botlar = [];
let yon = { x: 1, y: 0 };
let kamera = { x: 0, y: 0 }, zoom = 1, animasyonId;

let boostAktif = false, boostBasili = false;
const BOOST_HIZ = 3.5, NORMAL_HIZ = 1;

let zorluk = 'kolay';
let oyunModu = 'takimAvi';

// TAKIM SİSTEMİ DEĞİŞKENLERİ
let tumYilanlar = [];
let takimSayilari = { sari: 0, kirmizi: 0, mavi: 0, yesil: 0 };
let kazananTakim = null;
let oyunSayaci = 0;

const TAKIM_RENKLERI = {
  sari: '#ffd740',
  kirmizi: '#ff1744',
  mavi: '#448aff',
  yesil: '#69f0ae'
};
const TAKIM_ISIMLERI = ['Sarı', 'Kırmızı', 'Mavi', 'Yeşil'];
const TAKIM_RENK_LISTESI = ['#ffd740', '#ff1744', '#448aff', '#69f0ae'];
const TAKIM_KOSE = [
  { x: 150, y: 150 },
  { x: 6000 - 150, y: 150 },
  { x: 150, y: 6000 - 150 },
  { x: 6000 - 150, y: 6000 - 150 }
];

// Dünya boyutları
const DUNYA_GENISLIK = 6000;
const DUNYA_YUKSEKLIK = 6000;

// Renkler ve isimler
const RENKLER = ['#e53935','#ffb300','#43a047','#8e24aa','#fb8c00','#00acc1','#d81b60','#6a1b9a','#ff6f00','#00838f','#ad1457','#1a237e'];
const YEM_RENKLERI = ['#ff5252','#ff8a80','#ffab40','#ffd740','#69f0ae','#40c4ff','#448aff','#b388ff','#ff80ab','#ff6e40'];
const BOT_ISIMLERI = ["Ahmet","Zeynep","Mehmet","Elif","Can","Ayşe","Emre","Deniz","Kerem","Su","Berk","Nil","Arda","Ece","Kaan","Mira","Efe","Lara","Mert","Selin","Bora","Aylin","Naz","Cem","Ela","Tan","Ada","Koray","Leyla","Demir","Alya","Ege","Nisa","Sara","Ali","Defne","Okan","Melis"];

// Zorluk ayarları
const ZORLUK_AYARLARI = {
  kolay: { botSayisi: 15, botHiz: 0.8, agresiflik: 0.4, botBoyutMax: 25, yemSayisi: 200, botBoostIhtimal: 0.1, takimBasi: 8, saldiriAraligi: 60 },
  orta: { botSayisi: 25, botHiz: 1.2, agresiflik: 0.6, botBoyutMax: 32, yemSayisi: 250, botBoostIhtimal: 0.2, takimBasi: 12, saldiriAraligi: 40 },
  zor: { botSayisi: 35, botHiz: 1.6, agresiflik: 0.8, botBoyutMax: 40, yemSayisi: 300, botBoostIhtimal: 0.3, takimBasi: 16, saldiriAraligi: 25 }
};

// DOM elementleri
const skorGosterge = document.getElementById('skorGosterge');
const durumMesaji = document.getElementById('durumMesaji');
const siralamaKutusu = document.getElementById('siralamaKutusu');
const takimSayac = document.getElementById('takimSayac');
const baslatBtn = document.getElementById('baslatBtn');
const sifirlaBtn = document.getElementById('sifirlaBtn');
const boostBtn = document.getElementById('boostBtn');
const boostBoyut = document.getElementById('boostBoyut');
const zorlukBtnleri = document.querySelectorAll('.zorlukBtn');
const modBtnleri = document.querySelectorAll('.modBtn');

// Joystick
const joyTaban = document.getElementById('joystickTaban');
const joyTop = document.getElementById('joystickTop');
let joyAktif = false, joyVektor = { x: 0, y: 0 }, joyMerkez = { x: 0, y: 0 };
const joyYaricap = 30;

// ============================================================
// YARDIMCI FONKSİYONLAR
// ============================================================

function rastgele(min, max) { return Math.random() * (max - min) + min; }

function mesafe(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function yilanOlustur(bx, by, uzunluk, yx, yy, r) {
  const y = [];
  const basR = r || 12;
  for (let i = 0; i < uzunluk; i++) {
    const oran = 1 - (i / Math.max(uzunluk, 1)) * 0.35;
    y.push({ x: bx - i * 9 * yx, y: by - i * 9 * yy, r: Math.max(basR * oran, 2) });
  }
  return y;
}

function yilanOlusturRenkli(bx, by, uzunluk, yx, yy, r, renk) {
  const y = [];
  const basR = r || 12;
  for (let i = 0; i < uzunluk; i++) {
    const oran = 1 - (i / Math.max(uzunluk, 1)) * 0.35;
    y.push({ 
      x: bx - i * 9 * yx, 
      y: by - i * 9 * yy, 
      r: Math.max(basR * oran, 2),
      renk: renk || '#ff5252'
    });
  }
  return y;
}

function takimRengiGetir(index) {
  const renkler = ['sari', 'kirmizi', 'mavi', 'yesil'];
  return renkler[index % 4];
}

function takimRenkKoduGetir(index) {
  return TAKIM_RENK_LISTESI[index % 4];
}

function yemOlustur(x, y, miktar) {
  const sayi = Math.min(Math.floor(miktar / 5) + 3, 15);
  for (let i = 0; i < sayi; i++) {
    yemler.push({
      x: Math.max(10, Math.min(DUNYA_GENISLIK - 10, x + rastgele(-40, 40))),
      y: Math.max(10, Math.min(DUNYA_YUKSEKLIK - 10, y + rastgele(-40, 40))),
      r: 6,
      renk: YEM_RENKLERI[Math.floor(Math.random() * YEM_RENKLERI.length)]
    });
  }
}

function yemUret() {
  const ayarlar = ZORLUK_AYARLARI[zorluk];
  if (yemler.length < ayarlar.yemSayisi) {
    yemler.push({
      x: rastgele(20, DUNYA_GENISLIK - 20),
      y: rastgele(20, DUNYA_YUKSEKLIK - 20),
      r: 6,
      renk: YEM_RENKLERI[Math.floor(Math.random() * YEM_RENKLERI.length)]
    });
  }
}

function botOlustur() {
  const ayarlar = ZORLUK_AYARLARI[zorluk];
  const botR = rastgele(10, ayarlar.botBoyutMax);
  const uzunluk = Math.floor(rastgele(4, 12));
  let x, y, deneme = 0;
  do {
    x = rastgele(botR + 10, DUNYA_GENISLIK - botR - 10);
    y = rastgele(botR + 10, DUNYA_YUKSEKLIK - botR - 10);
    deneme++;
  } while (deneme < 40 && yilan && yilan.length > 0 && Math.hypot(x - yilan[0].x, y - yilan[0].y) < 250);

  botlar.push({
    segmentler: yilanOlustur(x, y, uzunluk, 1, 0, botR),
    yon: { x: rastgele(-1, 1), y: rastgele(-1, 1) },
    renk: RENKLER[Math.floor(Math.random() * RENKLER.length)],
    isim: BOT_ISIMLERI[Math.floor(Math.random() * BOT_ISIMLERI.length)],
    hedefX: rastgele(50, DUNYA_GENISLIK - 50),
    hedefY: rastgele(50, DUNYA_YUKSEKLIK - 50),
    yonDegistir: 0,
    skor: botR,
    boostAktif: false,
    boostSuresi: 0
  });
}

// ============================================================
// ZORLUK SEÇİMİ
// ============================================================
zorlukBtnleri.forEach(btn => {
  btn.addEventListener('click', function() {
    zorlukBtnleri.forEach(b => b.classList.remove('aktif'));
    this.classList.add('aktif');
    zorluk = this.dataset.zorluk;
    durumMesaji.textContent = '🎯 Zorluk: ' + zorluk.charAt(0).toUpperCase() + zorluk.slice(1);
    if (!oyunAktif) baslangicGorunumu();
    else oyunuBaslat();
  });
});

// ============================================================
// MOD SEÇİMİ
// ============================================================
modBtnleri.forEach(function(btn) {
  btn.addEventListener('click', function() {
    modBtnleri.forEach(function(b) {
      b.classList.remove('aktif');
    });
    this.classList.add('aktif');
    oyunModu = this.dataset.mod;
    durumMesaji.textContent = '🎯 Mod: ' + (oyunModu === 'hayattaKalma' ? 'Hayatta Kal' : 'Takım Avı');
    if (!oyunAktif) {
      baslangicGorunumu();
    } else {
      oyunuBaslat();
    }
  });
});

// ============================================================
// SIRALAMA VE TAKIM SAYACI
// ============================================================
function siralamaGuncelle() {
  if (oyunModu === 'hayattaKalma') {
    const tum = botlar.map(b => ({ r: b.skor, isim: b.isim, ben: false }));
    tum.push({ r: skor, isim: 'Sen', ben: true });
    tum.sort((a, b) => b.r - a.r);
    const ilk5 = tum.slice(0, 5);
    let html = "<div style='opacity:0.7;margin-bottom:4px;'>🏆 Sıralama</div>";
    for (let i = 0; i < ilk5.length; i++) {
      const kisi = ilk5[i];
      const sinif = kisi.ben ? " class='ben'" : "";
      html += "<div" + sinif + ">" + (i+1) + ". " + kisi.isim + " (" + Math.round(kisi.r) + ")</div>";
    }
    siralamaKutusu.innerHTML = html;
  } else {
    // Takım avı sıralaması
    const list = [];
    for (let y of tumYilanlar) {
      const bas = y.segmentler[0];
      list.push({
        isim: y.isim || 'Bot',
        skor: Math.round(y.skor || 10),
        takim: y.takim || 'sari',
        renk: y.renk || '#ffd740'
      });
    }
    list.sort((a, b) => b.skor - a.skor);
    const ilk5 = list.slice(0, 5);
    let html = "<div style='opacity:0.7;margin-bottom:4px;'>🏆 Sıralama</div>";
    for (let i = 0; i < ilk5.length; i++) {
      const k = ilk5[i];
      const cls = 'takim' + k.takim.charAt(0).toUpperCase() + k.takim.slice(1);
      html += "<div class='" + cls + "'>" + (i+1) + ". " + k.isim + " (" + k.skor + ")</div>";
    }
    siralamaKutusu.innerHTML = html;
  }
}

function takimSayacGuncelle() {
  if (oyunModu !== 'takimAvi') return;
  const sayac = { sari: 0, kirmizi: 0, mavi: 0, yesil: 0 };
  for (let y of tumYilanlar) {
    if (y.takim === 'sari') sayac.sari++;
    else if (y.takim === 'kirmizi') sayac.kirmizi++;
    else if (y.takim === 'mavi') sayac.mavi++;
    else if (y.takim === 'yesil') sayac.yesil++;
  }
  takimSayilari = sayac;
  const toplam = sayac.sari + sayac.kirmizi + sayac.mavi + sayac.yesil;
  skorGosterge.textContent = toplam;
  
  let html = '';
  html += '<div style="color:#ffd740;">🟡 ' + sayac.sari + '</div>';
  html += '<div style="color:#ff1744;">🔴 ' + sayac.kirmizi + '</div>';
  html += '<div style="color:#448aff;">🔵 ' + sayac.mavi + '</div>';
  html += '<div style="color:#69f0ae;">🟢 ' + sayac.yesil + '</div>';
  takimSayac.innerHTML = html;
}

function oyunuBitir(mesaj) {
  if (oyunBittiMi) return;
  oyunBittiMi = true;
  oyunAktif = false;
  boostAktif = false;
  boostBasili = false;
  boostBtn.classList.remove('turbo');
  boostBtn.style.background = 'rgba(255,82,82,0.2)';
  durumMesaji.textContent = mesaj;
  baslatBtn.textContent = '▶ Tekrar Başlat';
  baslatBtn.disabled = false;
  siralamaGuncelle();
  }
  // ============================================================
// PART 3 - OYUN DÖNGÜSÜ, KONTROLLER, ÇİZİM VE BAŞLATMA
// ============================================================

// ---- JOYSTICK ----
function joyBasla(cx, cy) {
  joyAktif = true;
  const rect = joyTaban.getBoundingClientRect();
  joyMerkez = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
}
function joyHareket(cx, cy) {
  if (!joyAktif) return;
  let dx = cx - joyMerkez.x, dy = cy - joyMerkez.y;
  const len = Math.hypot(dx, dy);
  if (len > joyYaricap) { dx = (dx/len)*joyYaricap; dy = (dy/len)*joyYaricap; }
  joyTop.style.left = "calc(50% + " + dx + "px)";
  joyTop.style.top = "calc(50% + " + dy + "px)";
  joyVektor = { x: dx/joyYaricap, y: dy/joyYaricap };
}
function joyBitir() {
  joyAktif = false;
  joyVektor = { x: 0, y: 0 };
  joyTop.style.left = '50%';
  joyTop.style.top = '50%';
}
joyTaban.addEventListener('touchstart', e => { e.preventDefault(); joyBasla(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
joyTaban.addEventListener('touchmove', e => { e.preventDefault(); joyHareket(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
joyTaban.addEventListener('touchend', e => { e.preventDefault(); joyBitir(); }, {passive:false});
joyTaban.addEventListener('mousedown', e => joyBasla(e.clientX, e.clientY));
document.addEventListener('mousemove', e => { if(joyAktif) joyHareket(e.clientX, e.clientY); });
document.addEventListener('mouseup', joyBitir);

// ---- BOOST ----
function boostBasla() {
  if (!oyunAktif || oyunBittiMi || oyunModu !== 'hayattaKalma') return;
  boostBasili = true;
  boostAktif = true;
  boostBtn.classList.add('turbo');
  boostBtn.style.background = '#ff1744';
}
function boostBitir() {
  boostBasili = false;
  boostAktif = false;
  boostBtn.classList.remove('turbo');
  boostBtn.style.background = 'rgba(255,82,82,0.2)';
}
boostBtn.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); boostBasla(); }, {passive:false});
boostBtn.addEventListener('touchend', e => { e.preventDefault(); e.stopPropagation(); boostBitir(); }, {passive:false});
boostBtn.addEventListener('touchcancel', e => { e.preventDefault(); boostBitir(); }, {passive:false});
boostBtn.addEventListener('mousedown', e => { e.stopPropagation(); boostBasla(); });
boostBtn.addEventListener('mouseup', e => { e.stopPropagation(); boostBitir(); });
boostBtn.addEventListener('mouseleave', e => { if(boostBasili) boostBitir(); });

// ---- KLAVYE ----
document.addEventListener('keydown', e => {
  if (!oyunAktif || oyunBittiMi) return;
  if ((e.key === 'z' || e.key === 'Z') && oyunModu === 'hayattaKalma') { 
    e.preventDefault(); boostBasla(); return; 
  }
  if (e.key === 'ArrowUp') { joyVektor = {x:0, y:-1}; e.preventDefault(); }
  else if (e.key === 'ArrowDown') { joyVektor = {x:0, y:1}; e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { joyVektor = {x:-1, y:0}; e.preventDefault(); }
  else if (e.key === 'ArrowRight') { joyVektor = {x:1, y:0}; e.preventDefault(); }
});
document.addEventListener('keyup', e => {
  if ((e.key === 'z' || e.key === 'Z') && oyunModu === 'hayattaKalma') { 
    e.preventDefault(); boostBitir(); 
  }
  if (e.key.indexOf('Arrow') === 0) joyVektor = {x:0, y:0};
});

// ============================================================
// HAYATTA KALMA MODU
// ============================================================
function hayattaKalmaBaslat() {
  const ayarlar = ZORLUK_AYARLARI[zorluk];
  const oyuncuR = 12;
  yilan = yilanOlustur(DUNYA_GENISLIK/2, DUNYA_YUKSEKLIK/2, 8, 1, 0, oyuncuR);
  yon = { x: 1, y: 0 };
  skor = oyuncuR;
  oyunBittiMi = false;
  oyunAktif = true;
  boostAktif = false;
  boostBasili = false;
  boostBtn.classList.remove('turbo');
  boostBtn.style.background = 'rgba(255,82,82,0.2)';
  boostBoyut.textContent = '-0%';
  skorGosterge.textContent = Math.round(skor);
  durumMesaji.textContent = '🎮 ' + zorluk.charAt(0).toUpperCase() + zorluk.slice(1) + ' mod başladı!';
  baslatBtn.textContent = '⏸ Oynanıyor...';
  baslatBtn.disabled = true;

  yemler = [];
  for (let i = 0; i < ayarlar.yemSayisi; i++) {
    yemler.push({ x: rastgele(20, DUNYA_GENISLIK-20), y: rastgele(20, DUNYA_YUKSEKLIK-20), r: 6, renk: YEM_RENKLERI[Math.floor(Math.random() * YEM_RENKLERI.length)] });
  }
  botlar = [];
  for (let i = 0; i < ayarlar.botSayisi; i++) botOlustur();
  if (animasyonId) cancelAnimationFrame(animasyonId);
  hayattaKalmaDongusu();
}

function hayattaKalmaDongusu() {
  if (!oyunAktif || oyunBittiMi) { 
    animasyonId = requestAnimationFrame(hayattaKalmaDongusu); 
    return; 
  }

  const ayarlar = ZORLUK_AYARLARI[zorluk];
  let hizCarpani = NORMAL_HIZ;

  // Oyuncu boost
  if (boostAktif) {
    hizCarpani = BOOST_HIZ;
    if (yilan[0].r > 6) {
      yilan[0].r -= 0.06;
      skor = yilan[0].r;
      boostBoyut.textContent = '-' + Math.round(((12 - yilan[0].r)/12*100)) + '%';
    } else { boostBitir(); boostBoyut.textContent = '-0%'; }
  } else boostBoyut.textContent = '-0%';

  // Oyuncu hareketi
  if (joyVektor.x !== 0 || joyVektor.y !== 0) {
    const boyutCarpani = 1 + (skor - 12) * 0.015;
    const tabanHiz = Math.max(1.5, 4 + skor * 0.02);
    const hiz = tabanHiz * hizCarpani * boyutCarpani;
    yilan[0].x += joyVektor.x * hiz;
    yilan[0].y += joyVektor.y * hiz;
  }

  // Yılan segmentleri
  for (let i = yilan.length - 1; i > 0; i--) {
    const dx = yilan[i-1].x - yilan[i].x, dy = yilan[i-1].y - yilan[i].y;
    const m = Math.hypot(dx, dy);
    if (m > 1) { yilan[i].x += dx * 0.5; yilan[i].y += dy * 0.5; }
    else { yilan[i].x = yilan[i-1].x; yilan[i].y = yilan[i-1].y; }
    if (yilan[i-1]) {
      const oran = 1 - (i / yilan.length) * 0.35;
      yilan[i].r = Math.max(yilan[0].r * oran, 2);
    }
  }

  const bas = yilan[0];
  // Duvar
  if (bas.x < bas.r || bas.x > DUNYA_GENISLIK - bas.r || bas.y < bas.r || bas.y > DUNYA_YUKSEKLIK - bas.r) {
    oyunuBitir('💀 Duvara çarptın!');
    return;
  }

  // Yem yeme
  for (let i = yemler.length - 1; i >= 0; i--) {
    const y = yemler[i];
    if (Math.hypot(bas.x - y.x, bas.y - y.y) < bas.r + y.r) {
      skor += 0.5;
      bas.r += 0.3;
      const son = yilan[yilan.length - 1];
      yilan.push({ x: son.x, y: son.y, r: Math.max(bas.r * 0.65, 2) });
      yemler.splice(i, 1);
      yemUret();
    }
  }

  // Botlar
  for (let i = 0; i < botlar.length; i++) {
    const bot = botlar[i];
    const botBas = bot.segmentler[0];
    bot.yonDegistir++;

    // Bot boost
    if (Math.random() < ayarlar.botBoostIhtimal * 0.02 && bot.skor > 15) {
      bot.boostAktif = true;
      bot.boostSuresi = 40 + Math.floor(rastgele(0, 30));
    }
    if (bot.boostAktif) {
      bot.boostSuresi--;
      if (bot.boostSuresi <= 0) bot.boostAktif = false;
      if (bot.skor > 6) { bot.skor -= 0.03; botBas.r -= 0.03; }
    }

    if (bot.yonDegistir > 30 + rastgele(0, 30)) {
      let hedefX, hedefY;
      const rastgeleSecim = Math.random();
      const oyuncuHedefIhtimal = ayarlar.agresiflik + (bot.boostAktif ? 0.2 : 0);
      if (rastgeleSecim < oyuncuHedefIhtimal && bot.skor > skor * 0.5) {
        hedefX = bas.x + rastgele(-60, 60);
        hedefY = bas.y + rastgele(-60, 60);
      } else if (rastgeleSecim < oyuncuHedefIhtimal + 0.15 && skor > bot.skor * 1.1) {
        hedefX = botBas.x + (botBas.x - bas.x) * 4 + rastgele(-60, 60);
        hedefY = botBas.y + (botBas.y - bas.y) * 4 + rastgele(-60, 60);
      } else {
        let enYakinYem = null, enYakinMesafe = Infinity;
        for (let j = 0; j < yemler.length; j++) {
          const y = yemler[j];
          const d = Math.hypot(botBas.x - y.x, botBas.y - y.y);
          if (d < enYakinMesafe) { enYakinMesafe = d; enYakinYem = y; }
        }
        if (enYakinYem && enYakinMesafe < 500) {
          hedefX = enYakinYem.x + rastgele(-30, 30);
          hedefY = enYakinYem.y + rastgele(-30, 30);
        } else {
          hedefX = rastgele(50, DUNYA_GENISLIK - 50);
          hedefY = rastgele(50, DUNYA_YUKSEKLIK - 50);
        }
      }
      bot.hedefX = Math.max(10, Math.min(DUNYA_GENISLIK - 10, hedefX));
      bot.hedefY = Math.max(10, Math.min(DUNYA_YUKSEKLIK - 10, hedefY));
      bot.yonDegistir = 0;
    }

    const dx = bot.hedefX - botBas.x, dy = bot.hedefY - botBas.y;
    const mesafe = Math.hypot(dx, dy);
    if (mesafe > 5) { bot.yon.x = dx/mesafe; bot.yon.y = dy/mesafe; }

    const botHizCarpani = bot.boostAktif ? 2.5 : 1;
    const boyutCarpani = 1 + (bot.skor - 12) * 0.015;
    const hiz = Math.max(1.0, (3.5 + ayarlar.botHiz) - bot.skor * 0.005) * botHizCarpani * boyutCarpani;
    botBas.x += bot.yon.x * hiz;
    botBas.y += bot.yon.y * hiz;

    // Bot segmentleri
    for (let j = bot.segmentler.length - 1; j > 0; j--) {
      const dx2 = bot.segmentler[j-1].x - bot.segmentler[j].x, dy2 = bot.segmentler[j-1].y - bot.segmentler[j].y;
      const m2 = Math.hypot(dx2, dy2);
      if (m2 > 1) { bot.segmentler[j].x += dx2 * 0.5; bot.segmentler[j].y += dy2 * 0.5; }
      else { bot.segmentler[j].x = bot.segmentler[j-1].x; bot.segmentler[j].y = bot.segmentler[j-1].y; }
      if (bot.segmentler[j-1]) {
        const oran = 1 - (j / bot.segmentler.length) * 0.35;
        bot.segmentler[j].r = Math.max(bot.segmentler[0].r * oran, 2);
      }
    }

    // Bot sınır
    if (botBas.x < botBas.r || botBas.x > DUNYA_GENISLIK - botBas.r) bot.yon.x *= -1;
    if (botBas.y < botBas.r || botBas.y > DUNYA_YUKSEKLIK - botBas.y) bot.yon.y *= -1;
    botBas.x = Math.max(botBas.r, Math.min(DUNYA_GENISLIK - botBas.r, botBas.x));
    botBas.y = Math.max(botBas.r, Math.min(DUNYA_YUKSEKLIK - botBas.r, botBas.y));

    // Bot yem yeme
    for (let j = yemler.length - 1; j >= 0; j--) {
      const y = yemler[j];
      if (Math.hypot(botBas.x - y.x, botBas.y - y.y) < botBas.r + y.r) {
        bot.skor += 0.5;
        botBas.r += 0.25;
        const son = bot.segmentler[bot.segmentler.length - 1];
        bot.segmentler.push({ x: son.x, y: son.y, r: Math.max(botBas.r * 0.65, 2) });
        yemler.splice(j, 1);
        yemUret();
      }
    }
  }

  // Bot-bot çarpışma
  const silinecekBotlar = new Set();
  for (let i = 0; i < botlar.length; i++) {
    if (silinecekBotlar.has(i)) continue;
    for (let j = i+1; j < botlar.length; j++) {
      if (silinecekBotlar.has(j)) continue;
      const b1 = botlar[i], b2 = botlar[j];
      const b1b = b1.segmentler[0], b2b = b2.segmentler[0];
      if (Math.hypot(b1b.x - b2b.x, b1b.y - b2b.y) < b1b.r + b2b.r) {
        if (b1.skor > b2.skor + 2) {
          b1.skor += b2.skor * 0.25; b1b.r += b2.skor * 0.06;
          yemOlustur(b2b.x, b2b.y, b2.skor * 0.3);
          silinecekBotlar.add(j);
        } else if (b2.skor > b1.skor + 2) {
          b2.skor += b1.skor * 0.25; b2b.r += b1.skor * 0.06;
          yemOlustur(b1b.x, b1b.y, b1.skor * 0.3);
          silinecekBotlar.add(i);
        }
      }
    }
  }
  Array.from(silinecekBotlar).sort((a,b)=>b-a).forEach(idx => { botlar.splice(idx,1); botOlustur(); });

  // Oyuncu-bot çarpışma
  for (let i = botlar.length - 1; i >= 0; i--) {
    const bot = botlar[i];
    const botBas = bot.segmentler[0];
    if (Math.hypot(bas.x - botBas.x, bas.y - botBas.y) < bas.r + botBas.r) {
      if (bas.r > botBas.r + 3) {
        skor += bot.skor * 0.3; bas.r += bot.skor * 0.1;
        yemOlustur(botBas.x, botBas.y, bot.skor * 0.4);
        botlar.splice(i, 1); botOlustur();
        continue;
      } else if (botBas.r > bas.r + 3) {
        oyunuBitir('💀 ' + bot.isim + ' seni yedi!');
        return;
      } else {
        yemOlustur(botBas.x, botBas.y, bot.skor * 0.3);
        botlar.splice(i, 1); botOlustur();
        oyunuBitir('💀 Berabere!');
        return;
      }
    }
    // Bot oyuncu gövdesine çarparsa
    for (let j = 1; j < yilan.length; j++) {
      const seg = yilan[j];
      if (Math.hypot(botBas.x - seg.x, botBas.y - seg.y) < botBas.r + seg.r) {
        skor += bot.skor * 0.2; bas.r += bot.skor * 0.05;
        yemOlustur(botBas.x, botBas.y, bot.skor * 0.3);
        botlar.splice(i, 1); botOlustur();
        break;
      }
    }
    // Oyuncu bot gövdesine çarparsa
    for (let j = 1; j < bot.segmentler.length; j++) {
      const seg = bot.segmentler[j];
      if (Math.hypot(bas.x - seg.x, bas.y - seg.y) < bas.r + seg.r) {
        oyunuBitir('💀 ' + bot.isim + '\'in gövdesine çarptın!');
        return;
      }
    }
  }

  while (botlar.length < ayarlar.botSayisi) botOlustur();

  skor = bas.r;
  skorGosterge.textContent = Math.round(skor);

  // Kamera & zoom
  let toplamX = 0, toplamY = 0;
  for (let i = 0; i < yilan.length; i++) { toplamX += yilan[i].x; toplamY += yilan[i].y; }
  const merkezX = toplamX / yilan.length;
  const merkezY = toplamY / yilan.length;
  let maxR = 0;
  for (let i = 0; i < yilan.length; i++) {
    const m = Math.hypot(yilan[i].x - merkezX, yilan[i].y - merkezY);
    if (m + yilan[i].r > maxR) maxR = m + yilan[i].r;
  }
  const idealZoom = Math.max(0.06, Math.min(0.9, (W * 0.4) / (maxR * 1.8)));
  zoom += (idealZoom - zoom) * 0.06;
  const viewW = W / zoom, viewH = H / zoom;
  kamera.x = Math.max(0, Math.min(DUNYA_GENISLIK - viewW, merkezX - viewW/2));
  kamera.y = Math.max(0, Math.min(DUNYA_YUKSEKLIK - viewH, merkezY - viewH/2));

  cizimYap();
  siralamaGuncelle();
  animasyonId = requestAnimationFrame(hayattaKalmaDongusu);
}

function takimAviBaslat() {
  const ayarlar = ZORLUK_AYARLARI[zorluk];
  const takimBasi = ayarlar.takimBasi;
  
  tumYilanlar = [];
  kazananTakim = null;
  oyunBittiMi = false;
  oyunAktif = true;
  oyunSayaci = 0;
  
  // Her takımdan belirtilen sayıda yılan oluştur
  for (let i = 0; i < 4; i++) {
    const renkAdi = takimRengiGetir(i);
    const renkKodu = takimRenkKoduGetir(i);
    const kose = TAKIM_KOSE[i];
    
    for (let j = 0; j < takimBasi; j++) {
      const r = rastgele(10, 20);
      const uzunluk = Math.floor(rastgele(5, 10));
      const yonX = rastgele(-1, 1) || 1;
      const yonY = rastgele(-1, 1) || 1;
      const x = kose.x + rastgele(-200, 200);
      const y = kose.y + rastgele(-200, 200);
      
      tumYilanlar.push({
        segmentler: yilanOlusturRenkli(x, y, uzunluk, yonX, yonY, r, renkKodu),
        takim: renkAdi,
        takimIndex: i,
        renk: renkKodu,
        skor: r,
        yon: { x: rastgele(-1, 1) || 1, y: rastgele(-1, 1) || 1 },
        hedefX: rastgele(50, DUNYA_GENISLIK - 50),
        hedefY: rastgele(50, DUNYA_YUKSEKLIK - 50),
        yonDegistir: 0,
        isim: BOT_ISIMLERI[Math.floor(Math.random() * BOT_ISIMLERI.length)] || 'Bot'
      });
    }
  }
  
  durumMesaji.textContent = '⚔️ Takım savaşı başladı! ' + (takimBasi * 4) + ' yılan savaşıyor!';
  baslatBtn.textContent = '⏸ Oynanıyor...';
  baslatBtn.disabled = true;
  
  takimSayacGuncelle();
  siralamaGuncelle();
  boostBtn.style.display = 'none';
  
  if (animasyonId) cancelAnimationFrame(animasyonId);
  takimAviDongusu();
}

function takimAviDongusu() {
  if (!oyunAktif || oyunBittiMi) {
    animasyonId = requestAnimationFrame(takimAviDongusu);
    return;
  }
  
  oyunSayaci++;
  const ayarlar = ZORLUK_AYARLARI[zorluk];
  const hiz = ayarlar.botHiz;
  const saldiriAraligi = ayarlar.saldiriAraligi;
  
  // Her yılanı güncelle
  for (let i = 0; i < tumYilanlar.length; i++) {
    const y = tumYilanlar[i];
    const bas = y.segmentler[0];
    
    // Hedef belirleme - düşman takımları hedef al
    y.yonDegistir++;
    if (y.yonDegistir > saldiriAraligi + rastgele(0, 30)) {
      // En yakın düşmanı bul
      let enYakin = null;
      let enYakinMesafe = Infinity;
      
      for (let j = 0; j < tumYilanlar.length; j++) {
        if (i === j) continue;
        const other = tumYilanlar[j];
        if (other.takim === y.takim) continue;
        const otherBas = other.segmentler[0];
        const d = mesafe(bas, otherBas);
        if (d < enYakinMesafe && d < 800) {
          enYakinMesafe = d;
          enYakin = other;
        }
      }
      
      if (enYakin) {
        const hedef = enYakin.segmentler[0];
        y.hedefX = hedef.x + rastgele(-50, 50);
        y.hedefY = hedef.y + rastgele(-50, 50);
      } else {
        y.hedefX = rastgele(50, DUNYA_GENISLIK - 50);
        y.hedefY = rastgele(50, DUNYA_YUKSEKLIK - 50);
      }
      y.yonDegistir = 0;
    }
    
    // Hedefe doğru hareket
    const dx = y.hedefX - bas.x;
    const dy = y.hedefY - bas.y;
    const m = Math.hypot(dx, dy);
    if (m > 5) {
      y.yon.x = dx / m;
      y.yon.y = dy / m;
    }
    
    const hareketHiz = Math.max(0.8, hiz + (y.skor * 0.01));
    bas.x += y.yon.x * hareketHiz;
    bas.y += y.yon.y * hareketHiz;
    
    // Sınır kontrolü
    if (bas.x < bas.r || bas.x > DUNYA_GENISLIK - bas.r) y.yon.x *= -1;
    if (bas.y < bas.r || bas.y > DUNYA_YUKSEKLIK - bas.y) y.yon.y *= -1;
    bas.x = Math.max(bas.r, Math.min(DUNYA_GENISLIK - bas.r, bas.x));
    bas.y = Math.max(bas.r, Math.min(DUNYA_YUKSEKLIK - bas.r, bas.y));
    
    // Segmentleri güncelle
    for (let j = y.segmentler.length - 1; j > 0; j--) {
      const dx2 = y.segmentler[j-1].x - y.segmentler[j].x;
      const dy2 = y.segmentler[j-1].y - y.segmentler[j].y;
      const m2 = Math.hypot(dx2, dy2);
      if (m2 > 1) {
        y.segmentler[j].x += dx2 * 0.5;
        y.segmentler[j].y += dy2 * 0.5;
      } else {
        y.segmentler[j].x = y.segmentler[j-1].x;
        y.segmentler[j].y = y.segmentler[j-1].y;
      }
      if (y.segmentler[j-1]) {
        const oran = 1 - (j / y.segmentler.length) * 0.35;
        y.segmentler[j].r = Math.max(y.segmentler[0].r * oran, 2);
      }
    }
  }
  
  // Çarpışma kontrolü (farklı takımlar)
  const silinecekler = new Set();
  for (let i = 0; i < tumYilanlar.length; i++) {
    if (silinecekler.has(i)) continue;
    const y1 = tumYilanlar[i];
    const bas1 = y1.segmentler[0];
    
    for (let j = i + 1; j < tumYilanlar.length; j++) {
      if (silinecekler.has(j)) continue;
      const y2 = tumYilanlar[j];
      if (y1.takim === y2.takim) continue;
      
      const bas2 = y2.segmentler[0];
      if (mesafe(bas1, bas2) < bas1.r + bas2.r) {
        if (y1.skor > y2.skor + 3) {
          silinecekler.add(j);
          y1.skor += y2.skor * 0.2;
          bas1.r += y2.skor * 0.05;
        } else if (y2.skor > y1.skor + 3) {
          silinecekler.add(i);
          y2.skor += y1.skor * 0.2;
          bas2.r += y1.skor * 0.05;
          break;
        } else {
          silinecekler.add(i);
          silinecekler.add(j);
          break;
        }
      }
    }
  }
  
  // Ölenleri kaldır
  if (silinecekler.size > 0) {
    const sorted = Array.from(silinecekler).sort((a, b) => b - a);
    for (let idx of sorted) {
      tumYilanlar.splice(idx, 1);
    }
  }
  
  // Kazanan kontrol et
  const kalanTakimlar = new Set();
  for (let y of tumYilanlar) {
    kalanTakimlar.add(y.takim);
  }
  
  if (kalanTakimlar.size <= 1 && tumYilanlar.length > 0) {
    const kazanan = tumYilanlar[0].takim;
    const renkMap = {
      sari: '🟡 Sarı',
      kirmizi: '🔴 Kırmızı',
      mavi: '🔵 Mavi',
      yesil: '🟢 Yeşil'
    };
    oyunuBitir('🏆 ' + renkMap[kazanan] + ' takım kazandı! Kalan: ' + tumYilanlar.length);
    boostBtn.style.display = 'flex';
    return;
  }
  
  if (tumYilanlar.length <= 1) {
    oyunuBitir('💀 Savaş bitti!');
    boostBtn.style.display = 'flex';
    return;
  }
  
  // Güncelle
  takimSayacGuncelle();
  siralamaGuncelle();
  takimAviCizim();
  
  animasyonId = requestAnimationFrame(takimAviDongusu);
}

// TAKIM AVI ÇİZİM
// ============================================================

function takimAviCizim() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();

  const zoomOran = Math.min(W / DUNYA_GENISLIK, H / DUNYA_YUKSEKLIK) * 0.9;
  ctx.scale(zoomOran, zoomOran);

  // Arka plan
  ctx.fillStyle = '#0a0000';
  ctx.fillRect(0, 0, DUNYA_GENISLIK, DUNYA_YUKSEKLIK);

  // Izgara
  ctx.strokeStyle = '#1a0505';
  ctx.lineWidth = 1 / zoomOran;
  for (let i = 0; i < DUNYA_GENISLIK; i += 100) {
    ctx.beginPath();
    ctx.moveTo(i, 0);
    ctx.lineTo(i, DUNYA_YUKSEKLIK);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i);
    ctx.lineTo(DUNYA_GENISLIK, i);
    ctx.stroke();
  }

  // Takım bölgeleri
  const renkler = ['#ffd740', '#ff1744', '#448aff', '#69f0ae'];
  const etiketler = ['🟡 Sarı', '🔴 Kırmızı', '🔵 Mavi', '🟢 Yeşil'];
  for (let i = 0; i < 4; i++) {
    ctx.beginPath();
    ctx.arc(TAKIM_KOSE[i].x, TAKIM_KOSE[i].y, 120, 0, Math.PI * 2);
    ctx.fillStyle = renkler[i] + '22';
    ctx.fill();
    ctx.strokeStyle = renkler[i];
    ctx.lineWidth = 3 / zoomOran;
    ctx.stroke();
    ctx.fillStyle = renkler[i];
    ctx.font = '30px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(etiketler[i], TAKIM_KOSE[i].x, TAKIM_KOSE[i].y - 80);
  }

  // Yılanları çiz
  for (let y of tumYilanlar) {
    for (let i = 0; i < y.segmentler.length; i++) {
      const seg = y.segmentler[i];
      const radius = Math.max(seg.r, 2);
      const grad = ctx.createRadialGradient(
        seg.x - radius * 0.2, seg.y - radius * 0.3, radius * 0.1,
        seg.x, seg.y, radius
      );
      grad.addColorStop(0, '#ffffff88');
      grad.addColorStop(0.4, seg.renk);
      grad.addColorStop(1, seg.renk);
      ctx.fillStyle = grad;
      ctx.shadowColor = seg.renk;
      ctx.shadowBlur = i === 0 ? 20 / zoomOran : 5 / zoomOran;
      ctx.beginPath();
      ctx.arc(seg.x, seg.y, radius, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    const bas = y.segmentler[0];
    const gozR = Math.max(bas.r * 0.15, 2);
    const gozOffset = bas.r * 0.3;
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(bas.x + y.yon.x * gozOffset - y.yon.y * gozOffset * 0.5,
            bas.y + y.yon.y * gozOffset + y.yon.x * gozOffset * 0.5,
            gozR, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(bas.x + y.yon.x * gozOffset + y.yon.y * gozOffset * 0.5,
            bas.y + y.yon.y * gozOffset - y.yon.x * gozOffset * 0.5,
            gozR, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1a0000';
    const bebekR = Math.max(gozR * 0.5, 1);
    ctx.beginPath();
    ctx.arc(bas.x + y.yon.x * gozOffset * 1.3 - y.yon.y * gozOffset * 0.5,
            bas.y + y.yon.y * gozOffset * 1.3 + y.yon.x * gozOffset * 0.5,
            bebekR, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(bas.x + y.yon.x * gozOffset * 1.3 + y.yon.y * gozOffset * 0.5,
            bas.y + y.yon.y * gozOffset * 1.3 - y.yon.x * gozOffset * 0.5,
            bebekR, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ffffff';
    ctx.font = Math.max(8, bas.r * 0.4) + 'px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(y.isim || 'Bot', bas.x, bas.y + bas.r + 16);
  }

  ctx.restore();
}

// ============================================================
// ANA ÇİZİM FONKSİYONU (Tüm modlar için)
// ============================================================
function cizimYap() {
  if (oyunModu === 'takimAvi') {
    takimAviCizim();
    return;
  }

  // Hayatta Kalma çizimi
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.scale(zoom, zoom);
  ctx.translate(-kamera.x, -kamera.y);

  ctx.fillStyle = '#0a0000';
  ctx.fillRect(0, 0, DUNYA_GENISLIK, DUNYA_YUKSEKLIK);
  ctx.strokeStyle = '#1a0505';
  ctx.lineWidth = 1 / zoom;
  for (let i = 0; i < DUNYA_GENISLIK; i += 80) {
    ctx.beginPath();
    ctx.moveTo(i, 0);
    ctx.lineTo(i, DUNYA_YUKSEKLIK);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i);
    ctx.lineTo(DUNYA_GENISLIK, i);
    ctx.stroke();
  }
  ctx.strokeStyle = '#ff5252';
  ctx.lineWidth = 4 / zoom;
  ctx.strokeRect(0, 0, DUNYA_GENISLIK, DUNYA_YUKSEKLIK);

  // Yemler
  for (let y of yemler) {
    ctx.shadowColor = y.renk;
    ctx.shadowBlur = 12 / zoom;
    ctx.fillStyle = y.renk;
    ctx.beginPath();
    ctx.arc(y.x, y.y, y.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath();
    ctx.arc(y.x - y.r * 0.2, y.y - y.r * 0.2, y.r * 0.3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  // Botlar
  for (let bot of botlar) {
    for (let i = 0; i < bot.segmentler.length; i++) {
      const seg = bot.segmentler[i];
      const radius = Math.max(seg.r, 2);
      const grad = ctx.createRadialGradient(
        seg.x - radius * 0.2, seg.y - radius * 0.3, radius * 0.1,
        seg.x, seg.y, radius
      );
      if (bot.boostAktif) {
        grad.addColorStop(0, '#ffff88');
        grad.addColorStop(0.3, '#ffd740');
        grad.addColorStop(1, '#ffab00');
      } else {
        grad.addColorStop(0, '#ffffff88');
        grad.addColorStop(0.3, bot.renk);
        grad.addColorStop(1, bot.renk);
      }
      ctx.fillStyle = grad;
      ctx.shadowColor = bot.boostAktif ? '#ffd740' : bot.renk;
      ctx.shadowBlur = (i === 0 ? (bot.boostAktif ? 25 : 15) : 5) / zoom;
      ctx.beginPath();
      ctx.arc(seg.x, seg.y, radius, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    const botBas = bot.segmentler[0];
    const gozR = Math.max(botBas.r * 0.18, 2);
    const gozOffset = botBas.r * 0.35;
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(botBas.x + bot.yon.x * gozOffset - bot.yon.y * gozOffset * 0.5,
            botBas.y + bot.yon.y * gozOffset + bot.yon.x * gozOffset * 0.5,
            gozR, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(botBas.x + bot.yon.x * gozOffset + bot.yon.y * gozOffset * 0.5,
            botBas.y + bot.yon.y * gozOffset - bot.yon.x * gozOffset * 0.5,
            gozR, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1a0000';
    const bebekR = Math.max(gozR * 0.5, 1);
    ctx.beginPath();
    ctx.arc(botBas.x + bot.yon.x * gozOffset * 1.3 - bot.yon.y * gozOffset * 0.5,
            botBas.y + bot.yon.y * gozOffset * 1.3 + bot.yon.x * gozOffset * 0.5,
            bebekR, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(botBas.x + bot.yon.x * gozOffset * 1.3 + bot.yon.y * gozOffset * 0.5,
            botBas.y + bot.yon.y * gozOffset * 1.3 - bot.yon.x * gozOffset * 0.5,
            bebekR, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = bot.boostAktif ? '#ffd740' : 'white';
    ctx.font = Math.max(8, botBas.r * 0.4) + 'px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(bot.isim + (bot.boostAktif ? '⚡' : ''), botBas.x, botBas.y + botBas.r + 16);
  }

  // Oyuncu
  for (let i = 0; i < yilan.length; i++) {
    const seg = yilan[i];
    const radius = Math.max(seg.r, 2);
    const grad = ctx.createRadialGradient(
      seg.x - radius * 0.2, seg.y - radius * 0.3, radius * 0.1,
      seg.x, seg.y, radius
    );
    grad.addColorStop(0, '#ff8a65');
    grad.addColorStop(0.4, '#e64a19');
    grad.addColorStop(0.7, '#bf360c');
    grad.addColorStop(1, '#880e4f');
    ctx.fillStyle = grad;
    ctx.shadowColor = '#ff6d00';
    ctx.shadowBlur = (i === 0 ? 20 : 6) / zoom;
    ctx.beginPath();
    ctx.arc(seg.x, seg.y, radius, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
  const bas = yilan[0];
  if (bas) {
    const gozR = Math.max(bas.r * 0.14, 2);
    const gozOffset = bas.r * 0.3;
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(bas.x + yon.x * gozOffset - yon.y * gozOffset * 0.5,
            bas.y + yon.y * gozOffset + yon.x * gozOffset * 0.5,
            gozR, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(bas.x + yon.x * gozOffset + yon.y * gozOffset * 0.5,
            bas.y + yon.y * gozOffset - yon.x * gozOffset * 0.5,
            gozR, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1a0000';
    const bebekR = Math.max(gozR * 0.5, 1);
    ctx.beginPath();
    ctx.arc(bas.x + yon.x * gozOffset * 1.4 - yon.y * gozOffset * 0.5,
            bas.y + yon.y * gozOffset * 1.4 + yon.x * gozOffset * 0.5,
            bebekR, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(bas.x + yon.x * gozOffset * 1.4 + yon.y * gozOffset * 0.5,
            bas.y + yon.y * gozOffset * 1.4 - yon.x * gozOffset * 0.5,
            bebekR, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// ============================================================
// OYUN BAŞLAT (Ana)
// ============================================================
function oyunuBaslat() {
  boostBtn.style.display = 'flex';
  if (oyunModu === 'hayattaKalma') {
    hayattaKalmaBaslat();
  } else {
    takimAviBaslat();
  }
}

// ============================================================
// BUTONLAR
// ============================================================
baslatBtn.addEventListener('click', function() {
  if (oyunAktif && !oyunBittiMi) return;
  oyunuBaslat();
});

sifirlaBtn.addEventListener('click', function() {
  oyunAktif = false;
  oyunBittiMi = false;
  boostAktif = false;
  boostBasili = false;
  boostBtn.classList.remove('turbo');
  boostBtn.style.background = 'rgba(255,82,82,0.2)';
  boostBoyut.textContent = '-0%';
  skor = 12;
  skorGosterge.textContent = '0';
  tumYilanlar = [];
  yilan = [];
  botlar = [];
  yemler = [];
  takimSayac.innerHTML = '';
  siralamaKutusu.innerHTML = '';
  if (animasyonId) cancelAnimationFrame(animasyonId);
  durumMesaji.textContent = '🔄 Oyun sıfırlandı';
  baslatBtn.textContent = '▶ Başlat';
  baslatBtn.disabled = false;
  boostBtn.style.display = 'flex';
  baslangicGorunumu();
});

// ============================================================
// BAŞLANGIÇ GÖRÜNÜMÜ
// ============================================================
function baslangicGorunumu() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0a0000';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#ff5252';
  ctx.font = '24px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('⚔️ ' + (oyunModu === 'hayattaKalma' ? 'Hayatta Kal' : 'Takım Savaşı'), W/2, H/2 - 20);
  ctx.fillStyle = '#888';
  ctx.font = '14px Arial';
  ctx.fillText('Başlat\'a bas', W/2, H/2 + 30);

  skorGosterge.textContent = '0';
  takimSayac.innerHTML = '';
  siralamaKutusu.innerHTML = '';
  durumMesaji.textContent = '▶️ ' + (oyunModu === 'hayattaKalma' ? 'Hayatta Kal' : 'Takım Avı') + ' - Başlat\'a bas';
  baslatBtn.textContent = '▶ Başlat';
  baslatBtn.disabled = false;
  boostBtn.style.display = oyunModu === 'hayattaKalma' ? 'flex' : 'none';
}

// ============================================================
// BAŞLAT
// ============================================================
baslangicGorunumu();
</script>
