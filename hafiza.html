<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Hafıza Kartları</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      background: linear-gradient(-45deg, #003321, #005c3d, #00402b, #007a50, #002417);
      background-size: 500% 500%;
      animation: gradientAkis 14s ease infinite;
      color: white;
      font-family: 'Poppins', sans-serif;
      text-align: center;
      padding: 40px 16px;
      min-height: 100vh;
      margin: 0;
    }
    @keyframes gradientAkis {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes nabizAt {
      0%, 100% { text-shadow: 0 0 15px #2ecc71, 0 0 30px #2ecc71; }
      50% { text-shadow: 0 0 25px #2ecc71, 0 0 50px #2ecc71; }
    }
    h1 {
      color: #2ecc71;
      animation: nabizAt 2.5s ease-in-out infinite;
      font-size: 30px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    p.aciklama {
      font-size: 16px;
      opacity: 0.85;
      margin-bottom: 26px;
    }
    #tahta {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      max-width: 380px;
      margin: 0 auto;
    }
    .kart {
      aspect-ratio: 1;
      background-color: rgba(255,255,255,0.06);
      border: 2px solid #2ecc71;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s, background-color 0.2s;
    }
    .kart:active {
      transform: scale(0.92);
    }
    .kart.acik {
      background-color: #2ecc71;
      color: #003321;
      transform: scale(1.05);
    }
    .kart.bulundu {
      background-color: #00d47a;
      color: white;
      border-color: #00d47a;
      box-shadow: 0 0 15px #00d47a;
    }
    #durum {
      margin-top: 26px;
      font-size: 18px;
      font-weight: 600;
      min-height: 28px;
    }
    a {
      color: #2ecc71;
      display: inline-block;
      margin-top: 34px;
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h1>🧠 Hafıza Kartları</h1>
  <p class="aciklama">Eşleşen çiftleri bul</p>

  <div id="tahta"></div>
  <p id="durum">Hamle: 0</p>

  <a href="index.html">⬅ Ana sayfaya dön</a>

  <script>
    const semboller = ["🍕","🍕","🚀","🚀","🎮","🎮","🐱","🐱","⚽","⚽","🎵","🎵","🌟","🌟","🍀","🍀"];
    let kartlar = semboller.sort(() => Math.random() - 0.5);

    let acikKartlar = [];
    let kilit = false;
    let hamle = 0;
    let bulunanSayisi = 0;

    const tahta = document.getElementById("tahta");
    const durum = document.getElementById("durum");

    kartlar.forEach((sembol, index) => {
      const kart = document.createElement("div");
      kart.classList.add("kart");
      kart.dataset.sembol = sembol;
      kart.dataset.index = index;
      kart.addEventListener("click", kartaTikla);
      tahta.appendChild(kart);
    });

    function kartaTikla(e) {
      const kart = e.currentTarget;

      if (kilit) return;
      if (kart.classList.contains("acik") || kart.classList.contains("bulundu")) return;

      kart.classList.add("acik");
      kart.textContent = kart.dataset.sembol;
      acikKartlar.push(kart);

      if (acikKartlar.length === 2) {
        hamle++;
        durum.textContent = "Hamle: " + hamle;
        kilit = true;

        setTimeout(() => {
          const [ilk, ikinci] = acikKartlar;

          if (ilk.dataset.sembol === ikinci.dataset.sembol) {
            ilk.classList.add("bulundu");
            ikinci.classList.add("bulundu");
            bulunanSayisi += 2;

            if (bulunanSayisi === kartlar.length) {
              durum.textContent = "🎉 Tebrikler! " + hamle + " hamlede bitirdin!";
            }
          } else {
            ilk.classList.remove("acik");
            ikinci.classList.remove("acik");
            ilk.textContent = "";
            ikinci.textContent = "";
          }

          acikKartlar = [];
          kilit = false;
        }, 700);
      }
    }
  </script>
</body>
</html>
