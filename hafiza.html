<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Hafıza Kartları</title>
  <style>
    body {
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      background-size: 400% 400%;
      animation: gradientAkis 15s ease infinite;
      color: white;
      font-family: sans-serif;
      text-align: center;
      padding-top: 40px;
      min-height: 100vh;
      margin: 0;
    }
    @keyframes gradientAkis {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    h1 {
      color: #00fff2;
      text-shadow: 0 0 10px #00fff2, 0 0 20px #00fff2;
    }
    #tahta {
      display: grid;
      grid-template-columns: repeat(4, 70px);
      gap: 12px;
      justify-content: center;
      margin-top: 30px;
    }
    .kart {
      width: 70px;
      height: 70px;
      background-color: rgba(255,255,255,0.08);
      border: 1px solid #00fff2;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      cursor: pointer;
      user-select: none;
    }
    .kart.acik {
      background-color: #00fff2;
      color: #0f0c29;
    }
    .kart.bulundu {
      background-color: #2ecc71;
      color: white;
      border-color: #2ecc71;
    }
    #durum {
      margin-top: 20px;
      font-size: 18px;
    }
    a {
      color: #00fff2;
      display: block;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <h1>🧠 Hafıza Kartları</h1>
  <p>Eşleşen çiftleri bul</p>

  <div id="tahta"></div>
  <p id="durum">Hamle: 0</p>

  <a href="index.html">⬅ Ana sayfaya dön</a>

  <script>
    const semboller = ["🍕","🍕","🚀","🚀","🎮","🎮","🐱","🐱","⚽","⚽","🎵","🎵","🌟","🌟","🍀","🍀"];
    let kartlar = semboller.sort(() => Math.random() - 0.5);

    let acikKartlar = [];
    let kilit = false;
    let hamle = 0;
    let bulunanSayisi = 0;

    const tahta = document.getElementById("tahta");
    const durum = document.getElementById("durum");

    kartlar.forEach((sembol, index) => {
      const kart = document.createElement("div");
      kart.classList.add("kart");
      kart.dataset.sembol = sembol;
      kart.dataset.index = index;
      kart.addEventListener("click", kartaTikla);
      tahta.appendChild(kart);
    });

    function kartaTikla(e) {
      const kart = e.target;

      if (kilit) return;
      if (kart.classList.contains("acik") || kart.classList.contains("bulundu")) return;

      kart.classList.add("acik");
      kart.textContent = kart.dataset.sembol;
      acikKartlar.push(kart);

      if (acikKartlar.length === 2) {
        hamle++;
        durum.textContent = "Hamle: " + hamle;
        kilit = true;

        setTimeout(() => {
          const [ilk, ikinci] = acikKartlar;

          if (ilk.dataset.sembol === ikinci.dataset.sembol) {
            ilk.classList.add("bulundu");
            ikinci.classList.add("bulundu");
            bulunanSayisi += 2;

            if (bulunanSayisi === kartlar.length) {
              durum.textContent = "🎉 Tebrikler! " + hamle + " hamlede bitirdin!";
            }
          } else {
            ilk.classList.remove("acik");
            ikinci.classList.remove("acik");
            ilk.textContent = "";
            ikinci.textContent = "";
          }

          acikKartlar = [];
          kilit = false;
        }, 700);
      }
    }
  </script>
</body>
</html>
