<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Yılan Oyunu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      background: linear-gradient(-45deg, #1a3300, #2e5c00, #204a00, #387a00, #142400);
      background-size: 500% 500%;
      animation: gradientAkis 14s ease infinite;
      color: white;
      font-family: 'Poppins', sans-serif;
      text-align: center;
      padding: 30px 16px;
      min-height: 100vh;
      margin: 0;
    }
    @keyframes gradientAkis {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes nabizAt {
      0%, 100% { text-shadow: 0 0 15px #7cfc00, 0 0 30px #7cfc00; }
      50% { text-shadow: 0 0 25px #7cfc00, 0 0 50px #7cfc00; }
    }
    h1 {
      color: #7cfc00;
      animation: nabizAt 2.5s ease-in-out infinite;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    #skor {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .zorluklar {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .zorluklar button {
      background-color: rgba(255,255,255,0.08);
      border: 2px solid #7cfc00;
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
    }
    .zorluklar button.secili {
      background-color: #7cfc00;
      color: #142400;
    }
    #oyunAlani {
      position: relative;
      width: 300px;
      height: 300px;
      max-width: 100%;
      aspect-ratio: 1;
      background-color: #0d1f00;
      border: 3px solid #7cfc00;
      border-radius: 14px;
      margin: 0 auto;
      overflow: hidden;
      touch-action: none;
    }
    .parca {
      position: absolute;
      width: 6.2%;
      height: 6.2%;
      background-color: #7cfc00;
      border-radius: 30%;
      transition: left 0.1s linear, top 0.1s linear;
    }
    .parca.bas {
      background-color: #a6ff33;
    }
    .yem {
      position: absolute;
      width: 6.2%;
      height: 6.2%;
      background-color: #ff4d4d;
      border-radius: 30%;
    }
    #durum {
      font-size: 18px;
      font-weight: 600;
      margin-top: 16px;
      min-height: 28px;
    }
    .kontroller {
      display: grid;
      grid-template-columns: repeat(3, 56px);
      grid-template-rows: repeat(2, 56px);
      gap: 6px;
      justify-content: center;
      margin: 18px auto 0;
    }
    .kontroller button {
      background-color: rgba(255,255,255,0.08);
      border: 2px solid #7cfc00;
      border-radius: 10px;
      font-size: 22px;
      color: white;
      cursor: pointer;
    }
    .kontroller button:active {
      background-color: #7cfc00;
    }
    #yukari { grid-column: 2; grid-row: 1; }
    #sol { grid-column: 1; grid-row: 2; }
    #asagi { grid-column: 2; grid-row: 2; }
    #sag { grid-column: 3; grid-row: 2; }
    button.baslat {
      margin-top: 18px;
      background-color: #7cfc00;
      border: none;
      color: #142400;
      padding: 12px 26px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
    }
    a {
      color: #7cfc00;
      display: inline-block;
      margin-top: 26px;
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h1>🐍 Yılan Oyunu</h1>
  <p id="skor">Skor: 0</p>

  <div class="zorluklar">
    <button id="btnKolay" onclick="zorlukSec('kolay')">Kolay</button>
    <button id="btnOrta" class="secili" onclick="zorlukSec('orta')">Orta</button>
    <button id="btnZor" onclick="zorlukSec('zor')">Zor</button>
  </div>

  <div id="oyunAlani"></div>

  <p id="durum">Zorluk seç ve "Başlat"a bas</p>
  <button class="baslat" onclick="oyunuBaslat()">▶ Başlat</button>

  <div class="kontroller">
    <button id="yukari" onclick="yonDegistir(0,-1)">⬆️</button>
    <button id="sol" onclick="yonDegistir(-1,0)">⬅️</button>
    <button id="asagi" onclick="yonDegistir(0,1)">⬇️</button>
    <button id="sag" onclick="yonDegistir(1,0)">➡️</button>
  </div>

  <a href="index.html">⬅ Ana sayfaya dön</a>

  <script>
    const alan = document.getElementById("oyunAlani");
    const kutuSayisi = 16;
    const yuzdeAdim = 100 / kutuSayisi;

    const hizlar = { kolay: 220, orta: 140, zor: 90 };
    let seciliZorluk = "orta";
    let adimSuresi = hizlar[seciliZorluk];

    let yilan, yon, sonrakiYon, yem, skor, oyunAktif, oyunDongusu;
    let yemElement = null;

    function zorlukSec(zorluk) {
      seciliZorluk = zorluk;
      adimSuresi = hizlar[zorluk];
      document.querySelectorAll(".zorluklar button").forEach(b => b.classList.remove("secili"));
      document.getElementById("btn" + zorluk.charAt(0).toUpperCase() + zorluk.slice(1)).classList.add("secili");
      if (oyunAktif) {
        clearInterval(oyunDongusu);
        oyunDongusu = setInterval(mantikAdimi, adimSuresi);
      }
    }

    function oyunuBaslat() {
      alan.innerHTML = "";
      yilan = [{x: 7, y: 7, el: null}];
      yon = {x: 0, y: 0};
      sonrakiYon = {x: 0, y: 0};
      skor = 0;
      oyunAktif = true;
      document.getElementById("skor").textContent = "Skor: 0";
      document.getElementById("durum").textContent = "Bir yön seç ve başla!";

      const bas = document.createElement("div");
      bas.className = "parca bas";
      konumAyarla(bas, yilan[0].x, yilan[0].y);
      alan.appendChild(bas);
      yilan[0].el = bas;

      yemUret();

      if (oyunDongusu) clearInterval(oyunDongusu);
      oyunDongusu = setInterval(mantikAdimi, adimSuresi);
    }

    function konumAyarla(el, x, y) {
      el.style.left = (x * yuzdeAdim) + "%";
      el.style.top = (y * yuzdeAdim) + "%";
    }

    function yemUret() {
      let uygun = false;
      let x, y;
      while (!uygun) {
        x = Math.floor(Math.random() * kutuSayisi);
        y = Math.floor(Math.random() * kutuSayisi);
        uygun = !yilan.some(p => p.x === x && p.y === y);
      }
      yem = {x, y};

      if (yemElement) yemElement.remove();
      yemElement = document.createElement("div");
      yemElement.className = "yem";
      konumAyarla(yemElement, x, y);
      alan.appendChild(yemElement);
    }

    function yonDegistir(x, y) {
      if (yon.x === -x && yon.y === -y) return;
      sonrakiYon = {x, y};
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowUp") yonDegistir(0, -1);
      if (e.key === "ArrowDown") yonDegistir(0, 1);
      if (e.key === "ArrowLeft") yonDegistir(-1, 0);
      if (e.key === "ArrowRight") yonDegistir(1, 0);
    });

    function mantikAdimi() {
      if (!oyunAktif) return;
      if (yon.x === 0 && yon.y === 0 && sonrakiYon.x === 0 && sonrakiYon.y === 0) return;

      yon = sonrakiYon;
      const yeniX = yilan[0].x + yon.x;
      const yeniY = yilan[0].y + yon.y;

      if (yeniX < 0 || yeniX >= kutuSayisi || yeniY < 0 || yeniY >= kutuSayisi) {
        oyunBitti();
        return;
      }
      for (let parca of yilan) {
        if (parca.x === yeniX && parca.y === yeniY) {
          oyunBitti();
          return;
        }
      }

      yilan[0].el.classList.remove("bas");

      const yeniBas = document.createElement("div");
      yeniBas.className = "parca bas";
      konumAyarla(yeniBas, yeniX, yeniY);
      alan.appendChild(yeniBas);

      yilan.unshift({x: yeniX, y: yeniY, el: yeniBas});

      if (yeniX === yem.x && yeniY === yem.y) {
        skor++;
        document.getElementById("skor").textContent = "Skor: " + skor;
        yemUret();
      } else {
        const kuyruk = yilan.pop();
        kuyruk.el.remove();
      }
    }

    function oyunBitti() {
      oyunAktif = false;
      clearInterval(oyunDongusu);
      document.getElementById("durum").textContent = "💀 Oyun bitti! Skor: " + skor;
    }
  </script>
</body>
</html>
